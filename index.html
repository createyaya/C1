<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consciousness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #fff;
            color: #000;
        }

        /* ===== 黑色顶栏：品牌Logo + 主导航 ===== */
        .site-header {
            background-color: #000;
            padding: 18px 0 0;
            position: fixed; /* 大黑条固定在最上方，完全不参与滚动 */
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        /* 正文白色部分：独立滚动空间 */
        #site-main {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            overflow-y: auto;
        }

        .site-logo {
            text-align: center;
            color: #fff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 26px;
            font-style: italic;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .main-nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 28px;
            padding: 0 12px 14px;
        }

        .main-nav li {
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            color: #fff;
            transition: opacity 0.2s;
            position: relative;
            padding-bottom: 6px;
        }

        .main-nav li:hover {
            opacity: 0.65;
        }

        .main-nav li.active {
            font-weight: 500;
        }

        .main-nav li.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #fff;
        }

        /* ===== 栏目大标题（VOGUE: 64px, 上54 下40） ===== */
        .category-hero {
            text-align: center;
        }

        .category-hero h1 {
            font-size: 64px;
            font-weight: normal;
            margin: 0 auto;
            max-width: 1470px;
            padding: 54px 20px 40px;
        }

        /* 子导航（专题标题行，VOGUE h2: 32px 居中） */
        .sub-nav {
            text-align: center;
            padding: 0 20px;
            margin-bottom: 30px;
        }

        .sub-nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px 30px;
        }

        .sub-nav li {
            cursor: pointer;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 0.08px;
            color: #000;
            transition: opacity 0.2s;
        }

        .sub-nav li:hover {
            opacity: 0.55;
        }

        .sub-nav li.active {
            text-decoration: underline;
            text-underline-offset: 10px;
            text-decoration-thickness: 3px;
        }

        /* ===== 卡片区容器（VOGUE: max-width 1470, 左右45px） ===== */
        .card-section {
            max-width: 1470px;
            margin: 0 auto;
            padding: 0 45px;
        }

        /* 卡片区：row5，一行5张（VOGUE: 19%宽 上限280 列距1.25%） */
        .card-grid.row5 {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .card-grid.row5 .brand-card {
            width: 19%;
            max-width: 280px;
            margin-right: 1.25%;
            margin-bottom: 38px;
        }

        .card-grid.row5 .brand-card:nth-child(5n) {
            margin-right: 0;
        }

        /* ===== 卡片 ===== */
        .brand-card {
            cursor: pointer;
        }

        .brand-card .card-img {
            display: block;
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover; /* 统一裁切到2:3，不同尺寸的卡牌不会拉伸变形 */
            object-position: top; /* 卡牌优先保住顶部标题区 */
            background-color: #efefef;
            background-size: cover;
            background-position: center;
            transition: opacity 0.25s;
            margin-bottom: 20px;
        }

        .brand-card:hover .card-img {
            opacity: 0.8;
        }

        .brand-card .card-name {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.08px;
            text-align: center;
            color: #000;
        }

        /* LATEST IN 标题（VOGUE h2: 32px） */
        .latest-title {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 0.08px;
            text-align: center;
            max-width: 1470px;
            margin: 0 auto 30px;
            padding: 60px 45px 0;
        }

        /* LATEST IN 分区：左侧品牌名录 + 右侧卡片 */
        .latest-flex {
            display: flex;
            align-items: flex-start;
            gap: 45px;
            max-width: 1470px;
            margin: 0 auto;
            padding: 0 45px;
        }

        .latest-flex .card-section {
            flex: 1;
            padding: 0;
            min-width: 0;
        }

        /* ===== 品牌名录 A-Z（VOGUE: 320px宽 #707070边框） ===== */
        .designer-directory {
            flex: none;
            width: 260px;
        }

        .directory-panel {
            display: flex;
            border: 1px solid #c0c0c0;
            background: #fff;
            font-family: "Avant Garde Gothic", Avantgarde, Futura, "Century Gothic", "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* 左侧：品牌列表（VOGUE: 一次显示21行=21×34px，隐藏滚动条） */
        .directory-list {
            flex: 1;
            min-width: 0;
            height: 759px; /* 20 + 21行×34 + 25(下边距，同VOGUE) */
            overflow-y: auto;
            padding: 20px 10px 25px 35px;
            scrollbar-width: none;
        }

        .directory-list::-webkit-scrollbar {
            display: none;
        }

        .directory-letter {
            font-size: 28px;
            font-weight: 500;
            margin: 20px 0;
        }

        .directory-letter:first-child {
            margin-top: 0;
        }

        .directory-letter span {
            border-bottom: 4px solid #000;
            padding-bottom: 2px;
        }

        .directory-list ul {
            list-style: none;
        }

        .directory-list li {
            font-size: 14px;
            font-weight: 400;
            line-height: 34px;
            height: 34px;
            max-width: 20ch; /* 长名截断为20个字符，同VOGUE */
            color: #000;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .directory-list li:hover {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* 流派分组名录（艺术栏目）：组名 + 英文/时期小注，无 A-Z 索引栏 */
        .directory-panel.group-mode .directory-list {
            padding: 20px 20px 25px 26px;
        }

        .directory-sub {
            font-size: 10px;
            letter-spacing: 2px;
            color: #8a8a8a;
            margin: 4px 0 8px 2px;
        }

        .directory-panel.group-mode .directory-list li {
            max-width: none;
        }

        /* 右侧：A-Z 字母索引栏 */
        .directory-rail {
            flex: none;
            width: 34px;
            padding: 20px 0 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* A-Z#均匀铺满整栏 */
            height: 759px;
        }

        .directory-rail button {
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 400;
            color: #000;
            cursor: pointer;
            padding: 2px 4px;
            line-height: 1.2;
        }

        /* 点选品牌后展示的单品牌卡片区 */
        .designer-view {
            max-width: 1470px;
            margin: 0 auto;
            padding: 30px 45px 0;
        }

        .designer-view .designer-name {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .designer-view .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 38px 1.25%;
        }

        .designer-view .brand-card {
            width: 19%;
            max-width: 280px;
        }

        /* ===== LATEST IN 已收录品牌卡：悬停品牌标题出现整行下划线，点击进入素材页 ===== */
        .brand-card.brand-link .card-name {
            cursor: pointer;
            position: relative;
            padding-bottom: 8px;
        }

        .brand-card.brand-link .card-name::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background-color: #000;
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.25s ease;
        }

        .brand-card.brand-link .card-name:hover::after {
            transform: scaleX(1);
        }

        /* ===== 品牌内页（点击 LATEST IN 卡片/名录进入，hash 路由整页切换） ===== */
        .brand-page {
            max-width: 1470px;
            margin: 0 auto;
            padding: 0 45px 60px;
        }

        .bp-back {
            display: inline-block;
            padding: 26px 0 6px;
            font-size: 13px;
            letter-spacing: 2px;
            color: #000;
            cursor: pointer;
        }

        .bp-back:hover {
            opacity: 0.55;
        }

        .bp-title {
            font-size: 52px;
            font-weight: 500;
            letter-spacing: 4px;
            text-align: center;
            margin: 18px 0 34px;
        }

        .bp-label {
            text-align: center;
            margin-bottom: 50px;
        }

        .bp-label span {
            display: inline-block;
            border: 1px solid #000;
            padding: 16px 54px;
            font-size: 20px;
            letter-spacing: 12px;
            text-indent: 12px; /* 平衡末字字距，让文字在框内居中 */
        }

        .brand-page .assets-grid {
            column-count: 3;
            column-gap: 16px;
        }

        .brand-page .asset-item {
            break-inside: avoid;
            margin: 0 0 18px;
        }

        .brand-page .asset-item img {
            width: 100%;
            display: block;
            cursor: zoom-in;
            background-color: #efefef;
            transition: opacity 0.25s;
        }

        .brand-page .asset-item img:hover {
            opacity: 0.85;
        }

        .brand-page .asset-item figcaption {
            font-size: 12px;
            letter-spacing: 0.5px;
            color: #8a8a8a;
            padding: 8px 2px 0;
        }

        /* ===== 我的名录：卡片一~五（点击收录 LATEST IN 品牌与素材图） ===== */
        .my-card {
            position: relative;
        }

        .my-card-empty {
            width: 100%;
            aspect-ratio: 2 / 3;
            border: 1px dashed #b5b5b5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #9a9a9a;
            background-color: #fafafa;
            transition: border-color 0.2s, color 0.2s;
            margin-bottom: 20px;
        }

        .my-card:hover .my-card-empty {
            border-color: #000;
            color: #000;
        }

        .my-card-empty .plus {
            font-size: 36px;
            font-weight: 200;
            line-height: 1;
        }

        .my-card-empty .hint {
            font-size: 12px;
            letter-spacing: 2px;
        }

        .my-card-filled {
            width: 100%;
            aspect-ratio: 2 / 3;
            background-size: cover;
            background-position: top;
            background-color: #efefef;
            transition: opacity 0.25s;
            margin-bottom: 20px;
        }

        .my-card:hover .my-card-filled {
            opacity: 0.85;
        }

        .my-card .card-name {
            cursor: pointer;
        }

        .my-card-tools {
            position: absolute;
            top: 8px;
            right: 8px;
            display: none;
            gap: 6px;
            z-index: 2;
        }

        .my-card:hover .my-card-tools {
            display: flex;
        }

        .my-card-tools button {
            border: none;
            background-color: rgba(0, 0, 0, 0.78);
            color: #fff;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 5px 10px;
            cursor: pointer;
        }

        .my-card-tools button:hover {
            background-color: #000;
        }

        /* 艺术卡：图片完整显示（自然比例，不裁切） */
        .art-card .card-img {
            aspect-ratio: auto;
            height: auto;
            object-fit: contain;
            background-color: #efefef;
        }

        .art-frame:active { cursor: grabbing; }

        .card-sub {
            font-size: 12px;
            letter-spacing: 1px;
            color: #8a8a8a;
            margin-top: 4px;
            text-align: center;
        }

        .home-big-tools {
            position: relative;
        }

        .home-big-tools .my-card-tools {
            display: flex;
        }

        .my-card-gray {
            width: 100%;
            aspect-ratio: 2 / 3;
            background-color: #d9d9d9;
            margin-bottom: 20px;
        }

        .my-card-blank {
            width: 100%;
            aspect-ratio: 2 / 3;
            margin-bottom: 20px;
        }

        /* 弹出选择器：选品牌 → 选素材图 */
        #card-picker {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 250;
        }

        #card-picker.open {
            display: flex;
        }

        .picker-panel {
            background-color: #fff;
            width: min(940px, 92vw);
            max-height: 86vh;
            overflow-y: auto;
            padding: 30px 34px 34px;
            position: relative;
        }

        .picker-title {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 22px;
        }

        .picker-close {
            position: absolute;
            top: 14px;
            right: 18px;
            border: none;
            background: none;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
        }

        .picker-brands {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
        }

        .picker-brands button {
            border: 1px solid #000;
            background-color: #fff;
            color: #000;
            padding: 9px 20px;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .picker-brands button.active {
            background-color: #000;
            color: #fff;
        }

        .picker-tip {
            font-size: 12px;
            letter-spacing: 0.5px;
            color: #8a8a8a;
        }

        /* ===== 获取品牌生态：五步走专页 ===== */
        .eco-page {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px 20px 60px;
        }

        .eco-brandsel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .eco-brandsel button {
            border: 1px solid #000;
            background-color: #fff;
            color: #000;
            padding: 9px 20px;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .eco-brandsel button.active {
            background-color: #000;
            color: #fff;
        }

        .eco-note {
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            color: #8a8a8a;
            margin-bottom: 40px;
        }

        .eco-step {
            display: flex;
            gap: 24px;
            margin-bottom: 44px;
            align-items: flex-start;
        }

        .eco-num {
            font-family: Georgia, serif;
            font-size: 42px;
            font-weight: 700;
            width: 62px;
            flex: none;
            line-height: 1.1;
        }

        .eco-body { flex: 1; min-width: 0; }

        .eco-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .eco-desc {
            font-size: 13px;
            line-height: 1.9;
            color: #333;
            margin-bottom: 14px;
        }

        .eco-shot {
            width: 100%;
            display: block;
            border: 1px solid #ddd;
            margin-bottom: 8px;
        }

        .eco-shotcap {
            font-size: 11px;
            letter-spacing: 1px;
            color: #8a8a8a;
            margin-bottom: 14px;
        }

        .eco-btn {
            display: inline-block;
            border: 1px solid #000;
            padding: 9px 22px;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            text-decoration: none;
            transition: background-color 0.2s, color 0.2s;
        }

        .eco-btn:hover {
            background-color: #000;
            color: #fff;
        }

        .eco-search {
            display: flex;
            max-width: 580px;
            margin-bottom: 10px;
        }

        .eco-search input {
            flex: 1;
            min-width: 0;
            border: 2px solid #000;
            border-right: none;
            padding: 10px 14px;
            font-size: 14px;
            outline: none;
        }

        .eco-search button {
            border: none;
            color: #fff;
            padding: 10px 22px;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            white-space: nowrap;
        }

        .eco-search.bili input { border-color: #fb7299; }
        .eco-search.bili button { background-color: #fb7299; }
        .eco-search.bili button:hover { background-color: #f56c8b; }
        .eco-search.xhs input { border-color: #ff2442; }
        .eco-search.xhs button { background-color: #ff2442; }
        .eco-search.xhs button:hover { background-color: #e01f3d; }

        .eco-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            flex: none;
            align-self: stretch;
            background-color: #ff2442;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            border-radius: 10px 0 0 10px;
            line-height: 1.3;
            padding: 0 6px;
        }

        .picker-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .picker-grid .picker-thumb {
            width: calc(25% - 9px);
            cursor: pointer;
        }

        .picker-grid .picker-thumb img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            object-position: top;
            display: block;
            background-color: #efefef;
        }

        .picker-grid .picker-thumb:hover img {
            outline: 2px solid #000;
        }

        .picker-grid .picker-thumb figcaption {
            font-size: 11px;
            color: #8a8a8a;
            padding: 6px 2px 0;
        }

        /* 灯箱：点击素材大图预览，点击任意处关闭 */
        #lightbox {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.93);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            cursor: zoom-out;
        }

        #lightbox.open {
            display: flex;
        }

        #lightbox img {
            max-width: 92vw;
            max-height: 92vh;
        }

        /* ===== 城史：右上角"当前城市"小组件 ===== */
        .city-widget {
            position: fixed;
            top: 96px;
            right: 24px;
            z-index: 90;
            text-align: right;
        }

        .city-widget-trigger {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #000;
            color: #fff;
            border: none;
            padding: 10px 18px;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 22px;
            transition: opacity 0.2s;
        }

        .city-widget-trigger:hover {
            opacity: 0.8;
        }

        .city-widget-dropdown {
            display: none;
            margin-top: 8px;
            width: 240px;
            background-color: #fff;
            border: 1px solid #111;
            text-align: left;
        }

        .city-widget-empty {
            padding: 10px 12px;
            font-size: 12px;
            color: #999;
        }

        .directory-spacer {
            flex: none;
            width: 260px;
        }

        .city-widget-dropdown.open {
            display: block;
        }

        .city-widget-search {
            width: 100%;
            border: none;
            border-bottom: 1px solid #111;
            padding: 10px 12px;
            font-size: 13px;
            outline: none;
        }

        .city-widget-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .city-widget-item {
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
        }

        .city-widget-item:hover {
            background-color: #f2f2f2;
        }

        /* 手机端适配（VOGUE 750px断点：边距20px） */
        @media (max-width: 768px) {
            .site-logo {
                font-size: 20px;
                margin-bottom: 10px;
            }

            .main-nav ul {
                gap: 6px 16px;
            }

            .main-nav li {
                font-size: 12px;
            }

            .category-hero h1 {
                font-size: 32px;
                padding: 40px 16px 30px;
            }

            .sub-nav li {
                font-size: 16px;
            }

            .card-section {
                padding: 0 20px;
            }

            /* LATEST区：手机端一行2张（VOGUE: 48%） */
            .card-grid.row5 .brand-card {
                width: 48%;
                max-width: 320px;
                margin-right: 0;
                margin-bottom: 34px;
            }

            .brand-card .card-img {
                margin-bottom: 10px;
            }

            .brand-card .card-name {
                font-size: 15px;
            }

            .latest-title {
                font-size: 20px;
                padding-top: 45px;
            }

            /* LATEST IN：手机端名录在上方占满宽 */
            .latest-flex {
                flex-direction: column;
                gap: 24px;
                padding: 0 20px;
            }

            .designer-directory {
                width: 100%;
            }

            .directory-list {
                padding: 14px 10px 20px 20px;

        // 卡片图片路径：已收录品牌 → 素材文件夹展示图（cardImage 优先，缺省用卡牌封面）；其余 → images/<栏目>/<子页名>/<卡片名>.png
        function cardImagePath(category, subpage, cardName) {
            const asset = BRAND_ASSETS[cardName];
            if (asset) return `${asset.folder}/${asset.cardImage || asset.cover}`;
            return `images/${category}/${subpage}/${cardName}.png`;
        }

        // ===== 我的名录：卡片一~五（按栏目隔离：品牌收品牌、城史收城史） =====
        // 按栏目分库存：brand 与 city 各自独立收录
        function myCardsKey(type) { return 'ideology-my-cards-' + type; }

        function loadMyCards(type) {
            try {
                const v = JSON.parse(localStorage.getItem(myCardsKey(type)));
                if (Array.isArray(v)) return v;
            } catch (e) {}
            return [null, null, null, null, null];
        }

        function saveMyCards(cards, type) {
            try { localStorage.setItem(myCardsKey(type), JSON.stringify(cards)); } catch (e) {}
        }

        function renderMyCards(grid, type) {
            grid.innerHTML = '';
            if (type === 'city') { renderCityCards(grid); return; }
            const cards = loadMyCards(type);
            for (let i = 0; i < 5; i++) {
                grid.appendChild(createMyCard(i, cards[i], type));
            }
        }

        // 城史名录行：首位 = 当前城市（自动跟随右上角选择），后四位空白
        function renderCityCards(grid) {
            let saved = null;
            try { saved = localStorage.getItem('ideology-my-city'); } catch (e) {}
            grid.appendChild(createCityCurrentCard(saved));
            // 后续卡位：可上传图片，可自行增加
            appendCitySlots(grid, 'row', ['城位一', '城位二', '城位三', '城位四']);
        }

        // ===== 城史通用卡位：上传图片 + 无限增加 =====
        function loadSlotNames(key, initial) {
            try {
                const v = JSON.parse(localStorage.getItem('ideology-slots-' + key));
                if (Array.isArray(v)) return v;
            } catch (e) {}
            return initial.slice();
        }

        function saveSlotNames(key, list) {
            try { localStorage.setItem('ideology-slots-' + key, JSON.stringify(list)); } catch (e) {}
        }

        function appendCitySlots(container, key, initial) {
            loadSlotNames(key, initial).forEach(n => container.appendChild(createArtCard(n)));
            const card = document.createElement('div');
            card.className = 'brand-card my-card';
            const empty = document.createElement('div');
            empty.className = 'my-card-empty';
            empty.style.cursor = 'pointer';
            empty.innerHTML = '<div class="plus">＋</div><div class="hint">增加卡位</div>';
            card.appendChild(empty);
            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = '增加卡位';
            card.appendChild(name);
            card.addEventListener('click', () => {
                const list2 = loadSlotNames(key, initial);
                const nm = (window.prompt('卡位名称（留空自动编号）') || ('卡位' + (list2.length + 1))).trim();
                list2.push(nm);
                saveSlotNames(key, list2);
                refreshCityViews();
            });
            container.appendChild(card);
        }

        function refreshCityViews() {
            renderMyCards(document.getElementById('card-grid'), 'city');
            renderCityLatest();
        }

        // LATEST IN CITY：邯郸卡 + 上传卡位（无限增加）
        function renderCityLatest() {
            const grid = document.getElementById('latest-grid');
            if (!grid) return;
            grid.innerHTML = '';
            grid.appendChild(createCard('city', 'latest', 'Handan 邯郸'));
            appendCitySlots(grid, 'latest', ['卡片二', '卡片三', '卡片四', '卡片五']);
        }

        function createCityCurrentCard(savedText) {
            const card = document.createElement('div');
            card.className = 'brand-card my-card';
            if (savedText) {
                const entry = SITE_DATA.city.designers.find(n => n.endsWith(' ' + savedText));
                const key = entry || savedText;
                const asset = BRAND_ASSETS[key];
                if (asset) {
                    const filled = document.createElement('div');
                    filled.className = 'my-card-filled';
                    filled.style.backgroundImage = `url("${asset.folder}/${asset.cardImage || asset.cover}")`;
                    card.appendChild(filled);
                    const name = document.createElement('div');
                    name.className = 'card-name';
                    name.textContent = savedText;
                    card.appendChild(name);
                    // 点击 → 视觉意识形态内页
                    card.addEventListener('click', () => showBrandAssets(key));
                    // 悬停工具：取消当前城市
                    const tools = document.createElement('div');
                    tools.className = 'my-card-tools';
                    const del = document.createElement('button');
                    del.textContent = '取消';
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        try { localStorage.removeItem('ideology-my-city'); } catch (e2) {}
                        refreshCityCards();
                    });
                    tools.appendChild(del);
                    card.appendChild(tools);
                } else {
                    const gray = document.createElement('div');
                    gray.className = 'my-card-gray';
                    card.appendChild(gray);
                    const name = document.createElement('div');
                    name.className = 'card-name';
                    name.textContent = savedText;
                    card.appendChild(name);
                }
            } else {
                const empty = document.createElement('div');
                empty.className = 'my-card-empty';
                empty.style.cursor = 'default';
                empty.innerHTML = '<div class="plus">◇</div><div class="hint">在右上角选择你的城市</div>';
                card.appendChild(empty);
            }
            return card;
        }

        function refreshCityCards() {
            renderMyCards(document.getElementById('card-grid'), 'city');
        }

        function createMyCard(index, data, type) {
            const card = document.createElement('div');
            card.className = 'brand-card my-card';
            if (data && BRAND_ASSETS[data.brand]) {
                const asset = BRAND_ASSETS[data.brand];
                const filled = document.createElement('div');
                filled.className = 'my-card-filled';
                // 收录卡统一展示该品牌的设计师肖像（cardImage）
                filled.style.backgroundImage = `url("${asset.folder}/${asset.cardImage || asset.cover}")`;
                card.appendChild(filled);
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = data.brand;
                card.appendChild(name);
                // 点击收录卡 → 进入该品牌的视觉意识形态内页
                card.addEventListener('click', () => showBrandAssets(data.brand));
                // 悬停工具：进入官网购买 / 移除
                const tools = document.createElement('div');
                tools.className = 'my-card-tools';
                const shop = document.createElement('button');
                shop.textContent = '进入官网购买';
                shop.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (asset.site) window.open(asset.site, '_blank');
                });
                const del = document.createElement('button');
                del.textContent = '移除';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const cards = loadMyCards(type);
                    cards[index] = null;
                    saveMyCards(cards, type);
                    renderMyCards(document.getElementById('card-grid'), type);
                });
                tools.appendChild(shop);
                tools.appendChild(del);
                card.appendChild(tools);
            } else if (data) {
                // 已收录但未建素材库：灰色占位卡，显示名称，无点击功能
                const gray = document.createElement('div');
                gray.className = 'my-card-gray';
                card.appendChild(gray);
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = data.brand;
                card.appendChild(name);
            } else {
                const empty = document.createElement('div');
                empty.className = 'my-card-empty';
                empty.innerHTML = '<div class="plus">+</div><div class="hint">' + (type === 'city' ? '收录城市' : '收录品牌') + '</div>';
                card.appendChild(empty);
                card.addEventListener('click', () => openPicker(index, type));
            }
            return card;
        }

        // ===== 弹出选择器：按栏目类型选条目 → 选素材图 → 收录到卡片 =====
        let pickerSlot = null;
        let pickerBrand = null;
        let pickerType = 'brand';

        function openPicker(slot, type) {
            pickerSlot = slot;
            pickerType = type || 'brand';
            pickerBrand = null;
            ensurePicker();
            renderPicker();
            document.getElementById('card-picker').classList.add('open');
        }

        function closePicker() {
            document.getElementById('card-picker').classList.remove('open');
        }

        function ensurePicker() {
            if (document.getElementById('card-picker')) return;
            const overlay = document.createElement('div');
            overlay.id = 'card-picker';
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closePicker();
            });
            const panel = document.createElement('div');
            panel.className = 'picker-panel';
            overlay.appendChild(panel);
            document.body.appendChild(overlay);
        }

        function renderPicker() {
            const asset = pickerBrand ? BRAND_ASSETS[pickerBrand] : null;
            const panel = document.querySelector('#card-picker .picker-panel');
            panel.innerHTML = '';

            const close = document.createElement('button');
            close.className = 'picker-close';
            close.textContent = '×';
            close.addEventListener('click', closePicker);
            panel.appendChild(close);

            const title = document.createElement('div');
            title.className = 'picker-title';
            title.textContent = `${pickerType === 'city' ? '收录城市' : '收录品牌'} · 卡片${'一二三四五'[pickerSlot]}`;
            panel.appendChild(title);

            const brands = document.createElement('div');
            brands.className = 'picker-brands';
            // 只列出本栏目类型的条目：品牌收品牌、城史收城史
            // 点击品牌名即完成收录——展示图统一用该品牌的设计师肖像，不再逐张选图
            Object.keys(BRAND_ASSETS).filter(b => (BRAND_ASSETS[b].type || 'brand') === pickerType).forEach(b => {
                const btn = document.createElement('button');
                btn.textContent = b;
                btn.addEventListener('click', () => {
                    const cards = loadMyCards(pickerType);
                    cards[pickerSlot] = { brand: b };
                    saveMyCards(cards, pickerType);
                    closePicker();
                    renderMyCards(document.getElementById('card-grid'), pickerType);
                });
                brands.appendChild(btn);
            });
            panel.appendChild(brands);

            const tip = document.createElement('div');
            tip.className = 'picker-tip';
            tip.textContent = '点击品牌名完成收录 · 收录后统一展示设计师肖像';
            panel.appendChild(tip);
        }

        // 创建卡片（图片加载失败时显示灰色占位块）
        function createCard(category, subpage, cardName) {
            const card = document.createElement('div');
            card.className = 'brand-card';

            // 已收录品牌：整卡可点击进入品牌素材页
            if (BRAND_ASSETS[cardName]) {
                card.classList.add('brand-link');
                card.addEventListener('click', () => showBrandAssets(cardName));
            }

            const img = document.createElement('img');
            img.className = 'card-img';
            img.src = cardImagePath(category, subpage, cardName);
            img.alt = cardName;
            img.onerror = function() {
                const placeholder = document.createElement('div');
                placeholder.className = 'card-img';
                img.replaceWith(placeholder);
            };

            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = cardName;

            card.appendChild(img);
            card.appendChild(name);
            return card;
        }

        // 渲染一个栏目：大标题 + 子导航 + 精选卡区(3张) + LATEST IN(5张/行 + 名录)
        function renderCategory(category) {
            const data = SITE_DATA[category];
            const main = document.getElementById('site-main');
            main.innerHTML = '';

            // 栏目大标题
            const hero = document.createElement('div');
            hero.className = 'category-hero';
            hero.innerHTML = `<h1>${data.hero}</h1>`;
            main.appendChild(hero);

            // 子导航
            const subNav = document.createElement('nav');
            subNav.className = 'sub-nav';
            const ul = document.createElement('ul');
            data.subpages.forEach((sp, i) => {
                const li = document.createElement('li');
                li.textContent = sp.name;
                if (i === 0) li.classList.add('active');
                li.addEventListener('click', () => {
                    ul.querySelectorAll('li').forEach(x => x.classList.remove('active'));
                    li.classList.add('active');
                    renderCardGrid(category, sp);
                });
                ul.appendChild(li);
            });
            subNav.appendChild(ul);
            main.appendChild(subNav);

            // 精选卡片区（row3：一行3张）
            const gridSection = document.createElement('div');
            gridSection.className = 'card-section';
            const grid = document.createElement('div');
            grid.className = 'card-grid row5';
            grid.id = 'card-grid';
            gridSection.appendChild(grid);
            main.appendChild(gridSection);

            // LATEST IN 标题
            const latestTitle = document.createElement('div');
            latestTitle.className = 'latest-title';
            latestTitle.textContent = `LATEST IN ${data.hero.split(' ')[0]}`;
            main.appendChild(latestTitle);

            // LATEST IN：左侧品牌名录 + 右侧5张/行卡片
            const latestFlex = document.createElement('div');
            latestFlex.className = 'latest-flex';

            const latestSection = document.createElement('div');
            latestSection.className = 'card-section';
            latestSection.style.padding = '0';
            const latestGrid = document.createElement('div');
            latestGrid.id = 'latest-grid';
            latestGrid.className = 'card-grid row5';
            if (category === 'city') {
                latestGrid.appendChild(createCard(category, 'latest', 'Handan 邯郸'));
                appendCitySlots(latestGrid, 'latest', ['卡片二', '卡片三', '卡片四', '卡片五']);
            } else {
                data.latestCards.forEach(cardName => {
                    latestGrid.appendChild(createCard(category, 'latest', cardName));
                });
            }
            latestSection.appendChild(latestGrid);
            latestFlex.appendChild(latestSection);
            main.appendChild(latestFlex);

            // 名录：艺术按流派分组；城史用右上角"当前城市"小组件；品牌按 A-Z
            if (data.artGroups) {
                renderGroupDirectory(latestFlex, category, data.artGroups);
            } else if (category === 'city') {
                const spacer = document.createElement('div');
                spacer.className = 'directory-spacer';
                latestFlex.prepend(spacer);
                renderCityWidget(main, data);
            } else if (data.designers && data.designers.length > 0) {
                renderDesignerDirectory(latestFlex, category, data.designers, data.designerZh);
            }

            // 默认渲染第一个子页
            renderCardGrid(category, data.subpages[0]);
        }

        // 渲染某子页的精选卡片（品牌、城史 = 我的名录；艺术 = 导入图片卡/定表；其他 = 占位卡）
        function renderCardGrid(category, subpage) {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            currentSubpage = subpage;
            if (category === 'brand' || category === 'city') {
                const eco = category === 'brand' && subpage.name === '生态';
                const lf = document.querySelector('.latest-flex');
                if (lf) lf.style.display = eco ? 'none' : '';
                const lt = document.querySelector('.latest-title');
                if (lt) lt.style.display = eco ? 'none' : '';
                grid.style.display = eco ? 'none' : '';
                document.querySelectorAll('.eco-page').forEach(x => x.remove());
                if (eco) { renderEcoPage(grid); }
                else { renderMyCards(grid, category); }
                return;
            }
            if (category === 'art') {
                if (subpage.name === '定表') {
                    renderDingbiao(grid);
                    // 定表：只展示收录的图片，隐藏 LATEST IN 标题、卡片行与名录
                    const lf = document.querySelector('.latest-flex');
                    if (lf) lf.style.display = 'none';
                    const lt = document.querySelector('.latest-title');
                    if (lt) lt.style.display = 'none';
                    grid.style.paddingBottom = '80px';
                } else {
                    subpage.cards.forEach((n, idx) => grid.appendChild(createArtCard(n, null, { firstBtn: { index: idx, cards: subpage.cards } })));
                    updateArtDirectory(subpage);
                    renderArtLatest(subpage);
                    grid.style.paddingBottom = '';
                    const lf = document.querySelector('.latest-flex');
                    if (lf) lf.style.display = '';
                    const lt = document.querySelector('.latest-title');
                    if (lt) lt.style.display = '';
                }
                return;
            }
            // 家居"我的家"：通栏大图在最上 → 八个功能房导入卡 → 自定义卡 → 增加卡片
            if (category === 'home' && subpage.name === '我的家') {
                const functions = { '入户': '转换', '客厅': '信仰', '厨房': '大展身手', '餐厅': '用餐', '卫浴': '净化', '卧室': '安全', '会议室': '思考', '衣帽间': '整衣不烦躁' };
                grid.appendChild(createHomeBigImage());
                subpage.cards.forEach(n => grid.appendChild(createArtCard(n, functions[n] || '')));
                loadHomeCards().forEach(c => grid.appendChild(createArtCard(c.name, c.func || '', { custom: true })));
                grid.appendChild(createHomeAddCard());
                return;
            }
            subpage.cards.forEach(cardName => {
                grid.appendChild(createCard(category, subpage.name, cardName));
            });
        }

        // ===== 艺术栏目：卡牌导入图片（存浏览器本地，自动压缩） =====
        function artImgKey(name) { return 'ideology-art-img:' + name; }

        function loadArtImage(name) {
            try { return localStorage.getItem(artImgKey(name)); } catch (e) { return null; }
        }

        function saveArtImage(name, dataUrl) {
            try { localStorage.setItem(artImgKey(name), dataUrl); }
            catch (e) { alert('浏览器本地存储空间不足，图片未能保存（可换小一点的图）'); }
        }

        function removeArtImage(name) {
            try { localStorage.removeItem(artImgKey(name)); } catch (e) {}
        }

        // 图片在卡内的显示位置（双击拖拽调整，按卡名保存）
        function artPosKey(name) { return 'ideology-art-pos:' + name; }

        function loadArtPos(name) {
            try {
                const v = JSON.parse(localStorage.getItem(artPosKey(name)));
                if (v && typeof v.x === 'number') return v;
            } catch (e) {}
            return { x: 50, y: 50 };
        }

        function saveArtPos(name, pos) {
            try { localStorage.setItem(artPosKey(name), JSON.stringify(pos)); } catch (e) {}
        }

        function applyArtFrame(el, name, dataUrl) {
            // 完整显示：图片按 contain 适配，空余部分白色填充，卡框保持标准尺寸
            el.style.backgroundImage = `url("${dataUrl}")`;
            el.style.backgroundSize = 'contain';
            el.style.backgroundRepeat = 'no-repeat';
            el.style.backgroundPosition = 'center';
            el.style.backgroundColor = '#ffffff';
        }

        // 选择本机图片 → 压缩到最长边1200px → 回调返回 dataURL
        function importArtImage(cb, maxPx) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.addEventListener('change', () => {
                const file = input.files && input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const max = maxPx || 1200;
                        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
                        const c = document.createElement('canvas');
                        c.width = Math.round(img.naturalWidth * scale);
                        c.height = Math.round(img.naturalHeight * scale);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        cb(c.toDataURL('image/jpeg', 0.85));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
            input.click();
        }

        function refreshCardGrid() {
            renderCardGrid(currentCategory, currentSubpage || SITE_DATA[currentCategory].subpages[0]);
        }

        function createArtCard(cardName, subtitle, opts) {
            opts = opts || {};
            const card = document.createElement('div');
            card.className = 'brand-card my-card art-card';
            const dataUrl = loadArtImage(cardName);
            if (dataUrl) {
                const frame = document.createElement('div');
                frame.className = 'my-card-filled art-frame';
                applyArtFrame(frame, cardName, dataUrl);
                card.appendChild(frame);
                // 悬停工具
                const tools = document.createElement('div');
                tools.className = 'my-card-tools';
                if (opts.firstBtn) {
                    const first = document.createElement('button');
                    first.textContent = '置于首位';
                    first.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // 把当前卡轮换到首位：原首图依次后移一位
                        const seq = opts.firstBtn.cards.slice(0, opts.firstBtn.index + 1);
                        const imgs = seq.map(n => loadArtImage(n));
                        const last = imgs.pop();
                        imgs.unshift(last);
                        seq.forEach((n, i) => {
                            if (imgs[i]) saveArtImage(n, imgs[i]);
                            else removeArtImage(n);
                        });
                        refreshCardGrid();
                    });
                    tools.appendChild(first);
                }
                const del = document.createElement('button');
                del.textContent = '移除';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeArtImage(cardName);
                    if (opts.custom) {
                        // 自定义卡：连卡片本身一起删除
                        const list = loadHomeCards().filter(c => c.name !== cardName);
                        saveHomeCards(list);
                    }
                    refreshCardGrid();
                });
                tools.appendChild(del);
                card.appendChild(tools);
            } else {
                const empty = document.createElement('div');
                empty.className = 'my-card-empty';
                empty.innerHTML = '<div class="plus">＋</div><div class="hint">导入图片</div>';
                card.appendChild(empty);
            }
            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = cardName;
            card.appendChild(name);
            if (subtitle) {
                const sub = document.createElement('div');
                sub.className = 'card-sub';
                sub.textContent = subtitle;
                card.appendChild(sub);
            }
            // 点击触发导入 = 仅空卡；已导入的卡点击不触发任何功能
            if (!dataUrl) {
                card.addEventListener('click', () => {
                    importArtImage((d) => { saveArtImage(cardName, d); refreshCardGrid(); });
                });
            }
            return card;
        }

        // 家居自定义卡：名称 + 功能词（存浏览器本地）
        function loadHomeCards() {
            try {
                const v = JSON.parse(localStorage.getItem('ideology-home-cards'));

        function createHomeBigImage() {

        // 渲染品牌名录：左侧滚动列表（按字母分组）+ 右侧A-Z索引栏
        // 艺术 LATEST IN：按当前子页过滤显示（绘画→画家卡，雕塑→雕塑家卡，定表→全部）

        // ===== 获取品牌生态：五步走专页 =====

        // ===== 城史：右上角"当前城市"小组件（点开下滑/搜索选城市） =====
        function renderCityWidget(main, data) {
            let saved = null;
            try { saved = localStorage.getItem('ideology-my-city'); } catch (e) {}

            const widget = document.createElement('div');
            widget.className = 'city-widget';

            const trigger = document.createElement('button');
            trigger.className = 'city-widget-trigger';
            trigger.textContent = saved ? '当前城市 · ' + saved : '当前城市 · 点击选择';

            const drop = document.createElement('div');
            drop.className = 'city-widget-dropdown';

            const search = document.createElement('input');
            search.className = 'city-widget-search';
            search.placeholder = '搜索城市';

            const list = document.createElement('div');
            list.className = 'city-widget-list';

            // 城市条目：拆出拼音与中文
            const cities = data.designers.map(n => {
                const m = n.match(/^([A-Za-z'\u2019\-]+)\s+(.+)$/);
                return m ? { key: m[1], text: m[2] } : { key: n, text: n };
            });

            const renderList = (kw) => {
                list.innerHTML = '';
                const kwL = (kw || '').toLowerCase();
                const filtered = cities.filter(c => !kw || c.text.includes(kw) || c.key.toLowerCase().includes(kwL));
                const g = {};
                filtered.forEach(c => {
                    const L = (c.key[0] || '#').toUpperCase();
                    (g[L] = g[L] || []).push(c);
                });
                const Ls = Object.keys(g).sort();
                if (!Ls.length) {
                    const e = document.createElement('div');
                    e.className = 'city-widget-empty';
                    e.textContent = '无匹配城市';
                    list.appendChild(e);
                    return;
                }
                Ls.forEach(L => {
                    const h = document.createElement('div');
                    h.className = 'city-widget-letter';
                    h.dataset.letter = L;
                    h.textContent = L;
                    list.appendChild(h);
                    g[L].forEach(c => {
                        const li = document.createElement('div');
                        li.className = 'city-widget-item';
                        li.textContent = c.text;
                        li.addEventListener('click', () => {
                            try { localStorage.setItem('ideology-my-city', c.text); } catch (e) {}
                            trigger.textContent = '当前城市 · ' + c.text;
                            drop.classList.remove('open');
                            // 不跳转：收录到城史"我的名录"第一个空位（有素材库的城市显示其主图）
                            const key = c.key + ' ' + c.text;
                            if (BRAND_ASSETS[key]) {
                                const cards = loadMyCards('city');
                                if (!cards.some(slot => slot && slot.brand === key)) {
                                    const empty = cards.indexOf(null);
                                    if (empty !== -1) cards[empty] = { brand: key };
                                }
                                saveMyCards(cards, 'city');
                                renderMyCards(document.getElementById('card-grid'), 'city');
                            }
                        });
                        list.appendChild(li);
                    });
                });
            };
            renderList('');
            search.addEventListener('input', () => renderList(search.value.trim()));
            trigger.addEventListener('click', () => drop.classList.toggle('open'));

            widget.appendChild(trigger);
            widget.appendChild(drop);
            drop.appendChild(search);
            drop.appendChild(list);
            main.appendChild(widget);
        }

        // 名录渲染：艺术栏目按流派分组（大师为 中文在前英文在后）；其他栏目按 A-Z

                const sub = document.createElement('div');

                sub.textContent = `${g.en} · ${g.period}`;
                list.appendChild(sub);
                const ul = document.createElement('ul');
                g.members.forEach(n => {
                    const li = document.createElement('li');
                    li.textContent = n;
                    li.addEventListener('click', () => showDesigner(category, n));
                    ul.appendChild(li);
                });
                list.appendChild(ul);
            });
            panel.appendChild(list);
            section.appendChild(panel);
            container.prepend(section);
        }

        // 艺术栏目：名录跟随子页切换——绘画显示画家流派组，雕塑显示雕塑家组
        function updateArtDirectory(subpage) {
            const dir = document.querySelector('.latest-flex .designer-directory');
            if (!dir) return;
            const groups = subpage.name === '音乐' ? SITE_DATA.art.musicGroups
                         : subpage.name === '雕塑' ? SITE_DATA.art.sculptGroups
                         : subpage.name === '绘画' ? SITE_DATA.art.artGroups
                         : null;
            if (groups) {
                dir.remove();
                renderGroupDirectory(document.querySelector('.latest-flex'), 'art', groups);
            }
        }

        function renderDesignerDirectory(container, category, designers, zhMode) {
            const section = document.createElement('div');
            section.className = 'designer-directory';

            const panel = document.createElement('div');
            panel.className = 'directory-panel';

            // 左侧列表：按首字母分组排序
            const list = document.createElement('div');
            list.className = 'directory-list';
            // zhMode：数据为「拼音 + 中文」，界面只显示中文，排序/分组按拼音
            const entries = designers.map(name => {
                const m = zhMode ? name.match(/^([A-Za-z'-s]+?)s+([一-鿿].*)$/) : null;
                return m ? { key: m[1], text: m[2] } : { key: name, text: name };
            });
            const groups = {};
            entries.forEach(e => {
                const letter = (e.key[0].toUpperCase() >= 'A' && e.key[0].toUpperCase() <= 'Z')
                    ? e.key[0].toUpperCase() : '#';
                if (!groups[letter]) groups[letter] = [];
                groups[letter].push(e);
            });
            const letters = Object.keys(groups).sort((a, b) => (a === '#' ? 1 : b === '#' ? -1 : a.localeCompare(b)));

            letters.forEach(letter => {
                const h = document.createElement('div');
                h.className = 'directory-letter';
                h.dataset.letter = letter;
                h.innerHTML = `<span>${letter}</span>`;
                list.appendChild(h);

                const ul = document.createElement('ul');
                const items = zhMode
                    ? groups[letter].slice().sort((a, b) => a.key.localeCompare(b.key))
                    : groups[letter]; // 品牌：保持VOGUE页面原生顺序，不重排
                items.forEach(e => {
                    const li = document.createElement('li');
                    li.textContent = e.text;
                    li.addEventListener('click', () => showDesigner(category, e.text));
                    ul.appendChild(li);
                });
                list.appendChild(ul);
            });

            // 右侧字母索引
            const rail = document.createElement('div');
            rail.className = 'directory-rail';
            'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('').forEach(letter => {
                const btn = document.createElement('button');
                btn.textContent = letter;
                btn.dataset.letter = letter;
                if (!letters.includes(letter)) {
                    btn.style.opacity = '0.25';
                    btn.style.cursor = 'default';
                } else {
                    btn.addEventListener('click', () => {
                        const target = list.querySelector(`[data-letter="${letter}"]`);
                        if (target) {
                            list.scrollTop = target.offsetTop - list.offsetTop - 10;
                            highlightRail(letter);
                        }
                    });
                }
                rail.appendChild(btn);
            });

            // 滚动时高亮当前字母
            list.addEventListener('scroll', () => {
                let current = letters[0];
                letters.forEach(letter => {
                    const h = list.querySelector(`[data-letter="${letter}"]`);
                    if (h && h.offsetTop - list.offsetTop <= list.scrollTop + 40) {
                        current = letter;
                    }
                });
                highlightRail(current);
            });

            panel.appendChild(list);
            panel.appendChild(rail);
            section.appendChild(panel);

            // 名录插到卡片左侧（LATEST IN 容器的第一个子元素）
            container.prepend(section);
        }

        // 高亮右侧索引中的字母
        function highlightRail(letter) {
            document.querySelectorAll('.directory-rail button').forEach(b => {
                b.classList.toggle('active', b.dataset.letter === letter);
            });
        }

        // 点选品牌：已收录品牌 → 打开素材页；其余 → 展示单品牌卡片区
        function showDesigner(category, name) {
            if (BRAND_ASSETS[name]) {
                showBrandAssets(name);
                return;
            }
            const old = document.querySelector('.designer-view');
            if (old) old.remove();

            const view = document.createElement('div');
            view.className = 'designer-view';

            const nameEl = document.createElement('div');
            nameEl.className = 'designer-name';
            nameEl.textContent = name;
            view.appendChild(nameEl);

            const grid = document.createElement('div');
            grid.className = 'card-grid';
            grid.appendChild(createCard(category, 'designers', name));
            view.appendChild(grid);

            const latestFlex = document.querySelector('.latest-flex');
            if (latestFlex) {
                latestFlex.after(view);
            } else {
                document.getElementById('site-main').appendChild(view);
            }

            view.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 当前栏目（内页返回时回到这里）与 hash 路由抑制标记
        let currentCategory = 'brand';
        let currentSubpage = null;
        let suppressHashChange = false;

        // 已收录品牌 → 跳转品牌内页（hash 路由：可刷新、可前进后退）
        function showBrandAssets(name) {
            if (!BRAND_ASSETS[name]) return;
            location.hash = '#brand=' + encodeURIComponent(name);
        }

        // 品牌内页：品牌大标题 + 「视觉意识形态」围合框 + 素材图墙（点击大图预览）
        function renderBrandPage(name) {
            const asset = BRAND_ASSETS[name];
            if (!asset) return;
            const main = document.getElementById('site-main');
            main.innerHTML = '';

            const page = document.createElement('div');
            page.className = 'brand-page';

            const back = document.createElement('div');
            back.className = 'bp-back';
            back.textContent = '← BACK 返回';
            back.addEventListener('click', () => {
                suppressHashChange = true;
                location.hash = '';
                renderCategory(currentCategory);
            });
            page.appendChild(back);

            const title = document.createElement('h1');
            title.className = 'bp-title';
            title.textContent = asset.displayName || name;
            page.appendChild(title);

            const label = document.createElement('div');
            label.className = 'bp-label';
            label.innerHTML = '<span>视觉意识形态</span>';
            page.appendChild(label);

            const grid = document.createElement('div');
            grid.className = 'assets-grid';
            // 意识形态卡牌排在素材墙第一位
            const items = [[asset.cover, asset.coverLabel || '意识形态卡牌 · CARD']].concat(asset.images);
            items.forEach(([file, cap]) => {
                const item = document.createElement('figure');
                item.className = 'asset-item';
                const img = document.createElement('img');
                img.src = `${asset.folder}/${file}`;
                img.alt = cap;
                img.loading = 'lazy';
                img.addEventListener('click', () => openLightbox(img.src));
                const fc = document.createElement('figcaption');
                fc.textContent = cap;
                item.appendChild(img);
                item.appendChild(fc);
                grid.appendChild(item);
            });
            page.appendChild(grid);

            main.appendChild(page);
            main.scrollTop = 0;
        }

        // hash 路由：#brand=<品牌名> ↔ 栏目页
        function routeFromHash() {
            const m = location.hash.match(/^#brand=(.+)$/);
            const name = m ? decodeURIComponent(m[1]) : null;
            if (name && BRAND_ASSETS[name]) {
                renderBrandPage(name);
            } else {
                renderCategory(currentCategory);
            }
        }
        window.addEventListener('hashchange', () => {
            if (suppressHashChange) { suppressHashChange = false; return; }
            routeFromHash();
        });

        // 灯箱：大图预览，点击任意处关闭
        function openLightbox(src) {
            let lb = document.getElementById('lightbox');
            if (!lb) {
                lb = document.createElement('div');
                lb.id = 'lightbox';
                lb.addEventListener('click', () => lb.classList.remove('open'));
                const big = document.createElement('img');
                lb.appendChild(big);
                document.body.appendChild(lb);
            }
            lb.querySelector('img').src = src;
            lb.classList.add('open');
        }

        // 正文滚动区高度 = 窗口高度 - 顶栏实际高度（顶栏固定不参与滚动）
        function layoutMainScrollArea() {
            const header = document.querySelector('.site-header');
            const main = document.getElementById('site-main');
            if (!header || !main) return;
            const h = header.offsetHeight;
            main.style.top = h + 'px';
            main.style.height = (window.innerHeight - h) + 'px';
        }
        window.addEventListener('resize', layoutMainScrollArea);

        // 初始化：主导航切换 + 默认渲染（带 hash 时直接进入品牌内页）
        document.addEventListener('DOMContentLoaded', function() {
            layoutMainScrollArea();
            document.querySelector('.main-nav ul').addEventListener('click', function(e) {
                const clickedItem = e.target.closest('li');
                if (!clickedItem) return;

                document.querySelectorAll('.main-nav li').forEach(item => {
                    item.classList.remove('active');
                });
                clickedItem.classList.add('active');

                currentCategory = clickedItem.getAttribute('data-category');
                if (location.hash) {
                    suppressHashChange = true;
                    location.hash = '';
                }
                renderCategory(currentCategory);
            });

            currentCategory = 'brand';
            if (location.hash) {
                routeFromHash();
            } else {
                renderCategory('brand');
            }
        });
    </script>
</body>
</html>
