    <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
    <h2>戴皇冠的野孩子</h2>
    <div class="ia-sub">JEAN-MICHEL BASQUIAT · 1960-1988 · 从SAMO©到一亿美元的骷髅</div>
    <div class="ia-rule"></div>
    <div class="article">
        <p class="ia-dropcap">1960 年 12 月 22 日，让-米歇尔·巴斯奇亚出生在纽约布鲁克林。父亲是海地移民，做会计；母亲是波多黎各人。这个混血家庭有点体面，也有点摇晃——母亲玛蒂尔德教他法文和西班牙文，带他去大都会博物馆看画，教他读《人体解剖学》灰皮书；可她精神崩溃，1968 年被送进精神病院，七岁的米歇尔被撞断了胳膊，父母分居。此后他的一生，画里反复出现解剖图、头骨和医院编号，都从这一年裂开。</p>
        <p>十五岁那年他离家出走，父亲报了警；找到他时，他在华盛顿广场公园的喷泉里坐着。他被逐出学校——据说是因为往校长身上扔了奶油派。十七岁，他索性离开布鲁克林的家，在纽约下城区的废弃公寓里睡，靠变卖手绘 T 恤和明信片过活。1976 年前后，他和朋友阿尔·迪亚兹在曼哈顿的墙上开始留下一个神秘签名：<em class="hl">SAMO©</em>——"Same Old Shit"的缩写，一个虚构品牌的广告词。"SAMO© 作为一种洗脑的宗教"、"SAMO© 拯救白痴"——整个下城都在猜这个涂鸦者是谁。1979 年他在酒馆电视上自称"表演砸了 SAMO 的家伙"领了剧本费，随后干脆在苏荷每一面墙上写"SAMO IS DEAD"，宣告这个符号的死亡，把自己从墙上搬进画廊。</p>
        <figure><img src="夜建素材库-2026-11-05/57-basquiat-素材/skull-1981.jpg" alt="Skull 骷髅"><figcaption>《Skull（骷髅）》1981 · 布面丙烯与油画棒</figcaption></figure>
        <p>转折发生在 1981 年。评论家勒内·里夏尔在《Artforum》上登出一篇《光辉的孩子》（The Radiant Child），把这位街头画家推入白人艺术界的视野。次年，经纪人安妮娜·诺塞（Annina Nosei）、瑞士画商布鲁诺·比肖夫伯格（Bruno Bischofberger）接踵而至；诺塞把地下室画室交给他用，比肖夫伯格一次买下他整批作品——同一批画，几年后每幅价格翻到数万甚至数十万美元。<em class="hl">二十出头，他的画价在两年间涨了万倍。</em>1982 年是他最凶猛的一年：他画《Skull》里那颗眼窝喷火的巨骷髅，画《Irony of Negro Policeman》里那个替白人制度巡逻的黑人警察，画《Boxer》里挥出巨拳的拳手——拳头上有 SAMO© 的痕迹。美国的艺术史里从来没有过这样一张脸：一个黑人青年，戴着脏辫，穿着阿玛尼西装赤脚站在白墙画廊里，被称作"新的米开朗琪罗"。</p>
        <figure><img src="夜建素材库-2026-11-05/57-basquiat-素材/boxer-1982.jpg" alt="Boxer 拳击手"><figcaption>《Boxer（无题·拳击手）》1982 · 布面丙烯与油画棒</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/57-basquiat-素材/irony-of-negro-policeman-1981.jpg" alt="Irony of Negro Policeman"><figcaption>《Irony of Negro Policeman（黑人警察的讽刺）》1981</figcaption></figure>
        <p>但巴斯奇亚始终清楚自己在被怎么对待。1985 年 10 月，《纽约时报》杂志封面用了他赤膊戴脏辫、对着画架的巨幅照片，标题是《新艺术：新金钱》——他是那个封面上唯一的活人符号，可内文把他写成时尚话题而非艺术家。白人收藏家把他当作黑人艺术的"例外"，一个被允许进入白人俱乐部交易的野孩子；作品里那些<em class="hl">皇冠</em>就是回应——他给黑人英雄画皇冠：拳手、爵士乐手、运动员，查理·帕克、迪兹·吉莱斯皮、汉克·阿隆。《Charles the First》里他写"Most kings get their head cut off"——大多数国王的下场是掉脑袋。他被加冕，也随时准备被砍头。</p>
        <div class="ia-quote">我是画家，不是黑人画家。<small>—— 他拒绝被限定，却一生都在被限定</small></div>
        <p>1983 年，他通过画商认识了他童年的偶像安迪·沃霍尔。沃霍尔五十五岁，戴假发，怕生；巴斯奇亚二十三岁，上门送上两幅自制的两联画《Dos Cabezas（双头）》——一张是安迪，一张是他自己。两人从此形影不离：一起喝酒、打拳击、互相出现在对方的派对上。1984 到 1985 年，他们合作了上百幅画：沃霍尔先丝印标志和广告词，巴斯奇亚再冲上去用油画棒和丙烯"污损"它们。《十年的清洁时光被泥巴玷污》就是这么来的。可友谊也伤人——评论界毒舌他们互相利用，说巴斯奇亚是沃霍尔的"宠物"。1987 年沃霍尔病逝，巴斯奇亚崩溃了。他在画里写下"葬礼"和骷髅，然后开始更凶地吸食海洛因。一年后的 1988 年 8 月 12 日，他在大琼斯街的画室公寓里死于海洛因过量，二十七岁——和吉米·亨德里克斯、詹尼斯·乔普林一样，死在"27 岁俱乐部"里。他最后画的，是一张没有五官的脸。</p>
        <figure><img src="夜建素材库-2026-11-05/57-basquiat-素材/dos-cabezas-1982.jpg" alt="Dos Cabezas 双头"><figcaption>《Dos Cabezas（双头）》1982 · 献给安迪·沃霍尔的见面礼</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/57-basquiat-素材/boy-and-dog-johnnypump-1982.jpg" alt="Boy and Dog in a Johnnypump"><figcaption>《Boy and Dog in a Johnnypump（约翰尼泵边的男孩与狗）》1982</figcaption></figure>
        <p>他生前卖出最贵的画约一万九千美元；1982 年那幅《无题（骷髅头）》2017 年在日本收藏家前泽友司手里拍出 1.105 亿美元，成为史上最贵的十幅画之一。一个流浪在纽约街头的涂鸦小子，用七年职业生涯换来了艺术史里近乎最贵的一颗头骨。他画里的解剖、皇冠、版权符号©和写得歪歪扭扭的单词，至今仍是时尚、音乐、球鞋设计反复借用的图腾。你要问这个戴皇冠的野孩子到底愤怒什么——<em class="hl">一个把海地、波多黎各、爵士乐、解剖学都画进白人画廊的黑人，活着时被当"例外"，死后却被当成 logo。</em>这或许正是他早就预料到的：他自己写过，"SAMO IS DEAD"。可皇冠还在。</p>
        <figure><img src="夜建素材库-2026-11-05/57-basquiat-素材/charles-the-first-1982.jpg" alt="Charles the First 查理一世"><figcaption>《Charles the First（查理一世）》1982 · "大多数国王的下场是掉脑袋"</figcaption></figure>
    </div>
    <div class="ia-colophon">JEAN-MICHEL BASQUIAT · 1960-1988 · BROOKLYN / NEW YORK</div>
`

    <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
    <h2>我要把肉画出重量</h2>
    <div class="ia-sub">LUCIAN FREUD · 1922-2011 · 在伦敦把人心画厚</div>
    <div class="ia-rule"></div>
    <div class="article">
        <p class="ia-dropcap">1922 年 12 月，卢西安·弗洛伊德出生在柏林，祖父是写《梦的解析》的那个人。1933 年纳粹上台，十一岁的他随家人逃亡伦敦，从此再没真正离开——但伦敦也再没真正接纳过他。英国人看这个移民小子的画看了半个世纪：早期细得像干草的笔触，他们客气地收藏；后来那些肥厚的肉，他们皱眉。要等到八十多岁、女王都坐进他的画室，英国才把他供成国宝。2011 年 7 月去世时，讣告写的是"英国最伟大的当代画家"——<em class="hl">一个被英国画了一辈子才认领下来的德国人</em>。</p>
        <p>他的性格是祖父给的注脚。心理学家的孙子不信谈话，只信盯：他说绘画不是分析，是"最惊人的无礼"——你盯着一个人看几百个小时，看到他自己都不好意思。他不迁就任何人。模特得脱衣、坐上几百个小时，迟到可以，中途走神不行。赌马是他一生另一桩正业，输赢都带着赌徒的坏脾气；他流浪在帕丁顿的破公寓、出租画室和朋友的房子之间，七十岁还半夜出门跟人吵架。苏富比拍卖他的《睡着的福利官》时，250 万起拍、最终 316 万英镑落槌（1995），后来又涨到 3360 万——一个总在赌的人，最后赢的是艺术史。</p>
        <figure><img src="夜建素材库-2026-11-05/58-freud-素材/painters-mother-1972.jpg" alt="画家的母亲"><figcaption>《画家的母亲》1972 · 早期转入厚涂的关键节点</figcaption></figure>
        <p>《睡着的福利官》（Benefits Supervisor Sleeping，1995）是他最著名的一张：福利局官员苏·蒂利，六十多公斤重的大块头，横躺在沙发上，肚皮像隆起的地形。没有性意味，没有怜悯，只有颜料一层层糊上去的肉的真实——他说过：<em class="hl">"我画的就是肉。我要把肉画出重量。"</em>用猪鬃笔、猪皮般的堆叠颜料，他把肥胖画成了纪念碑。为画这张大画，苏坐了几百个小时，脚都坐肿了。</p>
        <figure><img src="夜建素材库-2026-11-05/58-freud-素材/benefits-supervisor-sleeping-1995.jpg" alt="睡着的福利官"><figcaption>《睡着的福利官》1995 · 纽约私人收藏 · 2008 年以 3360 万美元成交</figcaption></figure>
        <p>他画名人也照旧不客气。2001 年女王请他画肖像，他毫不美化，把女王画成一个瘦削的小个子，画框小得像掌上记事本——评论哗然，他自己只说"画小了方便凑近看细节"。之前 1956 年那幅《弗朗西斯·培根》，画的是挚友兼对手：那个在 SOHO 酒馆里和他赌气、互揭短处的培根，被他画成一脸凶相的侧影。朋友骂他画得不像，他答：画像不是目的，<em class="hl">把一个人坐了几百小时之后的真相画出来才是</em>。</p>
        <figure><img src="夜建素材库-2026-11-05/58-freud-素材/queen-elizabeth-ii-2001.jpg" alt="女王伊丽莎白二世"><figcaption>《女王伊丽莎白二世》2001 · 小幅头像 · 皇家收藏</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/58-freud-素材/francis-bacon-1956.jpg" alt="弗朗西斯·培根"><figcaption>《弗朗西斯·培根》1956 · 美国私人收藏</figcaption></figure>
        <div class="ia-quote">我要画的不是那个人，是那个人被盯了几百小时之后，还能剩下什么。<small>—— 卢西安·弗洛伊德 · 谈"长时间写生"</small></div>
        <p>晚期他反复画自己。《自画像·倒影》（2004）里，老人站在画室昏光里，脖子松弛，眼神依旧凶；更早的《带手镜的室内（自画像）》里，他从镜子一角探出半张脸——他从不把自己画得体面。《蓝围巾男子》（2005）是他最后几批肖像之一：坐姿笔直的布瑞格利戴一条蓝围巾，几百小时坐下来，脸上有一种被看完之后的疲惫与诚实。晚期的大画一张比一张厚，颜料像皮肤一样裂开。</p>
        <figure><img src="夜建素材库-2026-11-05/58-freud-素材/self-portrait-reflection-2004.jpg" alt="自画像·倒影"><figcaption>《自画像·倒影》2004 · 晚期自画像系列</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/58-freud-素材/man-with-blue-scarf-2005.jpg" alt="蓝围巾男子"><figcaption>《蓝围巾男子》2005 · 伦敦国家肖像馆藏</figcaption></figure>
        <p>2008 年，《睡着的福利官》在纽约拍出 3360 万美元，在世艺术家第一；他八十多岁还在画室里搬大镜子、给画架加轴承，只为"把画家的姿势也画出来"。2010 年皇家美术学院为他提名新展，他 88 岁，每天仍工作十小时。2011 年 7 月 20 日他在伦敦家中去世。你要问为什么他能熬成国宝——因为他从没想让英国舒服：他只做一件事，<em class="hl">让画布上的肉比模特本人更有重量</em>。英国人花了半个世纪，终于承认这就是他们的当代绘画史。</p>
    </div>
    <div class="ia-colophon">LUCIAN FREUD · 1922-2011 · LONDON</div>
`

    <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
    <h2>刮掉重来的伦敦</h2>
    <div class="ia-sub">FRANK AUERBACH · 1931-2024 · 一辈子只画一个城市与几张脸</div>
    <div class="ia-rule"></div>
    <div class="article">
        <p class="ia-dropcap">1939 年 4 月，柏林。一对犹太夫妇把七岁的儿子送上一列开往英国的儿童救援火车（Kindertransport）。车窗外站台上的父母越来越小，孩子以为很快会再见——1942 年，他们死在了奥斯维辛。这个孩子叫弗兰克·奥尔巴赫，在肯特郡的邦斯考特难民学校长大，孤儿。他后来的一生，几乎就是对这次"被抛下"的回答：既然一切都可以在一天之内消失，那就亲手造一样抹不掉的东西——<em class="hl">把颜料堆到半磅厚，堆到刮不动为止</em>。</p>
        <p>他先是当演员。在希多普的西德尼·西顿斯剧社演戏，演过彼得·乌斯蒂诺夫写的一个角色，评论甚至说他有表演天赋。可他很快明白舞台上的"真实"是排练出来的，于是转身进了希多普艺术学校（1947），再进皇家艺术学院。真正塑造他的是大卫·邦伯格——这位从斯拉德出来的老画家只收了两个学生，另一叫伦纳德·罗斯曼。邦伯格上课时最狠的一句话，成了奥尔巴赫的终身戒律。</p>
        <figure><img src="夜建素材库-2026-11-05/59-auerbach-素材/JYM-Seated-No1-1981.jpg" alt="J.Y.M. 坐像"><figcaption>《J.Y.M. 坐像第一号》J.Y.M. Seated No.1, 1981 · 泰特不列颠美术馆藏</figcaption></figure>
        <p>1952 年起，奥尔巴赫开始画斯特拉·韦斯特，代号 E.O.W.——他多年的情人兼模特。此后几十年，他的模特名单短得吓人：J.Y.M.（朱莉娅·亚德利-米尔斯）、格达·伯姆（他的表亲，同样逃亡出来的德国犹太人）、茱莉亚，后来是凯瑟琳·兰伯特。同一张脸，他画了几十年。理由朴素得近乎残忍：他说过，<em class="hl">去矿坑里待上五百个小时，你才会知道什么叫真实</em>。他认识一张脸的方式，就是一遍遍地把它重新画出来。</p>
        <figure><img src="夜建素材库-2026-11-05/59-auerbach-素材/EOW-Head-I-1960.jpg" alt="E.O.W. 头像第一号"><figcaption>《E.O.W. 头像第一号》Head of E.O.W. I, 1960 · 泰特藏</figcaption></figure>
        <p>他画画的物理过程近乎自我惩罚。一幅肖像要模特坐两三百次，画室的工作从清晨到深夜，每周七天。每次收工，他看着画，不满意——就整个刮掉。刮板刮下厚厚一层颜料丢进废料堆，第二天从几乎全白的画布重新开始。为了支撑这种反复，他把颜料堆得极厚，调色油控制在最低，有些头像干透之后凸起近半英寸，像浮雕。《E.O.W. 头像第四号》里，脸部已经不是"肤色"，是一层被刀具反复碾压、翻开、又愈合的肉。</p>
        <figure><img src="夜建素材库-2026-11-05/59-auerbach-素材/EOW-Head-IV-1961.jpg" alt="E.O.W. 头像第四号"><figcaption>《E.O.W. 头像第四号》Head of E.O.W. IV, 1961 · 私人收藏</figcaption></figure>
        <div class="ia-quote">你们必须亲手毁掉自己的画，每一次都重新开始。<small>—— 大卫·邦伯格 · 奥尔巴赫终身践行的戒律</small></div>
        <p>风景也是同样的强迫症。他一生几乎只画一个城市——伦敦，而且只画伦敦北部：晨曦山、樱草山、卡姆登镇、莫宁顿新月。每天清晨在去画室的路上看一眼街景，回来画；颜色层层堆叠，绿色下面压着红色，红色下面是赭石和黑。1972 年的《莫宁顿新月》不是一张街景照片，是同一条街被画了几百遍之后，从记忆里长出来的形状。1968 年他拿了皇家艺术学院的华纳奖，评委问他为什么总画同一个地方，他答："我总想去新的地方，可我只会把旧的画成新的。"</p>
        <figure><img src="夜建素材库-2026-11-05/59-auerbach-素材/Mornington-Crescent-1972.jpg" alt="莫宁顿新月"><figcaption>《莫宁顿新月》Mornington Crescent, 1972 · 伦敦当代艺术学院藏</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/59-auerbach-素材/Primrose-Hill-1968.jpg" alt="樱草山"><figcaption>《樱草山》Primrose Hill, 1968 · 私人收藏</figcaption></figure>
        <p>市场很快追上了他。1986 年他代表英国参加威尼斯双年展，拿了金狮奖；泰特、卢浮宫、纽约现代美术馆都收他的头像。但他从不上电视、几乎不接受采访，几十年只跟固定的几个模特过固定的日子。2001 年，纪录片导演拍他，镜头里的八十岁老人仍在刮板前把昨天的《凯瑟琳头像》刮掉重来。直到 2024 年 6 月，他还在画室工作——93 岁，画到去世前为止，就像他画了半个多世纪的那些脸一样，永远差最后一遍。</p>
        <figure><img src="夜建素材库-2026-11-05/59-auerbach-素材/Head-of-Julia-2000.jpg" alt="茱莉亚头像"><figcaption>《茱莉亚头像》Portrait of Julia, 2000 · 私人收藏</figcaption></figure>
        <p>你要问他为什么刮、为什么重画——一个七岁被送上火车、与站台上的父母永别的柏林儿童，早已学会不相信"一次成形的完整"。世界随时会消失，所以只有被亲手造了又亲手毁掉几百次、最后残存下来的那层颜料，才算数。他画的从来不是 E.O.W. 的脸或樱草山的树，<em class="hl">是"重新开始"这件事本身</em>。站在那些厚得发亮的头像前，你看到的不是伦敦表现主义的一个流派，是一个孤儿为自己造的、抹不掉的家。</p>
        <figure><img src="夜建素材库-2026-11-05/59-auerbach-素材/Head-of-Gerda-Boehm-1965.jpg" alt="格达·伯姆头像"><figcaption>《格达·伯姆头像》Head of Gerda Boehm, 1965 · 私人收藏</figcaption></figure>
    </div>
    <div class="ia-colophon">FRANK AUERBACH · 1931-2024 · LONDON</div>
`

    <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
    <h2>光的孤独语法</h2>
    <div class="ia-sub">EDWARD HOPPER · 1882-1967 · 画 American 独处的男人</div>
    <div class="ia-rule"></div>
    <div class="article">
        <p class="ia-dropcap">1882 年 7 月 22 日，爱德华·霍普出生在纽约哈德逊河畔的小镇 Nyack，一个体面的中产家庭：父亲开杂货批发铺，母亲收藏小型荷兰画。他家的房子高踞河岸坡顶，窗子正对着那条宽阔的水道——少年霍普在二楼窗边一坐就是几个小时，看船、看水、看光在墙上移过去。他有充足的数学与制图天赋，父母为他规划的是体面的商业插画家之路。1899 年他进纽约插画函授学校（后来的 Parsons），1900 年转入纽约艺术学校，跟罗伯特·亨利学写生——亨利教他最重要的不是笔法，而是<em class="hl">去画你眼前的、真实的、不体面的美国</em>。</p>
        <p>但"真实的美国"先给了他六年屈辱。为了糊口，从 1905 年前后起他给广告公司和杂志画插画，画橱窗广告、画杂志封面、给电影公司画宣传画。他后来回忆那段日子，语气里的厌恶隔着几十年还能听见：他被派去画儿童夏令营的笑脸、画产品光鲜的摆拍，这不是他认定的艺术。他在 1910 年第三次从欧洲回来后彻底下决心：宁可慢，也不再出卖手感。此后他靠卖水彩和小版画熬了将近二十年，直到 1924 年第二次个展一夜售空，41 岁才第一次靠画画活下来。</p>
        <figure><img src="夜建素材库-2026-11-05/51-hopper-素材/new-york-movie-1939.jpg" alt="纽约电影"><figcaption>《纽约电影 New York Movie》1939 · 现代艺术博物馆（MoMA）藏</figcaption></figure>
        <p>他去过欧洲，三次——1906、1907、1910，加起来一年多。巴黎当然接待了他：印象派还在展厅里，立体主义正在蒙马特放炮。可霍普看完了，画回来的却是一批安静的建筑水彩，光线平直，几乎看不出"现代"二字。后来有人问起欧洲现代派对他的影响，他的回答干脆得近乎冒犯："我对各种'主义'没什么印象。"他一辈子拒绝跟着巴黎的方向走，理由简单：<em class="hl">"我不觉得自己是欧洲人。"</em>他要画的那个美国——加油站、汽车旅馆、电影院、街角的理发店——在欧洲根本没有原型，得回纽约自己造。</p>
        <figure><img src="夜建素材库-2026-11-05/51-hopper-素材/house-by-the-railroad-1925.jpg" alt="铁道旁的房屋"><figcaption>《铁道旁的房屋 House by the Railroad》1925 · 现代艺术博物馆（MoMA）藏</figcaption></figure>
        <p>1925 年的《铁道旁的房屋》是他的语法成型之作：一栋殖民地风格的旧宅被铁道一切两半，门廊像船头一样悬在铁轨上方。没有人物，没有故事，但你分明读出一个意思——美国正从这栋房子旁边轰隆隆驶过去，车里的人连头都懒得回。 MOMA 买下它时评论界已经把话说透：这是一栋"孤独的房子"。霍普的孤独从来不靠姿态，靠的是几何——他像工程师一样计算光的角度、墙的斜面、窗框把画面切成的格子。他甚至说过，他一辈子的目标，是<em class="hl">"把我对自然最内在的印象，做尽可能精确的转写"</em>——而他的"自然"，就是午后的光打在墙上那一刀。</p>
        <figure><img src="夜建素材库-2026-11-05/51-hopper-素材/morning-sun-1952.jpg" alt="早上的太阳"><figcaption>《早上的太阳 Morning Sun》1952 · 哥伦布艺术博物馆藏</figcaption></figure>
        <p>画里的女人几乎总是同一个人：约瑟芬·尼维森，Jo。她 1924 年嫁给霍普，自己也是画家，婚后却把工作室让了出来，成了他唯一的模特——Morning Sun 里坐在床上迎着太阳的、《New York Movie》里倚在侧墙的引座员，都是她。霍普脾气硬、寡言、决断，Jo 活泼、话多、嫉妒心强，两人吵了一辈子，但 Jo 同时是他最严的档案管理员：她记下了每幅画的草图日期、出售价格、去向，一部逐日账，成了今天霍普研究的地基。1967 年霍普去世，不到一年 Jo 也走了——她把两人的收藏整体捐给惠特尼美术馆。你今天能一部作品一部作品地追踪霍普的一生，靠的是 Jo 留下的那摞账本。</p>
        <div class="ia-quote">如果你能用语言把它说出来，就没有理由再去画它了。<small>—— 爱德华·霍普 · 论绘画与语言 · 1930 年代访谈</small></div>
        <figure><img src="夜建素材库-2026-11-05/51-hopper-素材/gas-1940.jpg" alt="加油站"><figcaption>《加油站 Gas》1940 · 现代艺术博物馆（MoMA）藏</figcaption></figure>
        <p>1942 年，芝加哥艺术学院买下《夜鹰》——那间深夜里通体发亮的餐厅，弧形玻璃把四个人围在灯光里，侍者弯着腰，没有人交谈，门上没有锁。当时美国刚进太平洋战争，报纸在讲空袭演习，评论家立刻读出"战时都市的不安"。霍普本人不认账，他说那只是"画一间深夜餐厅"，可他也承认，这画"很可能是我孤独这个事实的无意识流露"。他一生都在否认自己是写实主义者、否认自己是悲观主义者，却从不否认一件事：<em class="hl">他画的是光本身</em>——只是他的光，照到的永远是空椅子、侧过去的一半脸、没人进去的门。</p>
        <figure><img src="夜建素材库-2026-11-05/51-hopper-素材/nighthawks-1942.jpg" alt="夜鹰"><figcaption>《夜鹰 Nighthawks》1942 · 芝加哥艺术学院藏</figcaption></figure>
        <p>晚年他住在华盛顿广场的顶楼，几乎不出门，只画那扇朝北的窗。1951 年的《靠海的房间》里，只有光斜切进一扇没人使用的门；1960 年之后他几乎停笔，坐在窗边看华盛顿广场的树。1967 年 5 月 15 日，他在自己那间画了一辈子的工作室里去世。他给美国留下了一种人人认得的画面：加油站、吧台、旅店的窗——那些我们以为转瞬即逝、不配入画的瞬间，被光的几何钉在墙上，一钉将近一个世纪。</p>
        <figure><img src="夜建素材库-2026-11-05/51-hopper-素材/rooms-by-the-sea-1951.jpg" alt="靠海的房间"><figcaption>《靠海的房间 Rooms by the Sea》1951 · 耶鲁大学美术馆藏</figcaption></figure>
        <p>你要问他的孤独从哪儿来——一个哈德逊河边窗台上长大的孩子，长年一个人看水看船看光；六年被逼着画橱窗广告的手，终于熬到可以只画自己看见的东西；三赴欧洲却拒绝一切"主义"，认定美国的光必须用美国自己人的眼睛去画。<em class="hl">于是他把一个国家的孤独，画成了一种语法</em>：光切过墙面，人在光的格子里各坐各的位置。他画的不是伤感，是精确——正因为精确，你一看就认出，那是你自己也站过的位置。</p>

    </div>
    <div class="ia-colophon">EDWARD HOPPER · 1882-1967 · NEW YORK</div>

    <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
    <h2>燃烧的向日葵</h2>
    <div class="ia-sub">VINCENT VAN GOGH · 1853-1890 · 十年，一个人，一千一百幅画</div>
    <div class="ia-rule"></div>
    <div class="article">
        <p class="ia-dropcap">1853 年 3 月 30 日，文森特·梵高出生在荷兰南部布拉班特的小镇津德尔特。父亲是一位新教牧师，生日恰好与一年前夭折的哥哥相同——他的墓碑就刻着"Vincent"，文森特从小在自家门口看着那块石头。这个细节后来被无数传记作家反复引用，因为它的阴影太长：他一生都在替一个不存在的人活着，都在寻求一种注定缺席的认可。家里六个孩子，他和最小的弟弟提奥最亲，这份亲情日后将撑起整部艺术史。</p>
        <p>他的前半生是一连串失败。20 岁进古皮尔画廊海牙分部当学徒，因为 insisting 向客人推销"艺术应当让人悲伤"而被解雇；随后当过教师、书店店员，最后决定做牧师——他父亲的路。1877 年他赴阿姆斯特丹备考神学，数学和拉丁文考不过，放弃；转投比利时布鲁塞尔的福音传道学校，试读期结束未被录取，放弃。但他不死心：1879 年，26 岁的文森特自费跑到比利时南部博里纳日的煤矿区做传道士——没有职位、没有薪水、没有教会承认。他在帕图拉格的矿工棚屋里住下，睡在草堆上，把衣服和钱全分给矿工，替伤员包扎、替霍乱死者祷告。教会巡视员看到的却是一个衣衫褴褛、丧失"体面"的狂热分子，正式撤销了他的传教资格。<em class="hl">上帝拒绝了他。于是他把那点无处安放的狂热，原封不动地搬进了画布。</em></p>
        <p>1880 年，27 岁的文森特在给提奥的信里写下决定：我要成为画家。这个年纪的起步几乎荒唐——莫奈 16 岁已经在外光里作画，而他连素描基础都没有。提奥从这时起按月寄生活费，一寄十年，直到哥哥死。后世统计，提奥为文森特提供的生活费总额超过 17500 法郎，而他自己终生是画廊小职员。没有第二个人这样被供养：不被画廊看好，不参加沙龙，只在信里对弟弟说"总有一天，世界会明白我的画比颜料钱更有价值"。1885 年他画下《吃马铃薯的人》，昏暗的农屋里五个人围着一盏油灯分食土豆，他骄傲地寄给巴黎的提奥，结果无人问津——画太暗了，暗得像矿区。</p>
        <figure><img src="夜建素材库-2026-11-05/30-vangogh-素材/potato-eaters-1885.jpg" alt="吃马铃薯的人"><figcaption>《吃马铃薯的人》1885 · 阿姆斯特丹梵高博物馆藏</figcaption></figure>
        <p>1886 年，33 岁的梵高来到巴黎，投奔提奥。命运在这里转弯：他撞上了印象派——莫奈的色彩、毕沙罗的外光、修拉的点彩，还有日本浮世绘。两年间他的人生观被重画一遍：调色板上的褐色和土灰被彻底扔掉，换成铬黄、钴蓝和翠绿。他结识了高更、塞尚、劳特雷克，画了数十幅自画像——没钱请模特，他就在镜子前画自己，一张一张地核对那颗红发头颅。1887 年的自画像里，背景已经全是流动的短笔触蓝绿色。</p>
        <figure><img src="夜建素材库-2026-11-05/30-vangogh-素材/portrait.jpg" alt="自画像 1889"><figcaption>《自画像》1889 · 奥赛博物馆藏</figcaption></figure>
        <p>1888 年 2 月，他南下普罗旺斯的阿尔勒。阳光改变了一切。他在三个月里画完《夜晚的咖啡馆》《罗纳河上的星夜》，八月的向日葵系列一天一幅，"用从柠檬黄到浓密铬黄的整个色阶"。他租下拉马丁广场 2 号的"黄房子"，梦想建成"南方画室"——1888 年 10 月，他寄去路费、床头挂满向日葵迎高更入住。高更后来回忆那天夜里的画面：梵高激动得整晚不睡，"眼睛亮得像牲口"。<em class="hl">两个强势的画家在一间 15 平米的黄房子里画画、喝酒、争论，任何结局都不难预料。</em></p>
        <figure><img src="夜建素材库-2026-11-05/30-vangogh-素材/sunflowers-1888.jpg" alt="花瓶里的十二朵向日葵"><figcaption>《花瓶里的十二朵向日葵》1888 · 慕尼黑新绘画陈列馆藏</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/30-vangogh-素材/bedroom-arles-1888.jpg" alt="在阿尔的卧室"><figcaption>《在阿尔的卧室》1888 · 梵高博物馆藏</figcaption></figure>
        <p>结局只用了 62 天。12 月 23 日深夜，剧烈争吵之后，梵高拿起剃刀扑向高更，被制止；当晚他割下自己的左耳，包在报纸里送到妓院交给一个相识的妓女，然后回家昏睡。次日警察在血泊里发现了他。高更当天搭末班车离开，终生未再与他相见。阿尔勒市民联名请愿，要求"这个疯子"搬走。1889 年 5 月，梵高自愿住进圣雷米镇的圣保罗精神疗养院——割耳之后他画下《包扎耳朵的自画像》，平静得可怕；疗养院里他在两次发作的间隙画了两百多幅画，包括《星月夜》：圣雷米的铁窗之外，柏树像黑色火焰一样烧向旋涡状的天空，月亮和星星炸成十一团黄色的光。他自己在信里解释这幅画："看星星总是让我做梦……为什么，我问自己，天上那光点触不到的地方，难道不像死亡之路一样遥不可及吗？我们乘火车去塔拉斯孔或鲁昂，我们乘死亡去星星。"</p>
        <div class="ia-quote">灵魂里也许藏着一团大火，但没有人前来取暖；路人看到的，只是从烟囱里冒出的那缕青烟。<small>—— 文森特·梵高致提奥的信 · 1880 年代 · 亲笔书信</small></div>
        <p>1890 年 5 月，他搬到巴黎近郊的瓦兹河畔欧韦，接受画商加歇医生照看。最后 70 天，他画了 70 多幅画——《麦田群鸦》通常被视为绝笔：1890 年 7 月，金色麦田上三条小路通向三个方向，一整群乌鸦被惊起，钴蓝色的天空压得很低。1890 年 7 月 27 日下午，他在麦田里朝自己胸口开枪，子弹没有立刻致命；他走回旅馆，躺了两天，7 月 29 日凌晨在提奥怀里去世，遗言是："我想就这样死去。"(Lausanne 记录的原文译作 "I wanted to die this way.") 终年 37 岁。一生只卖出一幅画——《红色葡萄园》，400 法郎，1890 年卖给比利时画家安娜·博赫。半年后的 1891 年 1 月，提奥在悲伤与精神衰弱中追随哥哥而去，年仅 33 岁。1914 年，提奥的遗孀约翰娜把他的骨灰迁葬到文森特墓旁，两块墓碑至今并肩。</p>
        <figure><img src="夜建素材库-2026-11-05/30-vangogh-素材/starry-night-1889.jpg" alt="星月夜"><figcaption>《星月夜》1889 · 纽约现代艺术博物馆藏</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/30-vangogh-素材/almond-blossom-1890.jpg" alt="盛开的杏花"><figcaption>《盛开的杏花》1890 · 梵高博物馆藏 · 侄子文森特·威廉出生的贺礼</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/30-vangogh-素材/wheatfield-with-crows-1890.jpg" alt="麦田群鸦"><figcaption>《麦田群鸦》1890 · 梵高博物馆藏 · 通常被视为绝笔</figcaption></figure>
        <p>他留给世界 2100 余件作品，其中约 860 幅油画——十年创作生涯，平均每四天一幅。但真正"最伟大"的遗产也许是那部书信集：他写给提奥的 600 多封信（另有书信数百封），中译本厚达四卷。梵高是画家队伍里罕见的随笔写得如此之好的一个人——论米勒，论德拉克洛瓦，论"黑暗里的煤油灯是何等温柔"。他在 1880 年的信里说过一句话，用来总结这一生死去的眼神也许最贴切：<em class="hl">"我越是丑陋、衰老、恶毒、病态、贫穷，就越想用明亮绚烂、结构精妙的色彩来报复。"</em>向日葵年年开。他死后的第二年，提奥的遗孀在布雷达的阁楼里清点出几千幅画——世界迟到了二十年，但没有缺席。</p>
    </div>
    <div class="ia-colophon">VINCENT VAN GOGH · 1853-1890 · ZUNDERT / ARLES / AUVERS-SUR-OISE</div>

    <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
    <h2>追光的固执</h2>
    <div class="ia-sub">CLAUDE MONET · 1840-1926 · 印象派的命名者，也被这名字困了一生</div>
    <div class="ia-rule"></div>
    <div class="article">
        <p class="ia-dropcap">故事要从勒阿弗尔的海边杂货铺讲起。少年克劳德·莫奈 1840 年生于巴黎，五岁随全家搬去诺曼底的港口勒阿弗尔，在父亲的杂货店里帮工。他不爱进货，爱画漫画——十几岁时他给镇上的熟人画讽刺漫画肖像，画得惟妙惟肖，摆在文具店橱窗里，一排排小画像像商铺的招牌，勒阿弗尔人都认得这个画画的少年。一份肖像收十到二十法郎，他赚到的不止是零花钱，是"我可以靠画活着"的错觉。</p>
        <p>错觉差点成真。1856 年前后，布丹（Eugène Boudin）在文具店里看见了这些漫画，把少年找来，说：你的漫画有点意思，但你的素描不行；跟我去海滩上写生吧。少年嫌户外画画荒唐，推了几次，终于答应。1858 年，两人在米西（Micy）的海滩上支起画架——诺曼底的风、云、退潮时湿漉漉反着天空的沙地，全在纸上流动起来。多年后莫奈说：如果没有布丹，我大概一辈子都是个买卖人。那一刻他明白了，<em class="hl">画画不是画东西，是画光落在东西上的那一秒</em>。</p>
        <figure><img src="夜建素材库-2026-11-05/26-monet-素材/impression-sunrise-1872.jpg" alt="印象·日出"><figcaption>《印象·日出》1872 · 巴黎马摩丹莫奈美术馆</figcaption></figure>
        <p>1872 年 4 月的一个清晨，32 岁的莫奈在勒阿弗尔港的旅馆窗口支起画架：橙红的太阳悬在灰蓝色雾气里，桅杆和吊车是几笔剪影，水面的光是碎的。他给这幅小画起名《印象，日出》。1874 年 4 月，它挂进摄影师纳达尔的工作室——落选者沙龙展，评论家路易·勒鲁瓦（Louis Leroy）写了一篇挖苦文章，标题就叫《印象主义者的展览》："壁纸的胚胎也比这幅海景完整。"他想侮辱这群画家，结果给一场革命起了名字。莫奈和他的同伴不恼，反倒把"印象派"捡起来当旗帜用。被讽刺成流派名，这恰恰说明他画出了评论家看不懂却挥不去的东西。</p>
        <figure><img src="夜建素材库-2026-11-05/26-monet-素材/woman-with-parasol-1875.jpg" alt="撑阳伞的女人"><figcaption>《撑阳伞的女人》1875 · 华盛顿国家美术馆藏</figcaption></figure>
        <p>但在荣誉之前是漫长的穷。1870 年代他带着卡米耶（Camille Doncieux）和儿子在阿让特伊漂泊，画《撑阳伞的女人》里的绿草地与逆光——1875 年他写信给朋友："我们这个月吃不上晚饭……面包师不给赊账了。"穷得最好的一年是 1879 年：卡米耶肺结核恶化，9 月 5 日她死在维特伊，32 岁。莫奈做的事，后世画商杜朗-吕厄记下了：他搬来画架，对着病床画——画下她最后那张被死亡和光影同时洗刷的脸。他说：我发现自己盯着这张逝去的脸，不由自主地分析死亡在颜色上留下的痕迹，蓝的、灰的、黄的。他给自己的《临终的卡米耶》签名时，写下他一生最大的一笔字——痛苦之下本能的怪异反应。</p>
        <figure><img src="夜建素材库-2026-11-05/26-monet-素材/haystacks-midday-1890.jpg" alt="正午的干草垛"><figcaption>《干草堆（正午）》1890 · 干草堆系列</figcaption></figure>
        <p>1890 年代，生活终于安顿。他在吉维尼租下房子，后来买下它，开掘池塘，种睡莲——亲手造了一个可以作画的世界。1890 年起他开始画干草堆：同一堆草，黎明、正午、雪后、日落，画了二十多幅。俗人看是二十多幅一样的草垛，他看的是二十多种光——<em class="hl">主题不重要，主题只是光的一件外衣</em>。1892 到 1894 年，他对鲁昂大教堂故技重施：在教堂对面的窗后租下房间，从清晨画到暮色，石头的立面在他的画布上一天变化几十种颜色，成画二十余幅。系列画法由此确立：时间本身成了他的模特。</p>
        <figure><img src="夜建素材库-2026-11-05/26-monet-素材/waterlilies-1906.jpg" alt="睡莲 1906"><figcaption>《睡莲》1906 · 芝加哥艺术博物馆藏</figcaption></figure>
        <p>晚年有另一个敌人。1912 年前后医生确诊他白内障，看出去的世界蒙着黄雾、蓝紫反常。这很残酷——他的全部艺术就是看，而现在眼睛在背叛他。可也正是这段岁月，他画里的紫色调越来越浓：白内障让水晶体泛黄，他能看见的紫色反而被放大进画布。1908 年他笔下威尼斯的水是紫的，吉维尼的池塘在暮色里是整片紫与金的漩涡。他做过两次白内障手术，术前术后对着同一座日本桥反复重画——一个画家在用毕生执念对抗生理的衰退，光不灭，他不肯放下画笔。</p>
        <figure><img src="夜建素材库-2026-11-05/26-monet-素材/waterlilies-1908.jpg" alt="睡莲 1908"><figcaption>《睡莲》1908 · 布达佩斯国立西洋美术馆藏</figcaption></figure>
        <p>第一次世界大战期间，法国人劝他把画运去安全的地方，他不肯："一个艺术家留在前线是体面的事。"1914 年起，82 岁上下、视力衰退的老人开始画巨幅睡莲——两米高的画布，一幅接一幅，池塘的水面没有天、没有岸、没有地平线，只有光在无限延伸。1918 年 11 月 12 日，停战次日，他给 克列孟梭 写信，决定把《睡莲组画》（Grandes Décorations，1914-1926）捐赠给法国国家。1927 年，他死后不久，这组画在杜乐丽花园的橘园美术馆按他的设计永久陈列，椭圆的两个展厅，像被水面包围的两只眼睛。他没把这组画叫纪念胜利，也没给自己留一块功绩碑——<em class="hl">他造了一池光，留给被战争伤过的国家，作和平的纪念碑</em>。1926 年 12 月 5 日，他在吉维尼家中去世。有人说他临终前看窗外，对身边人说的仍是：颜色。 </p>
        <figure><img src="夜建素材库-2026-11-05/26-monet-素材/nympheas-en-fleur-1914-1917.jpg" alt="绽放的睡莲"><figcaption>《绽放的睡莲》1914-1917 · 后捐入橘园组画体系</figcaption></figure>
        <p>回看这条线：被漫画养大的杂货店少年，被布丹拉到海滩上的学徒，被讽刺命名却把名字变成旗帜的斗士，在亡妻床前分析死亡颜色的丈夫，亲手造一个花园来画光的园丁，在白内障里越画越紫的老人，最后把一整池光献给他的人类。他一生的固执只有一条：看不见光的那一秒，就再画一秒。印象派从来不是一场风格运动，是<em class="hl">一个人对"看"这件事的彻底忠诚</em>。</p>
    </div>
    <div class="ia-quote">我要画空气，画包围着物体的空气。<small>—— 克劳德·莫奈 · 与朋友的谈话</small></div>
    <div class="ia-colophon">CLAUDE MONET · 1840-1926 · GIVERNY</div>

    <div class="ia-rule"></div>
    <div class="article">
        <p class="ia-dropcap">1841 年，雷诺阿出生在法国利摩日一个裁缝家里，是第七个孩子。家里穷得让孩子们轮流穿同一件外套，鞋罩住脚踝，母亲的裙摆遮住破裤。父亲带着全家搬到巴黎，指望在卢浮宫附近接到活计。十三岁那年，孩子被送进利摩日瓷器厂当描花学徒—— 给盘子边缘描花、临摹法国画家布歇的洛可可曲线。老板娘嫌他描得太慢，骂他"糟蹋颜色"，可他后来一辈子都感谢那间工厂：<em class="hl">他一生画女人皮肤时那种瓷器般的暖光，就是在描花盘上练出来的。</em>这是他学画的第一间教室。</p>
        <p>工业时代的印钞机很快终结了手工描花这个行当。1862 年，二十一岁的雷诺阿考进巴黎美术学院，在格莱尔画室遇见莫奈、西斯莱、巴齐耶——四个付不起学费的穷学生。穷到什么程度？雷诺阿每天从巴齐耶家蹭饭，省下面包钱买颜料；莫奈没颜料时，他把画架上自己的颜料切一半给朋友。1864 年第一幅画落选沙龙，他连装画的木条箱都买不起，就把画布蒙起来当桌子用，一用就是好几年。但你看他这一时期的画：《勒科尔纽小姐像》《安东尼娜像》，每一个模特都在笑。朋友说他是"画笑的人"，他也认：<em class="hl">穷得叮当响的人，偏要在画布上留下笑容。</em></p>
        <figure><img src="夜建素材库-2026-11-05/27-renoir-素材/moulin-galette-1876.jpg" alt="煎饼磨坊的舞会"><figcaption>《煎饼磨坊的舞会》1876 · 奥赛博物馆藏</figcaption></figure>
        <p>1876 年的《煎饼磨坊的舞会》是这种性格最完整的宣言。蒙马特高地的露天舞会，门票几个苏，工人、女工、小职员在树上挂满煤气灯下跳舞。雷诺阿租下附近一间小屋，每天清早把这张 1.7 米的大画抬过去，画完再抬回来，画了一整年。他把头顶树影间漏下的光斑，用小笔触直接点在舞者脸上、裙上、帽子上——学院派看了说这是"未完成的垃圾"，可这正是他要的：<em class="hl">阳光漏在人群里的样子，就是幸福本来的样子。</em>三个了无生气的进攻性评论家骂他"堕落"，他不回嘴，只说画应当是令人愉快的。</p>
        <div class="ia-quote">画应当是令人愉快的、快乐而漂亮的东西——世上的讨厌事已经够多了。<small>—— 皮埃尔-奥古斯特·雷诺阿</small></div>
        <p>1881 年的《游船上的午餐》把这句话画到了极致。塞纳河畔富尔奈斯老板娘的餐馆，一桌人在阳台上吃午饭，酒瓶、草莓、白桌布、翻过来的草帽，以及对岸少女在船上回头一笑。雷诺阿为了这张画从上午十一时画到下午五时，一根手指要捏十几个小时——笔尖的颤动被他反过来当优势用：他的笔触粗看是颤的，细看每一块皮肤都在颤动中发光。这也是他印象派时期的收官之作。之后他去了意大利，站在拉斐尔面前，忽然觉得自己"走得太远"：颜色应该重回到形上。1880 年代中期的"干燥时期"（période sèche），他画出了《伞》和《大浴女》——轮廓收紧，颜色压住，像他学徒时代描花的瓷盘。</p>
        <figure><img src="夜建素材库-2026-11-05/27-renoir-素材/luncheon-boating-party-1881.jpg" alt="游船上的午餐"><figcaption>《游船上的午餐》1881 · 菲利普斯收藏馆（华盛顿）</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/27-renoir-素材/the-umbrellas-1886.jpg" alt="伞"><figcaption>《伞》c.1881-1886 · 伦敦国家美术馆藏</figcaption></figure>
        <p>1890 年前后，他终于卖得动画了：《夏庞蒂埃夫人和她的孩子们》被选进沙龙，美国买家排队订画，他在埃索瓦买下带花园的房子。可身体开始背叛他。1898 年起，风湿一步步锁住他的手指，他的手扭曲成爪形，指关节变形，握不住画笔。仆人看见他把画笔用布条绑在手指上继续画，绑完先试两笔，笑一下，说"手不碍事，眼睛还在"。1907 年他搬到温暖的南方卡涅，让画笔绑得更紧，让儿子让·雷诺阿推着轮椅把他推到花园、推到海边画《沐浴者》。医生说关节恶化是因为画画太久，他不理。<em class="hl">疼痛是私人事务，快乐是他的职业信仰，二者互不干涉。</em></p>
        <figure><img src="夜建素材库-2026-11-05/27-renoir-素材/girls-at-the-piano-1892.jpg" alt="钢琴前的少女"><figcaption>《钢琴前的少女》1892 · 奥赛博物馆藏</figcaption></figure>
        <p>晚年他做了一件更不可思议的事：雕塑。手指拿不动凿子，他就躺在轮椅上指挥一个年轻的助手——理查德·吉诺（Richard Guino）——按照他嘴里的指示"削这里，再薄一点"，摆出他要的姿势，最后由助手的手替他执笔。作品署名是"雷诺阿·吉诺"（Renoir-Guino），助手练出的手是他意志的延伸。1919 年 12 月初，他让家人把他推到卢浮宫，看他四十年前的画挂在大师们中间，这是他一生最高兴的一天之一。回卡涅后，他躺在床上，让护士递给他一支铅笔头，说："再给我一支，我想我还能画出点小东西。"当天夜里，他在这句话说完后去世，享年七十八岁。</p>
        <figure><img src="夜建素材库-2026-11-05/27-renoir-素材/two-sisters-1889.jpg" alt="两姐妹"><figcaption>《两姐妹（阳台上）》1889 · 芝加哥艺术学院藏</figcaption></figure>
        <p>回看他的一生：裁缝的第七个孩子，瓷器厂的描花工，被沙龙拒了六年的落选者，靠朋友家蹭饭度日的穷学生，最后成为印象派里唯一始终画笑容的人。莫奈画光线，德加画瞬间，凡高燃烧自己，而雷诺阿画人的皮肤在阳光里发亮的那一刻。他不是没有痛苦——极端的贫穷、被嘲笑半生、晚年二十八年的类风湿把手指绑成了爪子——他只是拒绝让痛苦上画布。<em class="hl">世上的讨厌事已经够多了，所以他负责画快乐，一直画到笔被绑在手指上，画到最后一句话还是"再给我一支"。</em></p>
        <figure><img src="夜建素材库-2026-11-05/27-renoir-素材/portrait.jpg" alt="雷诺阿自画像"><figcaption>《自画像（三十五岁）》1876 · 福格艺术博物馆（哈佛大学）藏</figcaption></figure>
    </div>
    <div class="ia-colophon">PIERRE-AUGUSTE RENOIR · 1841-1919 · LIMOGES / PARIS / CAGNES</div>
`

    <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
    <h2>未完成的完人</h2>
    <div class="ia-sub">LEONARDO DA VINCI · 1452-1519 · 私生子的名字，拖延者的杰作</div>
    <div class="ia-rule"></div>
    <div class="article">
        <p class="ia-dropcap">1452 年 4 月 15 日，托斯卡纳的芬奇镇，一个叫列奥纳多的男孩出生了。他的名字本来就该只是一行乡间记录："皮耶罗之子，列奥纳多，生于芬奇"。可他是私生子——父亲瑟·皮耶罗是城里的公证人，母亲卡泰丽娜只是个农妇。按行会规矩，公证人的身份传不了给私生子，于是<em class="hl">他被体面世界拒之门外，也就被从大学和拉丁文教育的正途上抹掉了</em>。瓦萨里说他"没有学过拉丁文、希腊文和其他学科"，一切知识都得自己动手去够。后来他用左手从右往左写字，把每个字母都镜像反转——后世称它"镜像字"，只有拿镜子照着才能读。有人说那是为了保密，其实更可能只是一个左撇子私生子写字的自然习惯：没有学校来纠正他，他就一直那样写下去。一个没有正规身份的人，一生都在自己给自己发入学通知书。</p>
        <p>十四岁左右，父亲把他送进佛罗伦萨韦罗基奥的画坊——那里不问出身，只问手。传说老师为《基督受洗》画了一位天使，列奥纳多接手画了旁边跪着的另一个：他给天使抹上一层柔和的空气感，让老师的天使相形见拙。瓦萨里说韦罗基奥从此搁笔不再画画。传说当不得真，但 1472 年，二十岁的他确实注册进了圣路加行会，成了师傅。可这位师傅有个毛病——<em class="hl">他几乎不把任何东西画完</em>。</p>
        <figure><img src="夜建素材库-2026-11-05/07-davinci-素材/ginevra-de-benci-1474-1478.jpg" alt="吉内薇拉·德·班琪肖像"><figcaption>《吉内薇拉·德·班琪》c.1474-1478 · 华盛顿国家美术馆藏</figcaption></figure>
        <p>1481 年，奥古斯丁修道院委托他画《三博士朝圣》。他画了一地炭稿，人物、建筑、手势，层层叠叠像一场正在酝酿的风暴——然后停笔了。画底只剩一层赭黄的单色底稿，买家等不到画，他自己先去了米兰。那幅《三博士朝圣》至今仍是"未完成"状态站在乌菲兹里，成了一部关于拖延症的纪录片：你能看见一幅杰作如何诞生，也能看见它如何被主人抛弃。他不是懒。他的笔记里写满了对一切的好奇——水流、鸟飞、马骨、云影——<em class="hl">每打开一扇门，里面还有一百扇</em>。委托在等他，而他在解剖尸体、设计飞行器。完美主义和好奇心的合谋，让"完成"这个动作永远排在"再研究一下"之后。</p>
        <figure><img src="夜建素材库-2026-11-05/07-davinci-素材/adoration-of-the-magi-1481.jpg" alt="三博士朝圣底稿"><figcaption>《三博士朝圣》（未完成底稿）1481 · 乌菲兹美术馆藏</figcaption></figure>
        <p>米兰斯福尔扎公爵收留了他，说是请他做画家，他却在自荐信里先大谈桥梁、攻城器械和炮台，最后才加一句"我也能画画"。在米兰宫廷，1489 到 1490 年，他画了《抱银鼠的女子》——塞西莉亚·加勒拉尼抱着一只白鼬，身体微微旋向画外，像刚被人唤住回头。白鼬在当时的寓言里是纯洁的象征，也是公爵本人的纹章符号。这幅画里没有神性，只有一个真实的、聪明的、正在思考的女人——文艺复兴把"人"放进画面中央，就是从这样的肖像开始的。</p>
        <figure><img src="夜建素材库-2026-11-05/07-davinci-素材/lady-with-ermine-1489-1490.jpg" alt="抱银鼠的女子"><figcaption>《抱银鼠的女子》c.1489-1490 · 克拉科夫恰尔托雷斯基博物馆藏</figcaption></figure>
        <p>然后是 1495 到 1498 年，恩宠圣母堂食堂的那面墙。《最后的晚餐》不是蛋彩而是他自己发明的油画式干壁画——因为他要慢慢画，反复改。修道院的修士们每天看着这个画家爬上脚手架，看半天，一笔不落就下来。他甚至为犹大的脸跑遍米兰的下等酒馆找原型（此事记载于瓦萨里）。画成之后，十二个门徒在基督说出"你们中间有一个人要出卖我"的瞬间同时震动，手、视线、身体朝四面炸开又收向基督——餐桌上第一次有了戏剧，也有了心理。《蒙娜丽莎》更极端：从 1503 年左右画起，一画十几年，带到法国身边直到死，也从未"交付"。丽莎·盖拉尔迪尼的笑容之所以捉摸不定，是因为他用极薄的釉染层层叠出嘴角与眼角的"渐隐法"（sfumato）——轮廓消失了，表情就活了。他到死没把它交给委托人。</p>
        <figure><img src="夜建素材库-2026-11-05/07-davinci-素材/last-supper-1495-1498.jpg" alt="最后的晚餐"><figcaption>《最后的晚餐》1495-1498 · 米兰恩宠圣母堂食堂</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/07-davinci-素材/mona-lisa-1503-1519.jpg" alt="蒙娜丽莎"><figcaption>《蒙娜丽莎》c.1503-1519 · 卢浮宫藏</figcaption></figure>
        <div class="ia-quote">充实的一天带来安稳的睡眠，充实的一生带来安稳的死亡。<small>—— 达·芬奇笔记本 · "学者休息于其完成之日，正如愚人殁于其懵懂之时"</small></div>
        <p>可他笔记本里最密的字迹，不是关于画的。他一生解剖了三十多具遗体，在 1489 年前后的手稿上画出了人类史上第一批准确的心脏、子宫、颅骨与肌肉解剖图——他画下主动脉瓣的涡旋结构，五百年后心脏外科医生确认它是对的。1490 年前后，他画下《维特鲁威人》：一个人站在圆与方里，手臂丈量宇宙的比例。<em class="hl">这是私生子向世界交出的答卷：不许入学的孩子，用左手反写的字，给"人"下了定义。</em>但他解剖、观察、记录了几千页笔记，生前几乎没有出版；他设计飞行器、坦克、潜水服，大多停在纸上。这正是他的命运结构：一切都指向完成，一切又都停在最接近完成的地方。1519 年 5 月 2 日他死于法国昂布瓦兹，弗朗索瓦一世的怀中（据传）。留下不到二十幅确凿的完整油画，和七千多页没写完的手稿。</p>
        <figure><img src="夜建素材库-2026-11-05/07-davinci-素材/vitruvian-man-1490.jpg" alt="维特鲁威人"><figcaption>《维特鲁威人》c.1490 · 威尼斯学院美术馆藏</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/07-davinci-素材/salvator-mundi-1500.jpg" alt="救世主"><figcaption>《救世主》c.1500 · 私人收藏（2017年以4.5亿美元成交）</figcaption></figure>
        <p>你要问他为什么拖、为什么留白——因为在他眼里，画只是研究的副产品，而世界太小，研究不完。私生子没有可继承的身份，就把"未完成"活成了自己的身份：<em class="hl">《三博士》停在风暴前，《晚餐》正在剥落，蒙娜丽莎从未交付，可正是这些半成品成了人类最完整的遗产。</em>一个左撇子用镜像字写下的每一页手稿，都是写给未来世界的密信——他笃定后人会来读。我们来了，读到了，也仍在替他"未完成"。</p>
    </div>
    <div class="ia-colophon">LEONARDO DA VINCI · 1452-1519 · VINCI—FIRENZE—MILANO—AMBROISE</div>

    <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
    <h2>用点数出的光</h2>
    <div class="ia-sub">GEORGES SEURAT · 1859-1891 · 分色点彩是科学，不是笔触</div>
    <div class="ia-rule"></div>
    <div class="article">
        <p class="ia-dropcap">乔治·修拉生在巴黎一个公证员家庭。1859 年出生，家道殷实，举止规整，从不缺钱——这在一个靠卖画为生的行当里几乎是异类。他一生留下的照片里，那个人络腮胡、高领、领带一丝不苟，坐在椅子上侧过脸去，几乎不看镜头。同时代人对他的一致印象是两个字：沉默。他不参与印象派圈子里的争吵，不给自己的画写辩护文章，在咖啡馆里也只是听。西涅克后来回忆，他说话又轻又慢，"仿佛每个词都称过分量"。一个公证员的儿子，从小受的训练就是：当事人说什么都记下来，什么都不能说出去。<em class="hl">他把守密的性格，画成了一种画法。</em></p>
        <p>1878 年他进入巴黎美术学校，在亨利·莱曼门下学古典素描，临摹普桑和安格尔的素描原作。但真正决定他一生的，不是画室，而是图书馆。十九世纪八十年代初，他系统地啃了三部书：化学家谢弗勒尔 1839 年的《色彩的同时对比法则》、画家布兰科的《美术语法》、还有物理学家亥姆霍兹的色觉讲义。这些书讲的是同一件事：颜料混在一起是变暗的减色混合，而并排的两个小色点会在视网膜上自行融合、彼此增亮——<em class="hl">颜色不该在调色板上调，该在观众的眼睛里调。</em>修拉把这条物理规律直接搬上画布：不调色，用纯色的细小笔点并排铺开，让视觉替他完成"混合"。后来人们叫它分色法（divisionism），也叫点彩（pointillism）。这不是一种笔触趣味，是一套方法——他自己说得很冷静："他们在我画里看见诗。不是的，我只是执行我的方法，如此而已。"</p>
        <figure><img src="夜建素材库-2026-11-05/33-seurat-素材/grande-jatte-1884.jpg" alt="大碗岛的星期天下午"><figcaption>《大碗岛的星期天下午》1884-1886 · 芝加哥艺术学院藏 · 约 207×308 厘米</figcaption></figure>
        <p>1884 年是他命运的转折。第一幅大画《安耶里的浴者》被官方沙龙拒绝，他转而把画挂进了刚成立的"独立者沙龙"——那年他二十五岁，和一群被官方拒之门外的年轻人站到了同一边。夏天他开始画大碗岛：塞纳河中的一个小岛，巴黎人周末的野餐地。这幅《大碗岛的星期天下午》他画了整整两年，据西涅克统计，草图、变体稿、色彩习作加起来有上百张；最终成稿上，几十万个色点是用牙签一样细的笔尖一点一点摁上去的。画里撑阳伞的女人、牵猴子的时髦妇人、趴在草地上的人，全都静止不动，像被光凝固住了。1886 年它在第八届印象派画展上一出现，评论界立刻分成了两派：一半人嘲笑这些点，一半人意识到<em class="hl">绘画的一条新路从此有了名字。</em></p>
        <figure><img src="夜建素材库-2026-11-05/33-seurat-素材/bathers-asnieres-1884.jpg" alt="安耶里的浴者"><figcaption>《安耶里的浴者》1884 · 伦敦国家画廊藏</figcaption></figure>
        <p>之后的六年，他每年拿出一幅大画，像做实验一样推进这套方法。1887 年的《马戏团巡演》，用它来画煤气灯下的人工光；1888 年的《模特》，画面里嵌着另一幅《大碗岛》——同时向巴黎人展示"正面裸体"和"背面裸体"的学院难题；1890 年的《骚动》（Chahut），整幅画被拉长的线条和红橙黄搅成一片上扬的噪声；1890 年的《搽粉的年轻女人》，画的是他自己的伴侣玛德莱娜·克诺布洛赫。最后一幅《马戏团》1891 年还立在独立者沙龙的墙上，没有画完。</p>
        <figure><img src="夜建素材库-2026-11-05/33-seurat-素材/parade-circus-sideshow-1888.jpg" alt="马戏团巡演"><figcaption>《马戏团巡演》1887-1888 · 纽约大都会艺术博物馆藏</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/33-seurat-素材/models-les-poseuses-1888.jpg" alt="模特"><figcaption>《模特》1886-1888 · 费城巴恩斯基金会藏</figcaption></figure>
        <div class="ia-quote">他们在我画里看见诗。不是的，我只是执行我的方法，如此而已。<small>—— 修拉语，保罗·西涅克《从欧仁·德拉克罗瓦到新印象派》（1899）追记</small></div>
        <p>他几乎不留下任何私生活的痕迹，所以结尾才格外残忍。1890 年 2 月，玛德莱娜为他生下一个儿子皮埃尔。1891 年 3 月 29 日，修拉在梅斯尼埃街的画室里突然病倒——白喉，一种今天有疫苗的细菌感染。31 岁的他在 3 月 31 日死去，几天后，尚在产褥期的玛德莱娜也被同一种病拖垮，随后死去；幼子皮埃尔跟着天折。短短几周，一个三口之家被一种病抹平。他画完了八幅大画，没画完第九幅；开创了一门画法，没来得及看它被继承——西涅克接过了旗帜，"新印象派"这个词，是替死者立起来的碑。</p>
        <figure><img src="夜建素材库-2026-11-05/33-seurat-素材/chahut-1890.jpg" alt="骚动"><figcaption>《骚动》（Le Chahut）1889-1890 · 荷兰奥特洛克罗勒-穆勒博物馆藏</figcaption></figure>
        <p>留不到十幅大作，却在美术史上立起了一个全新的动词。你站在《大碗岛》前退后两步，那些点忽然在视网膜上亮起来，河面泛光，草地发烫——那一刻正在发生的事，是 1880 年代一本化学书和一个沉默的人约好的：<em class="hl">光不在画布上，光在你的眼睛里。</em></p>
        <figure><img src="夜建素材库-2026-11-05/33-seurat-素材/the-circus-1891.jpg" alt="马戏团"><figcaption>《马戏团》（未完成）1890-1891 · 巴黎奥赛博物馆藏</figcaption></figure>
    </div>
    <div class="ia-colophon">GEORGES SEURAT · 1859-1891 · PARIS</div>
`

                    html: `
    <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
    <h2>大理石里的囚徒</h2>
    <div class="ia-sub">MICHELANGELO · 1475-1564 · 他从不觉得那是创作，是苦役与释放</div>
    <div class="ia-rule"></div>
    <div class="article">
        <p class="ia-dropcap">1475 年 3 月 6 日，米开朗基罗·博那罗蒂（Michelangelo Buonarroti）生在托斯卡纳的卡普雷塞，父亲是当地任期将满的行政官，家道早已败落——这个自称出身"伯爵世家"的家庭，实际只剩姓氏和穷。母亲重病，他出生没多久就被送去一个石匠家喂奶，他后来跟人半开玩笑地说：自己是"随着奶水吸进了锤子和凿子的脾气"。十三岁他被送去吉兰达约的画坊当学徒，父亲暴怒，认为儿子去当工匠是家族奇耻，甚至动手打他。暴力没有拦住他，反而在他身上刻下一件事：艺术不是体面，艺术是他必须独自扛起的十字架。他终身几乎不交朋友、不讲究吃穿、和衣而睡——弟弟们骂他吝啬，他自己说："我穷，因为我把自己全部押在了工作上。"</p>
        <p>23 岁那年，他在罗马雕出《哀悼基督》，署名刻在圣母胸前的绶带上——这是他一生唯一一次署名，事后他又羞愧地凿掉了。29 岁，《大卫》立在市政厅门前，佛罗伦萨人从此叫他"巨人"。可他不觉得自己是天才，他觉得自己是工具。他常年睡在工地，穿狗皮靴子几个月不脱，脱下来时皮连着肉一起掉。给尤利乌斯二世画西斯廷天顶画时，他在诗里写自己：胡子朝天、颜料滴进脸里、脊椎弯得像弓、胸口像天鹅、脖颈像猫头鹰——"我的脸是让别人把颜料泼上来的靶心"。他说教皇勒索了他三年苦力，签的合同根本不是画家的话，可他照样签、照样画。</p>
        <figure><img src="夜建素材库-2026-11-05/08-michelangelo-drawing-素材/creation-of-adam-1512.jpg" alt="创造亚当"><figcaption>《创造亚当》1512 · 西斯廷天顶画 · 梵蒂冈西斯廷礼拜堂</figcaption></figure>
        <p>1508 到 1512 年，整整四年多，他一个人站在十九米高的脚手架上，仰着头，把五百多平方米的天顶一个局部一个局部画完。《创造亚当》里，上帝与亚当的手指之间只留一道缝，那道缝成了整个文艺复兴最著名的"一厘米"；《先知耶利米》垂着头、撑着下巴，沉入最深的孤独——他自己就是那个先知：领了使命，无人分担，只能咽下去。四年仰头作画，他的颈椎坏到后来读信都得把纸举过头顶仰着看。1512 年揭幕那天，整个罗马进城来看。他没有去看热闹——他在赶下一件活。</p>
        <figure><img src="夜建素材库-2026-11-05/08-michelangelo-drawing-素材/prophet-jeremiah-1512.jpg" alt="先知耶利米"><figcaption>《先知耶利米》1512 · 西斯廷天顶画 · 梵蒂冈西斯廷礼拜堂</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/08-michelangelo-drawing-素材/ancestors-of-christ-nahshon-1512.jpg" alt="基督的祖先：拿顺"><figcaption>《基督的祖先：拿顺》1512 · 西斯廷天顶画拱肩 · 梵蒂冈</figcaption></figure>
        <p>他也写诗，一生写下三百多首。他在诗里写手艺、写孤独、写爱而不得的老之将至，还把诗句直接刻在画室的墙上。他有一个贯穿一生的信条，别人当美学格言读，他当事实说：<em class="hl">形体本来就囚禁在大理石里，他只是把囚徒放出来。</em>雕塑是释放，绘画也是——西斯廷祭坛墙上那幅《最后的审判》（1536-1541），是他二十多年后重返天顶画之地，把整堵墙画成一场没有出口的坠落：基督抬起的手臂像审判的雷，圣徒们惊惶，人群在漩涡里被拉上天堂或拽进地狱，圣巴多罗买提着一张人皮，那张皮的脸，是他自己的脸——把自己也扔进末日审判里，等宣判。</p>
        <div class="ia-quote">我在雕刻中释放囚禁在大理石里的形体，我只是把多余的部分去掉。<small>—— 米开朗基罗 · 论雕塑（波吉尼据其口述记）</small></div>
        <figure><img src="夜建素材库-2026-11-05/08-michelangelo-drawing-素材/last-judgement-1541.jpg" alt="最后的审判"><figcaption>《最后的审判》1541 · 祭坛湿壁画 · 梵蒂冈西斯廷礼拜堂</figcaption></figure>
        <p>晚年他画的东西越来越轻、越来越暗、越来越"不像画"：《拉撒路的复活》稿子、《基督十字架》习作（1548）、为保利纳礼拜堂画的《圣彼得殉道》（1550）——他把构图剥到只剩几个躯体和一道光，肉在他笔下褪成重量和忏悔。1530 年代他为避乱客居罗马，画下的《圣母、圣子与圣约翰》（c.1530）里，逃亡的圣家族瘦削、僵硬、彼此抓紧，那是他自己流亡时的一家。他晚年与诗人维多利亚·科隆娜相识，在她影响的最后岁月里，他在十四行诗里写道：绘画与雕塑不能再安抚他的灵魂，灵魂转向了钉在十字架上的上帝之爱。1564 年 2 月 18 日，他在罗马去世，离 89 岁生日只差两周。遗嘱只有一句：把灵魂交给上帝，把身体还给大地——他要求把遗骸偷运回佛罗伦萨，葬在圣十字教堂，<em class="hl">像货物一样裹在毯子里运回</em>，因为他始终认定自己只是佛罗伦萨的一件手艺。</p>
        <figure><img src="夜建素材库-2026-11-05/08-michelangelo-drawing-素材/madonna-child-st-john-1530.jpg" alt="圣母、圣子与圣约翰"><figcaption>《圣母、圣子与圣约翰》c.1530 · 黑粉笔 · 后世木版油彩</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/08-michelangelo-drawing-素材/study-christ-on-cross-1548.jpg" alt="十字架上的基督习作"><figcaption>《十字架上的基督》习作 1548 · 温莎皇家图书馆藏</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/08-michelangelo-drawing-素材/martyrdom-of-st-peter-1550.jpg" alt="圣彼得殉道"><figcaption>《圣彼得殉道》1550 · 湿壁画 · 梵蒂冈保利纳礼拜堂</figcaption></figure>
        <p>你要问他为什么一辈子自讨苦吃——一个被父亲打过、被教皇骂过、被战争驱赶过的穷官员之子，唯一能抓住的就是"上帝借我的手做工"这个信念。于是苦役变成使命，牢笼变成大理石，末日的恐惧变成那张画上的人皮。他放出来的那些形体，至今都还在石头里站得笔直。</p>
    </div>
    <div class="ia-colophon">MICHELANGELO BUONARROTI · 1475-1564 · FIRENZE / ROMA</div>
`

        // 卡片图片路径：已收录品牌 → 素材文件夹展示图（cardImage 优先，缺省用卡牌封面）；其余 → images/<栏目>/<子页名>/<卡片名>.png
        function cardImagePath(category, subpage, cardName) {
            const asset = BRAND_ASSETS[cardName];
            if (asset) {
                if (asset.remoteCover) return asset.remoteCover; // 无本地素材时用网络肖像图
                return `${asset.folder}/${asset.cardImage || asset.cover}`;
            }
            return `images/${category}/${subpage}/${cardName}.png`;
        }

        // ===== 我的名录：卡片一~五（按栏目隔离：品牌收品牌、城史收城史） =====
        // 按栏目分库存：brand 与 city 各自独立收录
        function myCardsKey(type) { return 'ideology-my-cards-' + type; }

        function loadMyCards(type) {
            try {
                const v = JSON.parse(localStorage.getItem(myCardsKey(type)));
                if (Array.isArray(v)) return v;
            } catch (e) {}
            return [null, null, null, null, null];
        }

        function saveMyCards(cards, type) {
            try { localStorage.setItem(myCardsKey(type), JSON.stringify(cards)); } catch (e) {}
        }

        function renderMyCards(grid, type) {
            grid.innerHTML = '';
            if (type === 'city') { renderCityCards(grid); return; }
            const cards = loadMyCards(type);
            for (let i = 0; i < 5; i++) {
                grid.appendChild(createMyCard(i, cards[i], type));
            }
        }

        // 城史名录行：首位 = 当前城市（自动跟随右上角选择），后四位空白
        // 我的城市神祇：邯郸卡打头（不动）+ 雪/月/日/星/风/云/山/水/城 九意象首图
        function renderLightCards(grid) {
            grid.innerHTML = '';
            grid.appendChild(createCard('city', 'latest', 'Handan 邯郸'));
            const imagery = ['山水', '四季', '城史'];
            imagery.forEach(n => {
                const sp = SITE_DATA.city.subpages.find(x => x.name === n);
                const first = sp ? sp.cards[0] : null;
                const dataUrl = first ? loadArtImage(first) : null;
                const card = document.createElement('div');
                card.className = 'brand-card';
                if (dataUrl) {
                    const frame = document.createElement('div');
                    frame.className = 'my-card-filled art-frame';
                    applyArtFrame(frame, first, dataUrl);
                    card.appendChild(frame);
                } else {
                    const empty = document.createElement('div');
                    empty.className = 'my-card-empty';
                    empty.innerHTML = '<div class="plus"></div><div class="hint">' + n + '</div>';
                    card.appendChild(empty);
                }
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = n;
                card.appendChild(name);
                grid.appendChild(card);
            });
        }

        function renderCityCards(grid) {
            let saved = null;
            try { saved = localStorage.getItem('ideology-my-city'); } catch (e) {}
            grid.appendChild(createCityCurrentCard(saved));
            // 后续卡位：可上传图片，可自行增加
            appendCitySlots(grid, 'row', ['城位一', '城位二', '城位三', '城位四']);
        }

        // ===== 城史通用卡位：上传图片 + 无限增加 =====
        function loadSlotNames(key, initial) {
            try {
                const v = JSON.parse(localStorage.getItem('ideology-slots-' + key));
                if (Array.isArray(v)) return v;
            } catch (e) {}
            return initial.slice();
        }

        function saveSlotNames(key, list) {
            try { localStorage.setItem('ideology-slots-' + key, JSON.stringify(list)); } catch (e) {}
        }

        // prefix：卡位归属前缀（如 '山水·'），图片按 前缀+卡位名 存取，保证各子页专栏卡位互相独立
        function appendCitySlots(container, key, initial, prefix, fixed) {
            prefix = prefix || '';
            (fixed ? initial : loadSlotNames(key, initial)).forEach(n => {
                const card = document.createElement('div');
                card.className = 'brand-card my-card';
                const dataUrl = loadArtImage(n);
                if (dataUrl) {
                    const frame = document.createElement('div');
                    frame.className = 'my-card-filled art-frame';
                    applyArtFrame(frame, n, dataUrl);
                    enableArtPan(frame, n);
                    card.appendChild(frame);
                } else {
                    const empty = document.createElement('div');
                    empty.className = 'my-card-empty';
                    empty.style.cursor = 'pointer';
                    empty.innerHTML = '<div class="plus">＋</div><div class="hint">导入图片</div>';
                    card.appendChild(empty);
                    card.addEventListener('click', () => importArtImage((d) => { saveArtImage(n, d); refreshCardGrid(); }));
                }
                const tools = document.createElement('div');
                tools.className = 'my-card-tools';
                const rm = document.createElement('button');
                rm.textContent = '移除';
                rm.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeArtImage(n);
                    refreshCardGrid();
                });
                tools.appendChild(rm);
                if (!fixed) {
                    const del = document.createElement('button');
                    del.textContent = '删除卡位';
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        removeArtImage(n);
                        saveSlotNames(key, loadSlotNames(key, initial).filter(x => x !== n));
                        renderCityLatest();
                    });
                    tools.appendChild(del);
                }
                card.appendChild(tools);
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = prefix ? n.slice(prefix.length) : n;
                card.appendChild(name);
                container.appendChild(card);
            });
            if (!fixed) {
                const card = document.createElement('div');
                card.className = 'brand-card my-card';
                const empty = document.createElement('div');
                empty.className = 'my-card-empty';
                empty.style.cursor = 'pointer';
                empty.innerHTML = '<div class="plus">＋</div><div class="hint">增加卡位</div>';
                card.appendChild(empty);
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = '增加卡位';
                card.appendChild(name);
                card.addEventListener('click', () => {
                    const list2 = loadSlotNames(key, initial);
                    const raw = (window.prompt('卡位名称（留空自动编号）') || ('卡位' + (list2.length + 1))).trim();
                    list2.push(prefix + raw);
                    saveSlotNames(key, list2);
                    refreshCityViews();
                });
                container.appendChild(card);
            }
        }

        function refreshCityViews() {
            // 只刷新专栏目录；子页卡片区不再被旧版"城位"行覆盖
            renderCityLatest();
        }

        // 专栏目录：邯郸卡 + 本子页专属卡位（每个子页独立，互不串用）
        function renderCityLatest(subpage) {
            const grid = document.getElementById('latest-grid');
            if (!grid) return;
            subpage = subpage || currentSubpage;
            if (!subpage) return;
            grid.innerHTML = '';
            grid.appendChild(createCard('city', 'latest', 'Handan 邯郸'));
            const key = 'citylatest:' + subpage.name;
            const prefix = subpage.name + '·';
            const fixedSlots = currentSubpage.fixedSlots || [];
            const extrasKey = 'extras:' + subpage.name;
            let extras = [];
            try { extras = JSON.parse(localStorage.getItem(extrasKey) || '[]'); } catch (e) { extras = []; }
            appendCitySlots(grid, key, fixedSlots.map(n => prefix + n).concat(extras), prefix, false, fixedSlots.length);
        }

        function createCityCurrentCard(savedText) {
            const card = document.createElement('div');
            card.className = 'brand-card my-card';
            if (savedText) {
                const entry = SITE_DATA.city.designers.find(n => n.endsWith(' ' + savedText));
                const key = entry || savedText;
                const asset = BRAND_ASSETS[key];
                if (asset) {
                    const filled = document.createElement('div');
                    filled.className = 'my-card-filled';
                    filled.style.backgroundImage = `url("${asset.folder}/${asset.cardImage || asset.cover}")`;
                    card.appendChild(filled);
                    const name = document.createElement('div');
                    name.className = 'card-name';
                    name.textContent = savedText;
                    card.appendChild(name);
                    // 点击 → 视觉意识形态内页
                    card.addEventListener('click', () => showBrandAssets(key));
                    // 悬停工具：取消当前城市
                    const tools = document.createElement('div');
                    tools.className = 'my-card-tools';
                    const del = document.createElement('button');
                    del.textContent = '取消';
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        try { localStorage.removeItem('ideology-my-city'); } catch (e2) {}
                        refreshCityCards();
                    });
                    tools.appendChild(del);
                    card.appendChild(tools);
                } else {
                    const gray = document.createElement('div');
                    gray.className = 'my-card-gray';
                    card.appendChild(gray);
                    const name = document.createElement('div');
                    name.className = 'card-name';
                    name.textContent = savedText;
                    card.appendChild(name);
                }
            } else {
                const empty = document.createElement('div');
                empty.className = 'my-card-empty';
                empty.style.cursor = 'default';
                empty.innerHTML = '<div class="plus">◇</div><div class="hint">在右上角选择你的城市</div>';
                card.appendChild(empty);
            }
            return card;
        }

        function refreshCityCards() {
            renderMyCards(document.getElementById('card-grid'), 'city');
        }

        function createMyCard(index, data, type) {
            const card = document.createElement('div');
            card.className = 'brand-card my-card';
            if (data && BRAND_ASSETS[data.brand]) {
                const asset = BRAND_ASSETS[data.brand];
                const filled = document.createElement('div');
                filled.className = 'my-card-filled';
                // 收录卡统一展示该品牌的设计师肖像（cardImage）
                filled.style.backgroundImage = `url("${asset.folder}/${asset.cardImage || asset.cover}")`;
                card.appendChild(filled);
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = data.brand;
                card.appendChild(name);
                // 点击收录卡 → 进入该品牌的视觉意识形态内页
                card.addEventListener('click', () => showBrandAssets(data.brand));
                // 悬停工具：进入官网购买 / 移除
                const tools = document.createElement('div');
                tools.className = 'my-card-tools';
                const shop = document.createElement('button');
                shop.textContent = '进入官网购买';
                shop.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (asset.site) window.open(asset.site, '_blank');
                });
                const del = document.createElement('button');
                del.textContent = '移除';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const cards = loadMyCards(type);
                    cards[index] = null;
                    saveMyCards(cards, type);
                    renderMyCards(document.getElementById('card-grid'), type);
                });
                tools.appendChild(shop);
                tools.appendChild(del);
                card.appendChild(tools);
            } else if (data) {
                // 已收录但未建素材库：灰色占位卡，显示名称，无点击功能
                const gray = document.createElement('div');
                gray.className = 'my-card-gray';
                card.appendChild(gray);
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = data.brand;
                card.appendChild(name);
            } else {
                const empty = document.createElement('div');
                empty.className = 'my-card-empty';
                empty.innerHTML = '<div class="plus">+</div><div class="hint">' + (type === 'city' ? '收录城市' : '收录品牌') + '</div>';
                card.appendChild(empty);
                card.addEventListener('click', () => openPicker(index, type));
            }
            return card;
        }

        // ===== 弹出选择器：按栏目类型选条目 → 选素材图 → 收录到卡片 =====
        let pickerSlot = null;
        let pickerBrand = null;
        let pickerType = 'brand';

        function openPicker(slot, type) {
            pickerSlot = slot;
            pickerType = type || 'brand';
            pickerBrand = null;
            ensurePicker();
            renderPicker();
            document.getElementById('card-picker').classList.add('open');
        }

        function closePicker() {
            document.getElementById('card-picker').classList.remove('open');
        }

        function ensurePicker() {
            if (document.getElementById('card-picker')) return;
            const overlay = document.createElement('div');
            overlay.id = 'card-picker';
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closePicker();
            });
            const panel = document.createElement('div');
            panel.className = 'picker-panel';
            overlay.appendChild(panel);
            document.body.appendChild(overlay);
        }

        function renderPicker() {
            const asset = pickerBrand ? BRAND_ASSETS[pickerBrand] : null;
            const panel = document.querySelector('#card-picker .picker-panel');
            panel.innerHTML = '';

            const close = document.createElement('button');
            close.className = 'picker-close';
            close.textContent = '×';
            close.addEventListener('click', closePicker);
            panel.appendChild(close);

            const title = document.createElement('div');
            title.className = 'picker-title';
            title.textContent = `${pickerType === 'city' ? '收录城市' : '收录品牌'} · 卡片${'一二三四五'[pickerSlot]}`;
            panel.appendChild(title);

            const brands = document.createElement('div');
            brands.className = 'picker-brands';
            // 只列出本栏目类型的条目：品牌收品牌、城史收城史（A-Z 排序）
            // 点击品牌名即完成收录——展示图统一用该品牌的设计师肖像，不再逐张选图
            Object.keys(BRAND_ASSETS).filter(b => (BRAND_ASSETS[b].type || 'brand') === pickerType).sort((a, b) => a.localeCompare(b)).forEach(b => {
                const btn = document.createElement('button');
                btn.textContent = b;
                btn.addEventListener('click', () => {
                    const cards = loadMyCards(pickerType);
                    cards[pickerSlot] = { brand: b };
                    saveMyCards(cards, pickerType);
                    closePicker();
                    renderMyCards(document.getElementById('card-grid'), pickerType);
                });
                brands.appendChild(btn);
            });
            panel.appendChild(brands);

            const tip = document.createElement('div');
            tip.className = 'picker-tip';
            tip.textContent = '点击品牌名完成收录 · 收录后统一展示设计师肖像';
            panel.appendChild(tip);
        }

        // 创建卡片（图片加载失败时显示灰色占位块）
        function createCard(category, subpage, cardName) {
            const card = document.createElement('div');
            card.className = 'brand-card';

            // 已收录品牌：整卡可点击进入品牌素材页
            if (BRAND_ASSETS[cardName]) {
                card.classList.add('brand-link');
                card.addEventListener('click', () => showBrandAssets(cardName));
            }

            if (category === 'home' && subpage.name === '学习设计') {
                const tc = document.createElement('div');
                tc.className = 'card-img home-text-card';
                const t = document.createElement('div');
                t.textContent = cardName;
                tc.appendChild(t);
                card.appendChild(tc);
                const nm2 = document.createElement('div');
                nm2.className = 'card-name';
                nm2.textContent = cardName;
                card.appendChild(nm2);
                return card;
            }
            const img = document.createElement('img');
            img.className = 'card-img';
            img.src = cardImagePath(category, subpage, cardName);
            img.alt = cardName;
            img.onerror = function() {
                const placeholder = document.createElement('div');
                placeholder.className = 'card-img';
                img.replaceWith(placeholder);
            };

            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = cardName;

            // 配置了获取指南的素材库：卡片右上角提供"跳转网站"工具按钮（与移除按钮同位置）
            const asset = BRAND_ASSETS[cardName];
            if (asset && asset.guide) {
                card.classList.add('my-card');
                const tools = document.createElement('div');
                tools.className = 'my-card-tools';
                const jump = document.createElement('a');
                jump.className = 'tool-link';
                jump.href = asset.guide.url;
                jump.target = '_blank';
                jump.rel = 'noopener';
                jump.textContent = '跳转网站';
                jump.addEventListener('click', (e) => e.stopPropagation()); // 不触发整卡进入素材页
                tools.appendChild(jump);
                // 收录按钮：品牌 → 收录卡位；绘画 → 绘画薄册收录区
                const collect = document.createElement('button');
                collect.className = 'tool-link';
                const isBrand = (asset.type || 'brand') === 'brand' && category === 'brand';
                const isArtPainter = asset.type === 'art';
                if (isBrand) {
                    const cards = loadMyCards('brand');
                    const already = cards.some(c => c && c.brand === cardName);
                    collect.textContent = already ? '已收录' : '收录';
                    if (already) collect.style.backgroundColor = '#000';
                    collect.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const cs = loadMyCards('brand');
                        if (cs.some(c => c && c.brand === cardName)) {
                            const idx = cs.findIndex(c => c && c.brand === cardName);
                            cs[idx] = null;
                            collect.textContent = '收录';
                            collect.style.backgroundColor = '';
                        } else {
                            const empty = cs.findIndex(c => !c);
                            cs[empty >= 0 ? empty : cs.length - 1] = { brand: cardName };
                            collect.textContent = '已收录';
                            collect.style.backgroundColor = '#000';
                        }
                        saveMyCards(cs, 'brand');
                        const topGrid = document.getElementById('card-grid');
                        if (topGrid) renderMyCards(topGrid, 'brand');
                    });
                    tools.appendChild(collect);
                }
                if (isArtPainter) {
                    let collected = [];
                    try { collected = JSON.parse(localStorage.getItem('artCollected') || '[]'); } catch (e) { collected = []; }
                    const already = collected.includes(cardName);
                    collect.textContent = already ? '已收录' : '收录';
                    if (already) collect.style.backgroundColor = '#000';
                    collect.addEventListener('click', (e) => {
                        e.stopPropagation();
                        let c = [];
                        try { c = JSON.parse(localStorage.getItem('artCollected') || '[]'); } catch (e2) { c = []; }
                        if (c.includes(cardName)) {
                            c = c.filter(x => x !== cardName);
                            collect.textContent = '收录';
                            collect.style.backgroundColor = '';
                        } else {
                            c.push(cardName);
                            collect.textContent = '已收录';
                            collect.style.backgroundColor = '#000';
                        }
                        localStorage.setItem('artCollected', JSON.stringify(c));
                        renderCollectGrid();
                    });
                    tools.appendChild(collect);
                }
                card.appendChild(tools);
            }

            card.appendChild(img);
            card.appendChild(name);
            return card;
        }

        // 渲染一个栏目：大标题 + 子导航 + 精选卡区(3张) + LATEST IN(5张/行 + 名录)
        function renderCategory(category) {
            const data = SITE_DATA[category];
            const main = document.getElementById('site-main');
            main.innerHTML = '';

            // 栏目大标题
            const hero = document.createElement('div');
            hero.className = 'category-hero';
            hero.innerHTML = `<h1>${data.hero}</h1>`;
            main.appendChild(hero);

            // 子导航
            const subNav = document.createElement('nav');
            subNav.className = 'sub-nav';
            const ul = document.createElement('ul');
            data.subpages.forEach((sp, i) => {
                const li = document.createElement('li');
                li.textContent = sp.name;
                if (i === 0) li.classList.add('active');
                li.addEventListener('click', () => {

        // 渲染某子页的精选卡片（品牌、城史 = 我的名录；艺术 = 导入图片卡/定表；其他 = 占位卡）
        function renderCardGrid(category, subpage) {

                // 专栏目录卡位：本子页专属
                renderCityLatest(subpage);

                // 各意象分类子页：按各自名称的卡位导入图片（山水一~十六、景点一~十六等）
                subpage.cards.forEach(n => grid.appendChild(createArtCard(n)));

                    if (lt) lt.style.display = 'none';
                    grid.style.paddingBottom = '80px';
                } else {
                    subpage.cards.forEach((n, idx) => grid.appendChild(createArtCard(n, null, { firstBtn: { index: idx, cards: subpage.cards } })));
                    updateArtDirectory(subpage);
                    renderArtLatest(subpage);
                    grid.style.paddingBottom = '';
                    const lf = document.querySelector('.latest-flex');
                    if (lf) lf.style.display = '';
                    const lt = document.querySelector('.latest-title');

            if (category === 'home') {

                const lt = document.querySelector('.latest-title');
                if (lt) lt.style.display = hide ? 'none' : '';

                if (lf) lf.style.display = hide ? 'none' : '';

            if (category === 'home' && subpage.name === '我的家') {

                grid.appendChild(createHomeBigImage());
                subpage.cards.forEach(n => grid.appendChild(createArtCard(n, functions[n] || '')));
                loadHomeCards().forEach(c => grid.appendChild(createArtCard(c.name, c.func || '', { custom: true })));
                grid.appendChild(createHomeAddCard());

        // ===== 艺术栏目：卡牌导入图片（存浏览器本地，自动压缩） =====
        function artImgKey(name) { return 'ideology-art-img:' + name; }

        function loadArtImage(name) {
            try { return localStorage.getItem(artImgKey(name)); } catch (e) { return null; }
        }

        function saveArtImage(name, dataUrl) {
            try { localStorage.setItem(artImgKey(name), dataUrl); }
            catch (e) { alert('浏览器本地存储空间不足，图片未能保存（可换小一点的图）'); }
        }

        function removeArtImage(name) {
            try { localStorage.removeItem(artImgKey(name)); } catch (e) {}
        }

        // 图片在卡内的显示位置（双击拖拽调整，按卡名保存）
        function artPosKey(name) { return 'ideology-art-pos:' + name; }

        function loadArtPos(name) {
            try {
                const v = JSON.parse(localStorage.getItem(artPosKey(name)));
                if (v && typeof v.x === 'number') return v;
            } catch (e) {}
            return { x: 50, y: 50 };
        }

        function saveArtPos(name, pos) {
            try { localStorage.setItem(artPosKey(name), JSON.stringify(pos)); } catch (e) {}
        }

        function applyArtFrame(el, name, dataUrl) {
            // 完整显示：图片按 contain 适配，空余部分白色填充，卡框保持标准尺寸
            el.style.backgroundImage = `url("${dataUrl}")`;
            el.style.backgroundSize = 'contain';
            el.style.backgroundRepeat = 'no-repeat';
            el.style.backgroundPosition = 'center';
            el.style.backgroundColor = '#ffffff';
        }

        // 选择本机图片 → 压缩到最长边1200px → 回调返回 dataURL
        function importArtImage(cb, maxPx) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.addEventListener('change', () => {
                const file = input.files && input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const max = maxPx || 1200;
                        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
                        const c = document.createElement('canvas');
                        c.width = Math.round(img.naturalWidth * scale);
                        c.height = Math.round(img.naturalHeight * scale);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        cb(c.toDataURL('image/jpeg', 0.85));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
            input.click();
        }

        function refreshCardGrid() {
            renderCardGrid(currentCategory, currentSubpage || SITE_DATA[currentCategory].subpages[0]);
        }

        function createArtCard(cardName, subtitle, opts) {
            opts = opts || {};
            const card = document.createElement('div');
            card.className = 'brand-card my-card art-card';
            const dataUrl = loadArtImage(cardName);
            if (dataUrl) {
                const frame = document.createElement('div');
                frame.className = 'my-card-filled art-frame';
                applyArtFrame(frame, cardName, dataUrl);
                card.appendChild(frame);
                // 悬停工具
                const tools = document.createElement('div');
                tools.className = 'my-card-tools';
                if (opts.firstBtn) {
                    const first = document.createElement('button');
                    first.textContent = '置于首位';
                    first.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // 把当前卡轮换到首位：原首图依次后移一位
                        const seq = opts.firstBtn.cards.slice(0, opts.firstBtn.index + 1);
                        const imgs = seq.map(n => loadArtImage(n));
                        const last = imgs.pop();
                        imgs.unshift(last);
                        seq.forEach((n, i) => {
                            if (imgs[i]) saveArtImage(n, imgs[i]);
                            else removeArtImage(n);
                        });
                        refreshCardGrid();
                    });
                    tools.appendChild(first);
                }
                const del = document.createElement('button');
                del.textContent = '移除';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeArtImage(cardName);
                    if (opts.custom) {
                        // 自定义卡：连卡片本身一起删除
                        const list = loadHomeCards().filter(c => c.name !== cardName);
                        saveHomeCards(list);
                    }
                    refreshCardGrid();
                });
                tools.appendChild(del);
                card.appendChild(tools);
            } else {
                const empty = document.createElement('div');
                empty.className = 'my-card-empty';
                empty.innerHTML = '<div class="plus">＋</div><div class="hint">导入图片</div>';
                card.appendChild(empty);
            }
            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = cardName;
            card.appendChild(name);
            if (subtitle) {
                const sub = document.createElement('div');
                sub.className = 'card-sub';
                sub.textContent = subtitle;
                card.appendChild(sub);
            }
            // 点击触发导入 = 仅空卡；已导入的卡点击不触发任何功能
            if (!dataUrl) {
                card.addEventListener('click', () => {
                    importArtImage((d) => { saveArtImage(cardName, d); refreshCardGrid(); });
                });
            }
            return card;
        }

        // 家居自定义卡：名称 + 功能词（存浏览器本地）
        function loadHomeCards() {
            try {
                const v = JSON.parse(localStorage.getItem('ideology-home-cards'));
                if (Array.isArray(v)) return v;
            } catch (e) {}
            return [];
        }

        function saveHomeCards(list) {
            try { localStorage.setItem('ideology-home-cards', JSON.stringify(list)); } catch (e) {}
        }

        function createHomeAddCard() {
            const card = document.createElement('div');
            card.className = 'brand-card my-card';
            const empty = document.createElement('div');
            empty.className = 'my-card-empty';
            empty.style.cursor = 'pointer';
            empty.innerHTML = '<div class="plus">＋</div><div class="hint">增加卡片</div>';
            card.appendChild(empty);
            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = '增加卡片';
            card.appendChild(name);
            card.addEventListener('click', () => {
                const name2 = window.prompt('房间名称（例如：阳台）');
                if (!name2) return;
                const func = window.prompt('功能（一句话，例如：晒太阳放松）') || '';
                const list = loadHomeCards();
                list.push({ name: name2.trim(), func: func.trim() });
                saveHomeCards(list);
                refreshCardGrid();
            });
            return card;
        }

        // 家居"我的家"：通栏大图（宽度=整行卡片区，完整显示）
        function createHomeBigImage() {
            const wrap = document.createElement('div');
            wrap.style.width = '100%';
            wrap.style.marginBottom = '44px';
            const key = '我的家大图';
            const dataUrl = loadArtImage(key);

                img.alt = '我的家 · 全屋大图';

                const tools = document.createElement('div');
                tools.className = 'my-card-tools';
                tools.style.display = 'flex';
                const del = document.createElement('button');
                del.textContent = '移除';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeArtImage(key);
                    refreshCardGrid();
                });
                tools.appendChild(del);
                wrap.appendChild(img);
                wrap.appendChild(tools);
            } else {
                const empty = document.createElement('div');
                empty.className = 'my-card-empty';
                empty.style.aspectRatio = 'auto';
                empty.style.height = '300px';
                empty.style.width = '100%';
                empty.style.cursor = 'pointer';
                empty.innerHTML = '<div class="plus">＋</div><div class="hint">导入全屋大图</div>';
                empty.addEventListener('click', () => {
                    importArtImage((d) => { saveArtImage(key, d); refreshCardGrid(); }, 2000);
                });
                wrap.appendChild(empty);
            }
            return wrap;
        }

        // 定表：汇聚绘画~游戏每个门类的第一张卡（绘画一、雕塑一……游戏一）
        function renderDingbiao(grid) {
            grid.innerHTML = '';

                const first = sp.cards[0];

        // 渲染品牌名录：左侧滚动列表（按字母分组）+ 右侧A-Z索引栏
        // 艺术 LATEST IN：按当前子页过滤显示（绘画→画家卡，雕塑→雕塑家卡，定表→全部）
        function renderArtLatest(subpage) {
            const grid = document.getElementById('latest-grid');
            if (!grid) return;
            grid.innerHTML = '';
            // 卡位顺序 = 绘画薄册目录（artGroups）顺序
            const all = Object.keys(BRAND_ASSETS).filter(b => BRAND_ASSETS[b].type === 'art');
            let oi = null;
            try {
                const groups = SITE_DATA.art.artGroups;
                oi = {};
                let k = 0;
                groups.forEach(g => g.members.forEach(n => { if (!(n in oi)) oi[n] = k++; }));
            } catch (e) {}
            all.sort((a, b) => {
                const ia = oi && (a in oi) ? oi[a] : 9999;
                const ib = oi && (b in oi) ? oi[b] : 9999;
                return ia - ib;
            });
            all.forEach(b => {
                const a = BRAND_ASSETS[b];
                if (a.sub && subpage.name !== '定表' && a.sub !== subpage.name) return;
                grid.appendChild(createCard('art', subpage.name, b));
            });
        }

        // ===== 品牌：手机端"全部品牌"浮动圆圈 + 全屏名录（Vogue 同款） =====
        // 按住拖动：调整图片显示区域，松手即保存
        function enableArtPan(el, name) {
            el.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const pos = loadArtPos(name);
                const startX = e.clientX, startY = e.clientY;
                const sx = pos.x, sy = pos.y;
                el.style.cursor = 'grabbing';
                el.style.userSelect = 'none';
                const move = (ev) => {
                    const r = el.getBoundingClientRect();
                    const dx = (ev.clientX - startX) / r.width * 100;
                    const dy = (ev.clientY - startY) / r.height * 100;
                    pos.x = Math.max(0, Math.min(100, sx - dx));
                    pos.y = Math.max(0, Math.min(100, sy - dy));
                    el.style.backgroundPosition = pos.x + '% ' + pos.y + '%';
                };
                const up = () => {
                    document.removeEventListener('mousemove', move);
                    document.removeEventListener('mouseup', up);
                    el.style.cursor = '';
                    el.style.userSelect = '';
                    saveArtPos(name, pos);
                };
                document.addEventListener('mousemove', move);
                document.addEventListener('mouseup', up);
            });
        }

        function renderDesignerDirectory(container, category, designers, zhMode) {
            const section = document.createElement('div');
            section.className = 'designer-directory';

            const panel = document.createElement('div');
            panel.className = 'directory-panel';

            // 左侧列表：按首字母分组排序
            const list = document.createElement('div');
            list.className = 'directory-list';
            // zhMode：数据为「拼音 + 中文」，界面只显示中文，排序/分组按拼音
            const entries = designers.map(name => {
                const m = zhMode ? name.match(/^([A-Za-z'-s]+?)s+([一-鿿].*)$/) : null;
                return m ? { key: m[1], text: m[2] } : { key: name, text: name };
            });
            const groups = {};
            entries.forEach(e => {
                const letter = (e.key[0].toUpperCase() >= 'A' && e.key[0].toUpperCase() <= 'Z')
                    ? e.key[0].toUpperCase() : '#';
                if (!groups[letter]) groups[letter] = [];
                groups[letter].push(e);
            });
            const letters = Object.keys(groups).sort((a, b) => (a === '#' ? 1 : b === '#' ? -1 : a.localeCompare(b)));

            letters.forEach(letter => {
                const h = document.createElement('div');
                h.className = 'directory-letter';
                h.dataset.letter = letter;
                h.innerHTML = `<span>${letter}</span>`;
                list.appendChild(h);

                const ul = document.createElement('ul');
                const items = zhMode
                    ? groups[letter].slice().sort((a, b) => a.key.localeCompare(b.key))
                    : groups[letter]; // 品牌：保持VOGUE页面原生顺序，不重排
                items.forEach(e => {
                    const li = document.createElement('li');
                    li.textContent = e.text;
                    li.addEventListener('click', () => showDesigner(category, e.text));
                    ul.appendChild(li);
                });
                list.appendChild(ul);
            });

            // 右侧字母索引
            const rail = document.createElement('div');
            rail.className = 'directory-rail';
            'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('').forEach(letter => {
                const btn = document.createElement('button');
                btn.textContent = letter;
                btn.dataset.letter = letter;
                if (!letters.includes(letter)) {
                    btn.style.opacity = '0.25';
                    btn.style.cursor = 'default';
                } else {
                    btn.addEventListener('click', () => {
                        const target = list.querySelector(`[data-letter="${letter}"]`);
                        if (target) {
                            list.scrollTop = target.offsetTop - list.offsetTop - 10;
                            highlightRail(letter);
                        }
                    });
                }
                rail.appendChild(btn);
            });

            // 滚动时高亮当前字母
            list.addEventListener('scroll', () => {
                let current = letters[0];
                letters.forEach(letter => {
                    const h = list.querySelector(`[data-letter="${letter}"]`);
                    if (h && h.offsetTop - list.offsetTop <= list.scrollTop + 40) {
                        current = letter;
                    }
                });
                highlightRail(current);
            });

            panel.appendChild(list);
            panel.appendChild(rail);
            section.appendChild(panel);

            // 名录插到卡片左侧（LATEST IN 容器的第一个子元素）
            container.prepend(section);
        }

            });
        }
