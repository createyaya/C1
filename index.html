<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consciousness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #fff;
            color: #000;
        }

        /* ===== 黑色顶栏：品牌Logo + 主导航 ===== */
        .site-header {
            background-color: #000;
            padding: 18px 0 0;
            position: fixed; /* 大黑条固定在最上方，完全不参与滚动 */
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        /* 正文白色部分：独立滚动空间 */
        #site-main {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            overflow-y: auto;
        }

        .site-logo {
            text-align: center;
            color: #fff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 26px;
            font-style: italic;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .main-nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 28px;
            padding: 0 12px 14px;
        }

        .main-nav li {
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            color: #fff;
            transition: opacity 0.2s;
            position: relative;
            padding-bottom: 6px;
        }

        .main-nav li:hover {
            opacity: 0.65;
        }

        .main-nav li.active {
            font-weight: 500;
        }

        .main-nav li.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #fff;
        }

        /* ===== 栏目大标题（VOGUE: 64px, 上54 下40） ===== */
        .category-hero {
            text-align: center;
        }

        .category-hero h1 {
            font-size: 64px;
            font-weight: normal;
            margin: 0 auto;
            max-width: 1470px;
            padding: 54px 20px 40px;
        }

        /* 子导航（专题标题行，VOGUE h2: 32px 居中） */
        .sub-nav {
            text-align: center;
            padding: 0 20px;
            margin-bottom: 30px;
        }

        .sub-nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px 30px;
        }

        .sub-nav li {
            cursor: pointer;
            font-size: 32px;
            font-weight: 500;
            line-height: 1.3; /* 统一行高：纯英文子页名（PLAY）与中文对齐，不再上浮 */
            letter-spacing: 0.08px;
            color: #000;
            transition: opacity 0.2s;
        }

        .sub-nav li:hover {
            opacity: 0.55;
        }

        .sub-nav li.active {
            text-decoration: underline;
            text-underline-offset: 10px;
            text-decoration-thickness: 3px;
        }

        /* ===== 卡片区容器（VOGUE: max-width 1470, 左右45px） ===== */
        .card-section {
            max-width: 1470px;
            margin: 0 auto;
            padding: 0 45px;
        }

        /* 卡片区：row5，一行5张（VOGUE: 19%宽 上限280 列距1.25%） */
        .card-grid.row5 {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .card-grid.row5 .brand-card {
            width: 19%;
            max-width: 280px;
            margin-right: 1.25%;
            margin-bottom: 38px;
        }

        .card-grid.row5 .brand-card:nth-child(5n) {
            margin-right: 0;
        }

        /* ===== 卡片 ===== */
        .brand-card {
            cursor: pointer;
        }

        .brand-card .card-img {
            display: block;
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover; /* 统一裁切到2:3，不同尺寸的卡牌不会拉伸变形 */
            object-position: top; /* 卡牌优先保住顶部标题区 */
            background-color: #efefef;
            background-size: cover;
            background-position: center;
            transition: opacity 0.25s;
            margin-bottom: 20px;
        }

        .brand-card:hover .card-img {
            opacity: 0.8;
        }

        .brand-card .card-name {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.08px;
            text-align: center;
            color: #000;
        }

        /* 专栏名标题（.latest-title：原 VOGUE "LATEST IN" 标题，类名沿用；VOGUE h2: 32px） */
        .latest-title {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 0.08px;
            text-align: center;
            max-width: 1470px;
            margin: 0 auto 30px;
            padding: 60px 45px 0;
        }

        /* 艺术："××薄册"标题可点击，打开全屏名录（原浮动圆圈功能移至此处） */
        .latest-title.latest-title-tap {
            cursor: pointer;
        }

        .latest-title.latest-title-tap:hover {
            opacity: 0.55;
        }

        /* LATEST IN 分区：左侧品牌名录 + 右侧卡片 */
        .latest-flex {
            display: flex;
            align-items: flex-start;
            gap: 45px;
            max-width: 1470px;
            margin: 0 auto;
            padding: 0 45px;
        }

        .latest-flex .card-section {
            flex: 1;
            padding: 0;
            min-width: 0;
        }

        /* ===== 品牌名录 A-Z（VOGUE: 320px宽 #707070边框） ===== */
        .designer-directory {
            flex: none;
            width: 260px;
        }

        .directory-panel {
            display: flex;
            border: 1px solid #c0c0c0;
            background: #fff;
            font-family: "Avant Garde Gothic", Avantgarde, Futura, "Century Gothic", "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* 左侧：品牌列表（VOGUE: 一次显示21行=21×34px，隐藏滚动条） */
        .directory-list {
            flex: 1;
            min-width: 0;
            height: 759px; /* 20 + 21行×34 + 25(下边距，同VOGUE) */
            overflow-y: auto;
            padding: 20px 10px 25px 35px;
            scrollbar-width: none;
        }

        .directory-list::-webkit-scrollbar {
            display: none;
        }

        .directory-letter {
            font-size: 28px;
            font-weight: 500;
            margin: 20px 0;
        }

        .directory-letter:first-child {
            margin-top: 0;
        }

        .directory-letter span {
            border-bottom: 4px solid #000;
            padding-bottom: 2px;
        }

        .directory-list ul {
            list-style: none;
        }

        .directory-list li {
            font-size: 14px;
            font-weight: 400;
            line-height: 34px;
            height: 34px;
            max-width: 20ch; /* 长名截断为20个字符，同VOGUE */
            color: #000;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .directory-list li:hover {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* 流派分组名录（艺术栏目）：组名 + 英文/时期小注，无 A-Z 索引栏 */
        .directory-panel.group-mode .directory-list {
            padding: 20px 20px 25px 26px;
        }

        .directory-sub {
            font-size: 10px;
            letter-spacing: 2px;
            color: #8a8a8a;
            margin: 4px 0 8px 2px;
        }

        .directory-panel.group-mode .directory-list li {
            max-width: none;
        }

        /* 右侧：A-Z 字母索引栏 */
        .directory-rail {
            flex: none;
            width: 34px;
            padding: 20px 0 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* A-Z#均匀铺满整栏 */
            height: 759px;
        }

        .directory-rail button {
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 400;
            color: #000;
            cursor: pointer;
            padding: 2px 4px;
            line-height: 1.2;
        }

        /* 点选品牌后展示的单品牌卡片区 */
        .designer-view {
            max-width: 1470px;
            margin: 0 auto;
            padding: 30px 45px 0;
        }

        .designer-view .designer-name {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .designer-view .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 38px 1.25%;
        }

        .designer-view .brand-card {
            width: 19%;
            max-width: 280px;
        }

        /* ===== LATEST IN 已收录品牌卡：悬停品牌标题出现整行下划线，点击进入素材页 ===== */
        .brand-card.brand-link .card-name {
            cursor: pointer;
            position: relative;
            padding-bottom: 8px;
        }

        .brand-card.brand-link .card-name::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background-color: #000;
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.25s ease;
        }

        .brand-card.brand-link .card-name:hover::after {
            transform: scaleX(1);
        }

        /* ===== 品牌内页（点击 LATEST IN 卡片/名录进入，hash 路由整页切换） ===== */
        .brand-page {
            max-width: 1470px;
            margin: 0 auto;
            padding: 0 45px 60px;
        }

        .bp-back {
            display: inline-block;
            padding: 26px 0 6px;
            font-size: 13px;
            letter-spacing: 2px;
            color: #000;
            cursor: pointer;
        }

        .bp-back:hover {
            opacity: 0.55;
        }

        /* 画家内页文末：跳转 + 收录按钮行 */
        .bp-tailrow {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin: 26px 0 10px;
        }

        .bp-tailrow .bp-title-jump { margin: 0; }

        .bp-collect-btn {
            border: 1px solid #000;
            background-color: #fff;
            color: #000;
            font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            padding: 6px 16px;
            cursor: pointer;
        }

        .bp-collect-btn:hover { background-color: #000; color: #fff; }

        .bp-collect-btn.on { background-color: #000; color: #fff; }

        /* 绘画薄册 · 收录区 */
        .collect-title {
            font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 13px;
            letter-spacing: 3px;
            color: #8a8a8a;
            text-align: center;
            padding: 0 20px 4px;
        }

        .collect-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 30px;
            padding: 0 45px;
        }

        .collect-item {
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        .collect-item:hover { text-decoration: underline; text-underline-offset: 5px; }

        .collect-hint {
            font-size: 12px;
            letter-spacing: 1px;
            color: #9a9a9a;
        }

        .bp-title {
            font-size: 52px;
            font-weight: 500;
            letter-spacing: 4px;
            text-align: center;
            margin: 18px 0 34px;
        }

        /* 标题下跳转入口（Ann 等品牌：跳转功能收进标题处）——与收录按钮统一方框描边 */
        .bp-title-jump {
            display: inline-block;
            border: 1px solid #000;
            background-color: #fff;
            color: #000;
            font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            padding: 6px 16px;
            text-decoration: none;
            cursor: pointer;
        }

        .bp-title-jump:hover { background-color: #000; color: #fff; }

        .bp-tailrow .bp-title-jump { margin: 0; }

        .bp-label {
            text-align: center;
            margin-bottom: 50px;
        }

        .bp-label span {
            display: inline-block;
            border: 1px solid #000;
            padding: 16px 54px;
            font-size: 20px;
            letter-spacing: 12px;
            text-indent: 12px; /* 平衡末字字距，让文字在框内居中 */
        }

        /* ===== 卡位卡（跳转网站 / 叙事文章）：象牙纸面 + 内衬细框 + 首字暗纹 ===== */
        .asset-item.article-card .article-cover {
            width: 100%;
            aspect-ratio: 2 / 3;
            background:
                linear-gradient(155deg, #fdfcf9 0%, #f6f3ed 55%, #ece7dd 100%);
            color: #000;
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: zoom-in;
            transition: opacity 0.25s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }

        .asset-item.article-card:hover .article-cover {
            opacity: 0.92;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.12);
        }

        /* 内衬细框：离边一圈发丝线，做出装裱感 */
        .asset-item.article-card .article-cover::before {
            content: '';
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(0, 0, 0, 0.28);
            pointer-events: none;
        }

        /* 首字暗纹：标题首字放大沉在纸面里，近看才浮现 */
        .asset-item.article-card .article-cover::after {
            content: attr(data-wm);
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-family: Georgia, "Songti SC", SimSun, serif;
            font-size: 240px;
            line-height: 1;
            color: rgba(0, 0, 0, 0.055);
            pointer-events: none;
        }

        .asset-item.article-card .article-cover .ac-title {
            font-family: Georgia, "Songti SC", SimSun, serif;
            font-size: 24px;
            letter-spacing: 6px;
            writing-mode: vertical-rl;
            line-height: 1.7;
            max-height: 78%;
            position: relative;
            z-index: 1;
        }

        /* 全屏阅读层：整屏文章，可退出 */
        #article-overlay {
            position: fixed;
            inset: 0;
            background-color: #fff;
            z-index: 320;
            display: none;
        }

        #article-overlay.open { display: block; }

        #article-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background-color: #faf9f7;
        }

        .article-overlay-close {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 2;
            border: 1px solid #000;
            background-color: #fff;
            color: #000;
            font-size: 12px;
            letter-spacing: 2px;
            padding: 8px 16px;
            cursor: pointer;
        }

        .article-overlay-close:hover { background-color: #000; color: #fff; }

        /* ===== 素材页"获取指南"：肖像卡 + 跳转网站按钮 + 教程 ===== */
        .bp-guide {
            text-align: center;
            margin: 0 0 44px;
        }

        .bp-guide .guide-portrait {
            width: min(210px, 58vw);
            margin: 0 auto 18px;
        }

        .bp-guide .guide-portrait img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            object-position: top;
            display: block;
            background-color: #efefef;
            border: 1px solid #000;
        }

        .bp-guide .portrait-cap {
            font-size: 11px;
            letter-spacing: 1px;
            color: #8a8a8a;
            padding-top: 8px;
            text-align: left;
        }

        .bp-guide .portrait-fallback {
            width: 100%;
            aspect-ratio: 2 / 3;
            border: 1px solid #000;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            font-size: 15px;
            letter-spacing: 2px;
            color: #333;
        }

        .bp-guide .guide-jump {
            margin-bottom: 14px;
        }

        .bp-guide .guide-tip {
            font-size: 12px;
            line-height: 1.9;
            letter-spacing: 0.5px;
            color: #666;
            max-width: 520px;
            margin: 0 auto;
            text-align: left;
        }

        .bp-collected {
            font-size: 12px;
            letter-spacing: 2px;
            color: #8a8a8a;
            text-align: center;
            margin: 0 0 20px;
        }

        .brand-page .assets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            align-items: start;
        }

        .brand-page .assets-grid .asset-item {
            margin: 0 0 8px;
        }

        .brand-page .assets-grid .asset-item img {
            width: 100%;
        }

        /* 图墙第一行：秀场卡 / 设计师肖像 / 叙事文章卡 三等分横排 */
        .bp-firstrow {
            display: flex;
            gap: 16px;
            margin: 0 0 18px;
        }

        .bp-firstrow .asset-item {
            flex: 1;
            min-width: 0;
            margin: 0;
        }

        /* 意识形态卡牌：通栏展示，占满素材墙整行宽度 */
        .brand-page .asset-item.card-full {
            width: 100%;
            margin: 6px 0 18px;
        }

        /* ===== 叙事文章全文（内联，无滚动完整展开） ===== */
        .bp-inline-art {
            max-width: 720px;
            margin: 70px auto 0;
            padding: 0 24px 30px;
            border-top: 1px solid #000;
            font-family: Georgia, "Times New Roman", "Songti SC", SimSun, serif;
            color: #1a1a1a;
            line-height: 2.1;
        }

        .bp-inline-art .ia-kicker {
            text-align: center;
            font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 11px;
            letter-spacing: 6px;
            color: #8a8a8a;
            padding-top: 64px;
            margin-bottom: 26px;
        }

        .bp-inline-art h2 {
            text-align: center;
            font-weight: normal;
            font-size: 32px;
            letter-spacing: 4px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .bp-inline-art .ia-sub {
            text-align: center;
            font-size: 14px;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 36px;
        }

        .bp-inline-art .ia-rule {
            width: 46px;
            height: 1px;
            background-color: #000;
            margin: 0 auto 54px;
        }

        .bp-inline-art p {
            font-size: 16px;
            margin-bottom: 32px;
            text-align: justify;
        }

        .bp-inline-art .ia-dropcap::first-letter {
            float: left;
            font-size: 52px;
            line-height: 1;
            padding: 6px 10px 0 0;
        }

        .bp-inline-art em.hl {
            font-style: normal;
            border-bottom: 1px solid #b9b3a8;
        }

        .bp-inline-art figure { margin: 44px 0 52px; }

        .bp-inline-art figure img {
            width: 100%;
            display: block;
            background-color: #e8e5e0;
        }

        .bp-inline-art figure figcaption {
            font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #8a8a8a;
            padding-top: 10px;
            text-align: left;
        }

        .bp-inline-art .ia-quote {
            margin: 48px 0;
            text-align: center;
            font-size: 19px;
            letter-spacing: 2px;
            line-height: 2;
        }

        .bp-inline-art .ia-quote small {
            display: block;
            margin-top: 12px;
            font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: #8a8a8a;
        }

        .bp-inline-art .ia-colophon {
            margin-top: 56px;
            text-align: center;
            font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            color: #8a8a8a;
        }

        .brand-page .asset-item {
            break-inside: avoid;
            margin: 0 0 18px;
        }

        .brand-page .asset-item img {
            width: 100%;
            display: block;
            cursor: zoom-in;
            background-color: #efefef;
            transition: opacity 0.25s;
        }

        .brand-page .asset-item img:hover {
            opacity: 0.85;
        }

        .brand-page .asset-item figcaption {
            font-size: 12px;
            letter-spacing: 0.5px;
            color: #8a8a8a;
            padding: 8px 2px 0;
        }

        /* ===== 我的名录：卡片一~五（点击收录 LATEST IN 品牌与素材图） ===== */
        .my-card {
            position: relative;
        }

        .my-card-empty {
            width: 100%;
            aspect-ratio: 2 / 3;
            border: 1px dashed #b5b5b5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #9a9a9a;
            background-color: #fafafa;
            transition: border-color 0.2s, color 0.2s;
            margin-bottom: 20px;
        }

        .my-card:hover .my-card-empty {
            border-color: #000;
            color: #000;
        }

        .my-card-empty .plus {
            font-size: 36px;
            font-weight: 200;
            line-height: 1;
        }

        .my-card-empty .hint {
            font-size: 12px;
            letter-spacing: 2px;
        }

        .my-card-filled {
            width: 100%;
            aspect-ratio: 2 / 3;
            background-size: cover;
            background-position: top;
            background-color: #efefef;
            transition: opacity 0.25s;
            margin-bottom: 20px;
        }

                        <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
                        <h2>太阳是神</h2>
                        <div class="ia-sub">J. M. W. TURNER · 1775-1851 · 把世界画到融化的人</div>
                        <div class="ia-rule"></div>
                        <p class="ia-dropcap">1775 年，伦敦。约瑟夫·马洛德·威廉·透纳出生在柯文园一家理发店的楼上。父亲威廉给人刮脸修面，把儿子的铅笔涂鸦压在店堂的玻璃柜台下卖给客人——这个孩子一生没有受过一天正经的学校教育，字母表还没认全，就已经在给风景上色了。母亲玛丽的精神一年比一年坏，最终被送进 Bethlem 疯人院，那个年代叫"疯人塔"。家里再没人谈论她。透纳后来一辈子对母亲只字不提，连一句回忆都没有留下。</p>
                        <p>一个在理发店里长大、在疯人院阴影下沉默的孩子，学会了把一切情绪都锁进画里。他十四岁进皇家美术学院，十五岁第一次展出，二十六岁成为院士——史上最年轻。他没有朋友式的师承，只有一句早期的自我命令：画画，不停地画。他的一生画了三百多幅油画、近三万张速写和水彩。别人的传记写爱情与战争，他的传记只能写产量。</p>
                        <figure><img src="夜建素材库-2026-11-05/23a-turner-素材/self-portrait.jpg" alt="透纳自画像"><figcaption>自画像 · SELF PORTRAIT · c.1799 · 泰特不列颠藏</figcaption></figure>
                        <p>他一年里有半年在路上。邮车、驿站、漕船，英国、法国、瑞士、意大利——他随身带着一个手卷速写本，站在悬崖上、趴在船板上、吊在马车顶上记天气。他看画的方式和所有人相反：别人看形，他看风从哪个方向来，光在几分几秒里改变了一整片海。评论后来说他的画是"肥皂沫和石灰水"，骂他疯了。他听完只是把帽子往下压了压，继续画。他比时代快了五十年——那些被骂融掉的画，就是一百多年后印象派睁眼看见的第一个世界。</p>
                        <figure><img src="夜建素材库-2026-11-05/23a-turner-素材/snow-storm.jpg" alt="暴风雪"><figcaption>《暴风雪——驶离港口的汽船》1842 · 泰特不列颠藏</figcaption></figure>
                        <p>1842 年，六十七岁的他让水手把自己绑上"精灵号"的桅杆，为的是亲眼看一场暴风雪如何吞掉一艘蒸汽船。四小时后他下来，说的是那句著名的话：画家应该"亲身经历过"才能画。传说未必句句属实，但把他绑在桅杆上的那股劲儿是真的——<em class="hl">他要的不是画风暴，他要求和风暴平等地站在一起。</em>这大概可以追溯到那个孩子从未被允许表达的愤怒：母亲、疯人塔、沉默的家。他把一切没有说出口的东西，全部兑换成了大自然的暴力。</p>
                        <p>他名利双收，却活得像个怪人。晚年化名"布斯海军上将"，躲在切尔西一位船寡妇的家里，两间临河的屋子，天不亮就出门看日出。他抠门、粗鲁、在画展上恶意抬高自己的售价跟同行斗气；他又匿名资助落魄艺术家，死时把全部作品遗赠给国家，一分不取。他终身未娶，两个女儿是私生女，知己只有父亲——老威廉给他当了五十年的颜料研磨工、画框木匠兼经纪人，1809 年父亲去世后，据说透纳在画室里站着哭到晕倒。这是他一生唯一一次在人前崩溃。</p>
                        <figure><img src="夜建素材库-2026-11-05/23a-turner-素材/fighting-temeraire.jpg" alt="被拖去解体的无畏号"><figcaption>《被拖去解体的无畏号战舰》1839 · 国家美术馆藏</figcaption></figure>
                        <p>所以看懂他的画，要先看懂他的时间感。<em class="hl">他画的从来不是风景，是消逝。</em>《无畏号》里那艘打赢过特拉法尔加的英雄战舰，被一艘冒着黑烟的小拖船拖着去拆解——幽灵一样的白色船体，落日和月亮同时挂在天空，一整个木制海军时代在为蒸汽时代让路。他站在岸边看着，什么都没说，画了下来。《奴隶船》更狠：1840 年他读到"泽荣号"的旧案——船东为了骗保险金，把一百三十多个生病奴隶抛进海里——他就把这份罪扔进翻卷的红色海浪里，让溺亡的手在浪沫里最后抓一下阳光。</p>
                        <div class="ia-quote">The sun is God.<small>—— 透纳临终遗言 · "太阳是神"</small></div>
                        <p>1851 年 12 月，七十六岁，他在切尔西的小屋里咽气，最后说的是：太阳是神。他没有信徒、没有婚礼、没有学校，只有一个理发店父亲、一座疯人院里的母亲和三万张对光线的记录。今天你站在他的画前觉得"什么都没看清"——那就对了，他要的就是你没看清：<em class="hl">世界在光里融化的时候，人和船、帝国和战舰，一起化掉。</em></p>
                        <div class="ia-colophon">J. M. W. TURNER · 1775-1851 · LONDON</div>
                    `

                    html: `
                        <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
                        <h2>金子的两种来历</h2>
                        <div class="ia-sub">GUSTAV KLIMT · 1862-1918 · 帝国黄昏里最镀金的人</div>
                        <div class="ia-rule"></div>
                        <p class="ia-dropcap">1862 年，维也纳郊外的鲍姆加登，一个金匠雕版工家里生了七个孩子，古斯塔夫·克林姆特排行第二。父亲恩斯特·克林姆特是个穷金雕匠，一辈子在铜版上刻出细密的纹样，给别人的项链、圣器和勋章做花饰。家里挤、钱少、味道是刻刀和金粉的。克林姆特的童年没有风景，只有图案——那种一毫米一毫米抠出来的、永不厌倦繁复的装饰性。后来全世界惊叹他画里的金子从哪儿来，答案其实早就放在工坊里：<em class="hl">那是父亲的职业，长在了他的手上。</em></p>
                        <p>十四岁他考进维也纳艺术工商学校，凭奖金读书，弟弟恩斯特也跟着进来。兄弟俩加上同学马奇，接活儿画剧院天顶，画得又快又漂亮——1888 年，二十六岁的克林姆特因为布达佩斯剧院和城堡剧院的天顶画，从皇帝弗兰茨·约瑟夫手里领了金质勋章。帝国把他当自己人：体面的、镶金的、遵纪守法的宫廷画师。那几年的画有多规矩，后来的画就有多放肆。</p>
                        <figure><img src="夜建素材库-2026-11-05/36a-klimt-素材/portrait.jpg" alt="克林姆特在画室"><figcaption>克林姆特在画室抱着爱猫 · 莫里兹·内尔摄 · c.1914</figcaption></figure>
                        <p>1892 年，命运同时收走两个男人：七月父亲中风去世，十二月弟弟恩斯特死于阑尾炎后腹膜炎——三十岁不到。克林姆特从崩溃里走出来时，那个领勋章的宫廷画师已经死了。<em class="hl">此后他不再接任何官方壁画，不再隶属任何学院，也不再解释自己的画。</em>他没有写日记，没有留下理论，别人问画是什么意思，他的回答后来刻在维也纳的墙上："谁想了解我，就去研究我的画——去看，去尝试理解我画了什么、我想做什么。"</p>
                        <p>他很快找到了让他永远沉默的那个战场。1894 年，大学委托他为天顶画三幅寓言：《哲学》《医学》《法学》。他画了七年，交出来的东西让整个帝国炸了锅——87 位教授联名抗议，报纸骂他"色情"、"癫狂"，国会议员要求彻查，教育部最终拒绝挂出这三幅画。克林姆特要回了定金，头也不回。这场"大学天花板之战"是他性格成型的关键一战：<em class="hl">从此他只为自己作画，只为愿意直视的人作画。</em>1897 年他牵头成立"维也纳分离派"，把口号写进门楣——为时代以它的艺术，为艺术以它的自由。</p>
                        <p>为时代以它的艺术——但维也纳的时代是什么？是弗洛伊德开始解剖梦的城市，是一个外表镀金、内里溃烂的帝国。克林姆特把这一切看在眼里，画出来的全是同一个主题的两面：<em class="hl">色情与死亡，拥抱与吞噬。</em>《死亡与生命》里，骷髅抱着整整一塔人堆——婴儿、少女、老妇、壮汉，人类堆在一起笑着取暖，而死亡就贴在旁边等。这不是病态趣味，这是他半生看下来的真相：帝国的金冠之下，所有人都在排队走向同一个骷髅。</p>
                        <figure><img src="夜建素材库-2026-11-05/36a-klimt-素材/death-and-life.jpg" alt="死亡与生命"><figcaption>《死亡与生命》1910-1915 · 利奥波德博物馆藏（维也纳）</figcaption></figure>
                        <p>1903 年他去了一次意大利，在拉文纳的圣维塔莱教堂，站在拜占庭的黄金马赛克前挪不动步。1400 年前的工匠用一平方厘米几十块金箔玻璃，拼出让人必须仰头的光。他回来就造了工具——墙上绷一层金色，像父亲当年那样一层层描。父亲的雕金刀、拉文纳的马赛克，在他手里合流。1907 到 1908 年，"黄金时期"的两座高峰先后立起：阿黛尔的肖像，《吻》。</p>
                        <figure><img src="夜建素材库-2026-11-05/36a-klimt-素材/the-kiss.jpg" alt="吻"><figcaption>《吻》1907-1908 · 美景宫藏（维也纳）</figcaption></figure>
                        <p>《吻》是全维也纳都在偷偷议论的画：一对跪在悬崖花毯上的恋人，男子的金色长袍布满黑白直线，女子的裙上是圆形花——几何的硬和花朵的软，被同一片金箔焊在一起，脚下就是深渊。帝国骂了他半辈子伤风败俗，最后国家美术馆抢着把这幅画买了下来。而他本人穿着及膝的蓝灰长袍（里面从来不穿内裤，只穿这件画袍过日子），在画室里养猫，一天到晚不出去，只是埋头画。他从不缺女伴——每个夏天带着时装设计师艾米莉·弗洛格一家人去阿特湖避暑，湖边画风景，画里没有一个人，只有水、树和光，安静得不像同一个人画的。</p>
                        <figure><img src="夜建素材库-2026-11-05/36a-klimt-素材/schloss-kammer-attersee.jpg" alt="阿特湖畔的卡默尔城堡"><figcaption>《阿特湖畔的卡默尔城堡 III》1910 · 美景宫藏（维也纳）</figcaption></figure>
                        <div class="ia-quote">谁想了解我，就去研究我的画。<small>—— 克林姆特 · 他一生拒绝解释</small></div>
                        <p>1918 年 1 月，五十五岁，中风。流感跟着来，半个月后他在维也纳病逝，临终最后一句话是喊人去把艾米莉接来。帝国在当年冬天跟着他散了架——他画的正是它的黄昏。你要问他的金子为什么这样浓，答案有三层：<em class="hl">父亲的手艺给他工具，拉文纳给他眼光，而一个不敢直视的时代的伪善，给了他必须用金子遮住、又必须让人看见的东西。</em></p>
                        <div class="ia-colophon">GUSTAV KLIMT · 1862-1918 · VIENNA</div>
                    `

                        <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
                        <h2>推开镜面阶梯的门</h2>
                        <div class="ia-sub">CHANEL · 康朋街 31 号 · 一种自由的诞生</div>
                        <div class="ia-rule"></div>
                        <p class="ia-dropcap">推开镜面阶梯的门。</p>
                        <p>康朋街 31 号，一条被十七面镜子折叠的楼梯。1971 年 1 月 10 日之前，每一场高级定制秀的下午，加布里埃·香奈儿都坐在这道梯子的顶端——不谢幕、不露面，只从镜子的夹缝里往下看，看女人们穿着她的衣服走上楼梯，走进光里。</p>
                        <figure><img src="品牌素材/chanel/runway-space-grand-palais-rocket.jpg" alt="巴黎大皇宫 · 火箭秀场"><figcaption>2017 秋冬 · 巴黎大皇宫 · 巨型火箭升空 33 英尺——把秀场做成发射台的品牌，几十年前就把女装做成了发射协议</figcaption></figure>
                        <p>再往上追六十年。1910 年，多维尔的海边，她把马裤和水手衫从情人的衣柜里剪下来，穿在自己身上。那个年代的女人被束进鲸骨胸衣，而她用男装针织面料做帽子和外套——<em class="hl">面料是拿来运动的，不是拿来受刑的。</em>1916 年，《时尚季刊》写她"把针织衫做成了女装"，军队供应商的库存从此变成了整个二十世纪的外套。</p>
                        <figure><img src="品牌素材/chanel/founder-coco-chanel.jpg" alt="可可·香奈儿肖像"><figcaption>加布里埃·香奈儿 Gabrielle "Coco" Chanel · 康朋街的镜梯顶端</figcaption></figure>
                        <p>黑与白，是她最先立下的规矩。1926 年，美国版《Vogue》把那件及膝的黑色连衣裙叫作"Ford 式的 Chanel"——像 T 型车一样，属于所有女人。1921 年，恩尼斯·鲍调出的第五号香水样品里，乙醛第一次炸开成一整束不存在的花。瓶身方方正正，标签白纸黑字，盖子像威士忌酒瓶——她要的不是香水，是一个拒绝解释的句子。</p>
                        <figure><img src="品牌素材/chanel/campaign-no5-nicole-kidman.jpg" alt="N°5 The Film · Nicole Kidman"><figcaption>N°5《The Film》2004 · Baz Luhrmann 导演 · Nicole Kidman 主演 · 180 秒</figcaption></figure>
                        <p>而她真正站进去的圈子，在 1924 年的香榭丽舍剧院。佳吉列夫的俄罗斯芭蕾团首演《蓝色列车》：科克托写的剧本，毕加索画的布景，幕布上放大的白色网球拍有两层楼高。台上的泳装、高尔夫套装、针织浴袍——全是香奈儿做的。她让女舞者穿着她的运动服跑过毕加索的沙滩，把"运动"这个词缝进了高级时装的身体里。后台站着米西亚和整个巴黎：画家、作曲家、诗人——她不和买手吃饭，她和他们喝酒。</p>
                        <div class="ia-quote">山茶花没有香气，所以不会打扰身上的香水。<small>—— 她挑花只挑到这个地步</small></div>
                        <p>珍珠一串不够就戴四串，假的比真的更理直气壮。粗花呢是苏格兰的炉边织物，她把它裁成连衣裙，让铁灰色在灯光下起毛。</p>
                        <p>1954 年，七十一岁，巴黎刚打完仗不想看见她。她带着那套斜纹软呢套装回到康朋街——裙摆长到膝盖下一掌宽，口袋翻在外面，链子缝进下摆坠住衣角。评论说这是旧时代，买它们的女人们不说话，穿了几十年。</p>
                        <figure><img src="品牌素材/chanel/runway-space-grand-palais-rocket-2.jpg" alt="巴黎大皇宫 · 火箭秀场"><figcaption>巴黎大皇宫 Grand Palais · 玻璃穹顶下的 Chanel 宇宙</figcaption></figure>
                        <p>有些黑色不需要理由。你只需要记住一个词，去搜它：<em class="hl">N°5, 1921</em>——那束不存在的花，现在还开在每一个专柜的转角。</p>
                        <div class="ia-colophon">CHANEL · PARIS · 31 RUE CAMBON</div>
                    `

    <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
    <h2>花园的反叛</h2>
    <div class="ia-sub">CHRISTIAN DIOR · 1905-1957 · 蒙田大道 30 号的一扇门，通向 Granville 的童年花园</div>
    <div class="ia-rule"></div>
    <div class="article">
        <p class="ia-dropcap">你推开的是蒙田大道 30 号（30 Avenue Montaigne）的一扇门。1946 年，克里斯汀·迪奥在这栋私人宅邸里挂出自己的名字；门后没有花园，只有沙龙、镜子和待发的裙撑。但你要知道，这扇门真正的钥匙插在六百公里外：诺曼底海崖上的 Granville，一座名叫 Les Rhumbs 的别墅，童年的迪奥在里面有一整片自己的花园——他后来在回忆录里写，那是他一生"最温柔也最模糊的记忆的来源"。花园里花按季节精确地排列，像一场永不散场的秀。</p>
        <p>所以你该明白，为什么 Dior 的秀年复一年办在罗丹博物馆（Musée Rodin）。不是因为那座《思想者》出名，而是因为罗丹博物馆有一座巴黎市中心罕见的法式大花园——玫瑰、黄杨、碎石小径，被雕塑与宅邸围合起来。<em class="hl">Dior 需要的从来不是一个"场地"，而是一座可以走秀的花园。</em>2017 年春夏高定，Maria Grazia Chiuri 的首秀把整座博物馆变成一座"忘忧园"（jardin de curé），坡地、绿丘与蓝紫色花海从展厅漫出来；2012 年 7 月 Raf Simons 的首季高定，干脆用一整面墙又一整面墙的鲜花把 salon 封起来——在墙里再造一座墙内花园。别的品牌在修道院里寻找苦修，Dior 在花园里寻找绽放。1947 年那个被战争灰色闷了十年的巴黎，需要的正是这个：Carmel Snow 在 1947 年 2 月 12 日的 Corolle 首秀上喊出的那句话——"It's quite a revolution, dear Christian! Your dresses have such a new look!"——所谓 New Look，本质上是一座被围困十年后突然打开的花园。</p>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/dior/venue-rodin-01.jpg" alt="罗丹博物馆布景"><figcaption>Musée Rodin · Dior 高定秀场布景 · 巴黎（designboom 报道图）</figcaption></figure>
        <p>你往花园深处走，会遇到一个女人。米萨·布里卡尔（Mitzah Bricard），迪奥一生最重要的缪斯，绰号来自她习惯用的问候语"mitzah"。她是战争年代巴黎沙龙里的传奇：翎羽帽檐、金链手镯层层叠叠、一头精心做旧的红发——迪奥形容她是"巴洛克风格本身"。而她留给这个品牌最著名的一笔，是<em class="hl">豹纹</em>。是她说服迪奥把豹纹从猎场搬进高定，让这种野性的图案成为 Dior 的签名之一；后来品牌干脆设立了以她命名监督的豹纹部门，她就是那个部门的灵魂。她说过一句被反复引用的话："我给迪奥的东西，是风格。"（Ce que j'apporte à Dior, c'est le style.）</p>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/dior/portrait-muse-mitzah-02.jpg" alt="Mitzah Bricard 肖像"><figcaption>Mitzah Bricard · Dior 缪斯与豹纹风格的塑造者</figcaption></figure>
        <p>1957 年秋天，迪奥在意大利疗养地 Montecatini 猝然离世。身边守着他的是最亲近的几位——Mitzah 也在。他临终前的日子还在谈工作、谈下一季的草图，而设计师的位置很快落到了他的年轻助手 Yves Saint Laurent 身上。这段告别没有留下戏剧性的画面，但你可以在更早的一张照片里看见他们的关系：迪奥在工作室俯身改一件裙装，Mitzah 在旁边，帽檐压低，像一件行走的巴洛克家具——他一生的审美，有相当一部分就站在那里。</p>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/dior/portrait-founder-01.jpg" alt="Christian Dior 肖像"><figcaption>Christian Dior · 1950 年代 · 工作室时期</figcaption></figure>
        <p>还有一个人替他把花园推向了英语世界。玛格丽特公主（Princess Margaret）是 Dior 在英国最显赫的信徒：她公开宣称 Christian Dior 的衣服是她"梦寐以求的一切"，1950 年代她穿着 Dior 出现在公开场合与 Cecil Beaton 的镜头里，一张张照片被英文报纸传开——战时配给制下的英国本就对"挥霍布料"的 New Look 心怀抵触，是这位公主的Selection让偏见让路。可以说，<em class="hl">New Look 征服法语世界靠的是巴黎，征服英语世界靠的是玛格丽特。</em></p>
        <p>回到广告片。Dior 的 campaign 有一个稳定的母题：花园与建筑的光。2021 年春夏大片在光线里拍裙装的柔软垂坠，2024 年春夏大片把人物放回庭院与温室般的绿意里，2016 年秋冬大片则用更冷、更建筑感的硬光切割剪影——三张片子隔着八年，却共用同一种语法：女人不站在风景前，女人本身就是花园里的另一株植物，光从建筑的高窗或树冠的缝隙垂直落下来，像对待一件雕塑。你不必记住摄影师的名字，你只需要记住这个画面：石材、绿意、一束有方向的光，和一条在光里被"栽种"的裙子。</p>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/dior/campaign-01.jpg" alt="Dior Spring 2024 广告大片"><figcaption>Dior Spring 2024 Campaign · 花园与建筑感光线母题</figcaption></figure>
        <p>夜深了，你从蒙田大道 30 号退出来。六百公里外的 Granville，那座叫 Les Rhumbs 的别墅花园还立在诺曼底的海风里，如今是博物馆；蒙田大道上的沙龙灯还亮着；罗丹博物馆的玫瑰在下一季高定前安静生长。七十多年过去，Dior 做的仍然是同一件事——<em class="hl">把一个孩子的花园，一寸一寸地，搬进女人的衣橱。</em>有些美不需要解释。它只需要一扇门，和推开门之后，扑面而来的花香。</p>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/dior/runway-ss2017couture-01.jpg" alt="SS2017 高定花园秀"><figcaption>Dior SS2017 Haute Couture · Maria Grazia Chiuri 首季"花园秀" · Musée Rodin</figcaption></figure>
    </div>

    <div class="archive">
        <div class="block">
            <div class="block-label">01 · RUNWAY ARCHIVE · 秀场档案</div>

    <div class="ia-kicker">品牌意识形态解码 · 叙事层</div>
    <h2>把世界装进硬箱</h2>
    <div class="ia-sub">LOUIS VUITTON · 1821-1892 · 出发是一种信仰</div>
    <div class="ia-rule"></div>
    <div class="article">
        <p class="ia-dropcap">推开一扇沉重的门，你先听见的不是音乐，是汽笛。月台上停着一列老式蒸汽列车，白雾漫过铁轨，暖金色的逆光把整节车厢镀成蜂蜜的颜色。你脚边摞着几只硬箱：棕褐底色上，星形花、四瓣花、菱形与字母 LV 交织成密不透风的图案，黄铜锁扣被磨得发亮。搬运工的手套、烫金的姓名缩写、叠得一丝不苟的衣物——在这里，<em class="hl">行李不是负担，行李是仪式</em>。你忽然明白：这不是在等一列车，这是在等一次出发本身。</p>
        <p>这正是路易威登一次次把秀场变成的东西。巴黎是它天然的大舞台：女装大秀长年落座卢浮宫的方形庭院（Cour Carrée），夜幕降下，玻璃金字塔与古典立面之间架起 T 台，水晶吊灯成排悬在观众头顶——把巴黎最庄重的建筑变成一只打开的首饰盒。2023 年 6 月，Pharrell Williams 的男装首秀干脆搬上塞纳河上的新桥（Pont Neuf），整座桥被围成 T 台，金棕色的 Damier 格纹装置沿河铺开，模特从桥的这头走向那头，像一段可以直接走上去的旅程。再往前，Virgil Abloh 在 2018 年的男装秀把皇家宫殿花园铺成《绿野仙踪》的黄砖路——品牌的秀场语言始终是同一件事：<em class="hl">在现实的城市里，搭建一段虚构的旅行</em>。因为只有出发，才能证明箱子有用。</p>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/louis-vuitton/venue-01.jpg" alt="卢浮宫与吊灯下的秀场"><figcaption>RUNWAY · 夜色中的卢浮宫（左）与吊灯下的庭院秀场（右）· 女装系列</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/louis-vuitton/venue-02.jpg" alt="大理石列柱间的 T 台"><figcaption>RUNWAY · 列柱长廊间的 T 台 · 女装大秀现场</figcaption></figure>
        <p>这个关于旅行的信仰，有一个非常具体的起点。1821 年出生在法国汝拉山区木匠之家的路易·威登，十四岁徒步两百多英里走到巴黎，靠给贵族整理行李谋生——他手艺太好，成了欧仁妮皇后（拿破仑三世之妻）的御用打包师，学会了对付一只只塞满裙撑与礼服的旅行箱。1854 年他在巴黎开店，1858 年推出平顶行李箱：在所有人都做圆顶箱的年代，平顶意味着可以叠放、可以码成一堵墙。1888 年他推出米棕相间的棋盘格 Damier 图案，箱面上印着" marque L. Vuitton déposée"（注册商标）——防伪意识比时尚行业本身还早。1892 年老威登去世，儿子乔治接手，1896 年把父亲姓名的缩写与日式家纹式的花卉融成 Monogram 图案：既是纪念，也是一道再也无法被模仿的签名。此后一个多世纪，这个图案不断被艺术家"重新签名"——2001 年 Stephen Sprouse 在箱面上喷满荧光涂鸦，2003 年村上隆让 Monogram 变成三十三种颜色的糖果色，草间弥生的波点则在 2012 年与 2023 年两度爬上硬箱、爬上高跟鞋，甚至爬上纽约的自由女神像。</p>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/louis-vuitton/portrait-founder-01.jpg" alt="创始人路易·威登肖像"><figcaption>CULTURAL ORIGIN · 创始人路易·威登肖像（版画）· 19 世纪</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/louis-vuitton/muse-03.jpg" alt="覆盖波点的自由女神像"><figcaption>CULTURAL ORIGIN · 覆盖草间弥生波点的自由女神像 · 2023 年合作系列视觉</figcaption></figure>
        <p>而在广告里，这个品牌始终在拍同一样东西：<em class="hl">出发前后那一秒的光</em>。蒸汽列车旁，米色西装的男人坐在摞起的硬箱上，白雾漫过画面，暖调逆光让整个月台像一段旧记忆；手绘的湖光山色作为布景立在模特身后，布景边缘故意露出来——广告坦白告诉你这是假的远方，正如秀场坦白告诉你黄砖路是画的。这批 campaign 的手法可以归纳成一个母题：复古交通场站或人工布景做背景，均匀柔和的暖调光，画面干净得像舞台剧剧照——旅行在这里不是纪录，是一出关于旅行的戏。</p>

        <p>所以当你下次在街角看见一只 Monogram，不妨把它看成一枚小小的站台纪念章：一个十四岁的徒步少年、一位皇后的衣柜、一只可以叠成墙的平顶箱、一场桥上的首秀，都被烫印在那几厘米的图案里。有些美不需要解释——<em class="hl">你只需要记得，它从诞生那天起，就在为"出发"这件事守灵。</em></p>

        <p class="ia-dropcap">你推开那扇门，先闻到的不是香水，是皮革。鞍蜡、鞣酸、亚麻线，混着一点点木头屑的味道——1837 年，蒂埃里·爱马仕（Thierry Hermès）在巴黎开的就是这样一间马具作坊：几张工作台，一排缝针，和一群为马服务的匠人。那时马车是这座城市的心跳，马掌敲在石板路上，就是巴黎的节拍器。一百多年过去，汽车把马从街道上赶走，可这间作坊没有跟着改行去追赶什么，它只是把"伺候一匹马"的耐心，原封不动地转到了人的身上。<em class="hl">爱马仕卖的从来不是包，是那种一针一线都不肯敷衍的时间。</em></p>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/hermes/portrait-founder-01.jpg" alt="Thierry Hermès 肖像"><figcaption>文化溯源 · CULTURAL ORIGIN — 创始人 Thierry Hermès（1801-1878）肖像，1837 年于巴黎创立马具作坊</figcaption></figure>
        <p>理解这一点，才能理解爱马仕的秀场为什么总是那么克制。别的品牌用秀场造梦，爱马仕用秀场做工坊的延伸：舞台极简、灯光干净、模特像从日常生活里直接走出来，只是每个细节都严丝合缝。马术世界的规矩烙在这里——鞍具差一毫米，马背就会磨破，所以<em class="hl">完美主义在这里不是美学偏好，是职业伦理</em>。你去看近几年的秀：2026 春夏系列（Nadège Vanhee-Cybulski 任创意总监）把 T 台铺成一片浅色沙地，模特踩在细沙上走过，白与沙色像正午的日光落在马场边缘；不喧哗，不讲故事，只把"工艺对得起目光"这件事重复一遍又一遍。</p>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/hermes/runway-2026-ss-RTW-01.jpg" alt="Hermès Spring 2026 RTW"><figcaption>秀场档案 · RUNWAY — Hermès Spring 2026 RTW · 浅沙色 T 台，创意总监 Nadège Vanhee-Cybulski</figcaption></figure>
        <p>这个家族的历史，是几代人接力回答同一个问题的历史。1837 年，Thierry Hermès 靠一副副马具赢得口碑，为贵族定做马鞍与挽具；第三代传人 Émile-Maurice Hermès 是个不安分的人——20 世纪 20 年代，他千里迢迢从美国引进拉链并在法国申请了独家专利，被当时的皮匠同行讥笑，也由此打开了皮具的新纪元。他为妻子设计的那款手提包，1956 年因摩纳哥王妃格蕾丝·凯利（Grace Kelly）用它在《生活》杂志的镜头前挡住怀孕的小腹而登上封面，从此改名"凯莉包"——一只包因为一个下意识的动作被写进时尚史。</p>
        <p>而另一只包的诞生更具画面感：1984 年，音乐人 Jane Birkin 与时任总裁让-路易·杜马（Jean-Louis Dumas）在一段航程中同机而坐，她的藤篮翻洒在地，东西掉了一地，她抱怨说找不到一只既优雅又能塞进日常生活的包；杜马顺手在呕吐袋的纸上画下了草图。Birkin 包就这样诞生于一场机舱偶遇——不是实验室里的产品企划，而是<em class="hl">一次真实的、狼狈的日常瞬间</em>。至于那条让品牌染上色彩的方巾：1937 年，爱马仕印出第一条真丝方巾《公共马车》（Jeu des Omnibus），90 厘米见方，从此" carré "成为一种可以系在颈间的画布。</p>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/hermes/muse-work-01.jpg" alt="Hermès 真丝方巾图案"><figcaption>丝巾档案 · CARRÉ — 真丝方巾图案 · 1937 年首条方巾《公共马车》开启的传统</figcaption></figure>
        <p>打开爱马仕的广告大片，你几乎找不到说服你的表情。它的母题一贯安静：橙色的盒子与丝巾在自然光里摊开，皮革静物像博物馆展柜里的出土文物，巴黎的屋顶与花园做背景，模特常常不看镜头，仿佛摄影师恰好路过。没有高闪光的戏剧性，没有后期催出来的强对比——它用的手法就是它的信条：<em class="hl">让光和材质自己说话</em>。这不是营销文案的克制，是马具作坊传下来的老规矩：好东西不需要吆喝。</p>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/hermes/campaign-01.jpg" alt="Hermès 丝巾广告"><figcaption>广告档案 · CAMPAIGN — 丝巾与品牌招牌 · 自然光、橙色系、构图留白</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/hermes/campaign-02.jpg" alt="Hermès cordes et soie 广告"><figcaption>广告档案 · CAMPAIGN — 丝巾主题大片「cordes et soie」· 风帆与绳索之间的天空</figcaption></figure>
        <figure><img src="夜建素材库-2026-11-05/品牌素材/hermes/campaign-03.jpg" alt="Hermès 黑白广告"><figcaption>广告档案 · CAMPAIGN — 黑白巴黎屋顶间的丝巾 · 高对比静与暖橙撕裂式拼贴</figcaption></figure>
        <p>你要离开的时候，回头看一眼那个橙色的盒子。马早就从巴黎的街道上消失了，可它的节奏还在：在每一针马鞍针法里，在每一方丝巾的滚边里，在每一次你等一个包等到数月的耐心里。爱马仕教会人的不是消费，是一种对待时间的方式——<em class="hl">慢到每一步都算数，快的事留给别人去做。</em>马蹄声远了，但它敲出来的节拍，这个品牌至今没有乱过一步。</p>

            'Rick Owens': {
                type: 'brand',
                vogueSlug: 'rick-owens',
                folder: 'rick-owens-卡牌素材',
                cover: 'RICK-OWENS-卡牌.png',
                cardImage: 'rick-portrait.jpg', // LATEST IN 小卡展示图（缺省用封面）
                titleJump: true, // 跳转功能收进标题处，不再占用素材墙卡位
                guide: {
                    site: 'VOGUE 秀场',
                    url: 'https://www.vogue.com.cn/shows/rick-owens/',
                    tip: '获取素材：点上方"跳转网站"进入 VOGUE 时尚网的 Rick Owens 秀场品牌页，浏览历季时装发布秀高清图。'
                },
                site: 'https://www.rickowens.eu/',
                images: [
                    ['rick-portrait.jpg', 'RICK OWENS · 设计师肖像'],
                    ['michele-lamy-jpeg.jpg', 'MICHÈLE LAMY · 妻子与缪斯'],
                    ['runway-ss24-1.jpg', 'SS24 LIDO 大秀 · 巴黎东京宫'],
                    ['runway-ss24-2.jpg', 'SS24 LIDO 大秀 · 巴黎东京宫'],
                    ['runway-ss24-3.jpg', 'SS24 LIDO 大秀 · 巴黎东京宫'],
                    ['runway-ss24-4.jpg', 'SS24 LIDO 大秀 · 巴黎东京宫'],
                    ['runway-ss24-5.jpg', 'SS24 LIDO 大秀 · 巴黎东京宫'],
                    ['runway-ss24-6.jpg', 'SS24 LIDO 大秀 · 巴黎东京宫'],
                    ['runway-fw25.jpg', 'FW25 雾中秀场'],
                    ['runway-ss26.jpg', 'SS26 秀场'],
                    ['backstage-ss26.jpg', 'SS26 后台肖像'],
                    ['moncler-campaign-1.jpg', 'MONCLER × RICK OWENS SS26 大片'],
                    ['moncler-campaign-2.jpg', 'MONCLER × RICK OWENS SS26 大片'],
                    ['brutalist-ladefense.jpg', '粗野主义建筑 · 巴黎拉德芳斯']
                ]
            }
        };

        // 卡片图片路径：已收录品牌 → 素材文件夹展示图（cardImage 优先，缺省用卡牌封面）；其余 → images/<栏目>/<子页名>/<卡片名>.png
        function cardImagePath(category, subpage, cardName) {
            const asset = BRAND_ASSETS[cardName];
            if (asset) {
                if (asset.remoteCover) return asset.remoteCover; // 无本地素材时用网络肖像图
                return `${asset.folder}/${asset.cardImage || asset.cover}`;
            }
            return `images/${category}/${subpage}/${cardName}.png`;
        }

        // ===== 我的名录：卡片一~五（按栏目隔离：品牌收品牌、城史收城史） =====
        // 按栏目分库存：brand 与 city 各自独立收录
        function myCardsKey(type) { return 'ideology-my-cards-' + type; }

        function loadMyCards(type) {
            try {
                const v = JSON.parse(localStorage.getItem(myCardsKey(type)));
                if (Array.isArray(v)) return v;
            } catch (e) {}
            return [null, null, null, null, null];
        }

        function saveMyCards(cards, type) {
            try { localStorage.setItem(myCardsKey(type), JSON.stringify(cards)); } catch (e) {}
        }

        function renderMyCards(grid, type) {
            grid.innerHTML = '';
            if (type === 'city') { renderCityCards(grid); return; }
            const cards = loadMyCards(type);
            for (let i = 0; i < 5; i++) {
                grid.appendChild(createMyCard(i, cards[i], type));
            }
        }

        // 城史名录行：首位 = 当前城市（自动跟随右上角选择），后四位空白
        // 我的城市神祇：邯郸卡打头（不动）+ 雪/月/日/星/风/云/山/水/城 九意象首图
        function renderLightCards(grid) {
            grid.innerHTML = '';
            grid.appendChild(createCard('city', 'latest', 'Handan 邯郸'));
            const imagery = ['山水', '四季', '城史'];
            imagery.forEach(n => {
                const sp = SITE_DATA.city.subpages.find(x => x.name === n);
                const first = sp ? sp.cards[0] : null;
                const dataUrl = first ? loadArtImage(first) : null;
                const card = document.createElement('div');
                card.className = 'brand-card';
                if (dataUrl) {
                    const frame = document.createElement('div');
                    frame.className = 'my-card-filled art-frame';
                    applyArtFrame(frame, first, dataUrl);
                    card.appendChild(frame);
                } else {
                    const empty = document.createElement('div');
                    empty.className = 'my-card-empty';
                    empty.innerHTML = '<div class="plus"></div><div class="hint">' + n + '</div>';
                    card.appendChild(empty);
                }
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = n;
                card.appendChild(name);
                grid.appendChild(card);
            });
        }

        function renderCityCards(grid) {
            let saved = null;
            try { saved = localStorage.getItem('ideology-my-city'); } catch (e) {}
            grid.appendChild(createCityCurrentCard(saved));
            // 后续卡位：可上传图片，可自行增加
            appendCitySlots(grid, 'row', ['城位一', '城位二', '城位三', '城位四']);
        }

        // ===== 城史通用卡位：上传图片 + 无限增加 =====
        function loadSlotNames(key, initial) {
            try {
                const v = JSON.parse(localStorage.getItem('ideology-slots-' + key));
                if (Array.isArray(v)) return v;
            } catch (e) {}
            return initial.slice();
        }

        function saveSlotNames(key, list) {
            try { localStorage.setItem('ideology-slots-' + key, JSON.stringify(list)); } catch (e) {}
        }

        // prefix：卡位归属前缀（如 '山水·'），图片按 前缀+卡位名 存取，保证各子页专栏卡位互相独立
        function appendCitySlots(container, key, initial, prefix) {
            prefix = prefix || '';
            loadSlotNames(key, initial).forEach(n => {
                const card = document.createElement('div');
                card.className = 'brand-card my-card';
                const dataUrl = loadArtImage(n);
                if (dataUrl) {
                    const frame = document.createElement('div');
                    frame.className = 'my-card-filled art-frame';
                    applyArtFrame(frame, n, dataUrl);
                    enableArtPan(frame, n);
                    card.appendChild(frame);
                } else {
                    const empty = document.createElement('div');
                    empty.className = 'my-card-empty';
                    empty.style.cursor = 'pointer';
                    empty.innerHTML = '<div class="plus">＋</div><div class="hint">导入图片</div>';
                    card.appendChild(empty);
                    card.addEventListener('click', () => importArtImage((d) => { saveArtImage(n, d); refreshCardGrid(); }));
                }
                const tools = document.createElement('div');
                tools.className = 'my-card-tools';
                const rm = document.createElement('button');
                rm.textContent = '移除';
                rm.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeArtImage(n);
                    refreshCardGrid();
                });
                const del = document.createElement('button');
                del.textContent = '删除卡位';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeArtImage(n);
                    saveSlotNames(key, loadSlotNames(key, initial).filter(x => x !== n));
                    renderCityLatest();
                });
                tools.appendChild(rm);
                tools.appendChild(del);
                card.appendChild(tools);
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = prefix ? n.slice(prefix.length) : n;
                card.appendChild(name);
                container.appendChild(card);
            });
            const card = document.createElement('div');
            card.className = 'brand-card my-card';
            const empty = document.createElement('div');
            empty.className = 'my-card-empty';
            empty.style.cursor = 'pointer';
            empty.innerHTML = '<div class="plus">＋</div><div class="hint">增加卡位</div>';
            card.appendChild(empty);
            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = '增加卡位';
            card.appendChild(name);
            card.addEventListener('click', () => {
                const list2 = loadSlotNames(key, initial);
                const raw = (window.prompt('卡位名称（留空自动编号）') || ('卡位' + (list2.length + 1))).trim();
                list2.push(prefix + raw);
                saveSlotNames(key, list2);
                refreshCityViews();
            });
            container.appendChild(card);
        }

        function refreshCityViews() {
            // 只刷新专栏目录；子页卡片区不再被旧版"城位"行覆盖
            renderCityLatest();
        }

        // 专栏目录：邯郸卡 + 本子页专属卡位（每个子页独立，互不串用）
        function renderCityLatest(subpage) {
            const grid = document.getElementById('latest-grid');
            if (!grid) return;
            subpage = subpage || currentSubpage;
            if (!subpage) return;
            grid.innerHTML = '';
            grid.appendChild(createCard('city', 'latest', 'Handan 邯郸'));
            const key = 'citylatest:' + subpage.name;
            const prefix = subpage.name + '·';
            appendCitySlots(grid, key, ['卡片二', '卡片三', '卡片四', '卡片五'].map(n => prefix + n), prefix);
        }

        function createCityCurrentCard(savedText) {
            const card = document.createElement('div');
            card.className = 'brand-card my-card';
            if (savedText) {
                const entry = SITE_DATA.city.designers.find(n => n.endsWith(' ' + savedText));
                const key = entry || savedText;
                const asset = BRAND_ASSETS[key];
                if (asset) {
                    const filled = document.createElement('div');
                    filled.className = 'my-card-filled';
                    filled.style.backgroundImage = `url("${asset.folder}/${asset.cardImage || asset.cover}")`;
                    card.appendChild(filled);
                    const name = document.createElement('div');
                    name.className = 'card-name';
                    name.textContent = savedText;
                    card.appendChild(name);
                    // 点击 → 视觉意识形态内页
                    card.addEventListener('click', () => showBrandAssets(key));
                    // 悬停工具：取消当前城市
                    const tools = document.createElement('div');
                    tools.className = 'my-card-tools';
                    const del = document.createElement('button');
                    del.textContent = '取消';
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        try { localStorage.removeItem('ideology-my-city'); } catch (e2) {}
                        refreshCityCards();
                    });
                    tools.appendChild(del);
                    card.appendChild(tools);
                } else {
                    const gray = document.createElement('div');
                    gray.className = 'my-card-gray';
                    card.appendChild(gray);
                    const name = document.createElement('div');
                    name.className = 'card-name';
                    name.textContent = savedText;
                    card.appendChild(name);
                }
            } else {
                const empty = document.createElement('div');
                empty.className = 'my-card-empty';
                empty.style.cursor = 'default';
                empty.innerHTML = '<div class="plus">◇</div><div class="hint">在右上角选择你的城市</div>';
                card.appendChild(empty);
            }
            return card;
        }

        function refreshCityCards() {
            renderMyCards(document.getElementById('card-grid'), 'city');
        }

        function createMyCard(index, data, type) {
            const card = document.createElement('div');
            card.className = 'brand-card my-card';
            if (data && BRAND_ASSETS[data.brand]) {
                const asset = BRAND_ASSETS[data.brand];
                const filled = document.createElement('div');
                filled.className = 'my-card-filled';
                // 收录卡统一展示该品牌的设计师肖像（cardImage）
                filled.style.backgroundImage = `url("${asset.folder}/${asset.cardImage || asset.cover}")`;
                card.appendChild(filled);
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = data.brand;
                card.appendChild(name);
                // 点击收录卡 → 进入该品牌的视觉意识形态内页
                card.addEventListener('click', () => showBrandAssets(data.brand));
                // 悬停工具：进入官网购买 / 移除
                const tools = document.createElement('div');
                tools.className = 'my-card-tools';
                const shop = document.createElement('button');
                shop.textContent = '进入官网购买';
                shop.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (asset.site) window.open(asset.site, '_blank');
                });
                const del = document.createElement('button');
                del.textContent = '移除';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const cards = loadMyCards(type);
                    cards[index] = null;
                    saveMyCards(cards, type);
                    renderMyCards(document.getElementById('card-grid'), type);
                });
                tools.appendChild(shop);
                tools.appendChild(del);
                card.appendChild(tools);
            } else if (data) {
                // 已收录但未建素材库：灰色占位卡，显示名称，无点击功能
                const gray = document.createElement('div');
                gray.className = 'my-card-gray';
                card.appendChild(gray);
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = data.brand;
                card.appendChild(name);
            } else {
                const empty = document.createElement('div');
                empty.className = 'my-card-empty';
                empty.innerHTML = '<div class="plus">+</div><div class="hint">' + (type === 'city' ? '收录城市' : '收录品牌') + '</div>';
                card.appendChild(empty);
                card.addEventListener('click', () => openPicker(index, type));
            }
            return card;
        }

        // ===== 弹出选择器：按栏目类型选条目 → 选素材图 → 收录到卡片 =====
        let pickerSlot = null;
        let pickerBrand = null;
        let pickerType = 'brand';

        function openPicker(slot, type) {
            pickerSlot = slot;
            pickerType = type || 'brand';
            pickerBrand = null;
            ensurePicker();
            renderPicker();
            document.getElementById('card-picker').classList.add('open');
        }

        function closePicker() {
            document.getElementById('card-picker').classList.remove('open');
        }

        function ensurePicker() {
            if (document.getElementById('card-picker')) return;
            const overlay = document.createElement('div');
            overlay.id = 'card-picker';
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closePicker();
            });
            const panel = document.createElement('div');
            panel.className = 'picker-panel';
            overlay.appendChild(panel);
            document.body.appendChild(overlay);
        }

        function renderPicker() {
            const asset = pickerBrand ? BRAND_ASSETS[pickerBrand] : null;
            const panel = document.querySelector('#card-picker .picker-panel');
            panel.innerHTML = '';

            const close = document.createElement('button');
            close.className = 'picker-close';
            close.textContent = '×';
            close.addEventListener('click', closePicker);
            panel.appendChild(close);

            const title = document.createElement('div');
            title.className = 'picker-title';
            title.textContent = `${pickerType === 'city' ? '收录城市' : '收录品牌'} · 卡片${'一二三四五'[pickerSlot]}`;
            panel.appendChild(title);

            const brands = document.createElement('div');
            brands.className = 'picker-brands';
            // 只列出本栏目类型的条目：品牌收品牌、城史收城史（A-Z 排序）
            // 点击品牌名即完成收录——展示图统一用该品牌的设计师肖像，不再逐张选图
            Object.keys(BRAND_ASSETS).filter(b => (BRAND_ASSETS[b].type || 'brand') === pickerType).sort((a, b) => a.localeCompare(b)).forEach(b => {
                const btn = document.createElement('button');
                btn.textContent = b;
                btn.addEventListener('click', () => {
                    const cards = loadMyCards(pickerType);
                    cards[pickerSlot] = { brand: b };
                    saveMyCards(cards, pickerType);
                    closePicker();
                    renderMyCards(document.getElementById('card-grid'), pickerType);
                });
                brands.appendChild(btn);
            });
            panel.appendChild(brands);

            const tip = document.createElement('div');
            tip.className = 'picker-tip';
            tip.textContent = '点击品牌名完成收录 · 收录后统一展示设计师肖像';
            panel.appendChild(tip);
        }

        // 创建卡片（图片加载失败时显示灰色占位块）
        function createCard(category, subpage, cardName) {
            const card = document.createElement('div');
            card.className = 'brand-card';

            // 已收录品牌：整卡可点击进入品牌素材页
            if (BRAND_ASSETS[cardName]) {
                card.classList.add('brand-link');
                card.addEventListener('click', () => showBrandAssets(cardName));
            }

            const img = document.createElement('img');
            img.className = 'card-img';
            img.src = cardImagePath(category, subpage, cardName);
            img.alt = cardName;
            img.onerror = function() {
                const placeholder = document.createElement('div');
                placeholder.className = 'card-img';
                img.replaceWith(placeholder);
            };

            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = cardName;

            // 配置了获取指南的素材库：卡片右上角提供"跳转网站"工具按钮（与移除按钮同位置）
            const asset = BRAND_ASSETS[cardName];
            if (asset && asset.guide) {
                card.classList.add('my-card');
                const tools = document.createElement('div');
                tools.className = 'my-card-tools';
                const jump = document.createElement('a');
                jump.className = 'tool-link';
                jump.href = asset.guide.url;
                jump.target = '_blank';
                jump.rel = 'noopener';
                jump.textContent = '跳转网站';
                jump.addEventListener('click', (e) => e.stopPropagation()); // 不触发整卡进入素材页
                tools.appendChild(jump);
                // 收录按钮：品牌 → 收录卡位；绘画 → 绘画薄册收录区
                const collect = document.createElement('button');
                collect.className = 'tool-link';
                const isBrand = (asset.type || 'brand') === 'brand' && category === 'brand';
                const isArtPainter = asset.type === 'art';
                if (isBrand) {
                    const cards = loadMyCards('brand');
                    const already = cards.some(c => c && c.brand === cardName);
                    collect.textContent = already ? '已收录' : '收录';
                    if (already) collect.style.backgroundColor = '#000';
                    collect.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const cs = loadMyCards('brand');
                        if (cs.some(c => c && c.brand === cardName)) {
                            const idx = cs.findIndex(c => c && c.brand === cardName);
                            cs[idx] = null;
                            collect.textContent = '收录';
                            collect.style.backgroundColor = '';
                        } else {
                            const empty = cs.findIndex(c => !c);
                            cs[empty >= 0 ? empty : cs.length - 1] = { brand: cardName };
                            collect.textContent = '已收录';
                            collect.style.backgroundColor = '#000';
                        }
                        saveMyCards(cs, 'brand');
                        const topGrid = document.getElementById('card-grid');
                        if (topGrid) renderMyCards(topGrid, 'brand');
                    });
                    tools.appendChild(collect);
                }
                if (isArtPainter) {
                    let collected = [];
                    try { collected = JSON.parse(localStorage.getItem('artCollected') || '[]'); } catch (e) { collected = []; }
                    const already = collected.includes(cardName);
                    collect.textContent = already ? '已收录' : '收录';
                    if (already) collect.style.backgroundColor = '#000';
                    collect.addEventListener('click', (e) => {
                        e.stopPropagation();
                        let c = [];
                        try { c = JSON.parse(localStorage.getItem('artCollected') || '[]'); } catch (e2) { c = []; }
                        if (c.includes(cardName)) {
                            c = c.filter(x => x !== cardName);
                            collect.textContent = '收录';
                            collect.style.backgroundColor = '';
                        } else {
                            c.push(cardName);
                            collect.textContent = '已收录';
                            collect.style.backgroundColor = '#000';
                        }
                        localStorage.setItem('artCollected', JSON.stringify(c));
                        renderCollectGrid();
                    });
                    tools.appendChild(collect);
                }
                card.appendChild(tools);
            }

            card.appendChild(img);
            card.appendChild(name);
            return card;
        }

        // 渲染一个栏目：大标题 + 子导航 + 精选卡区(3张) + LATEST IN(5张/行 + 名录)
        function renderCategory(category) {
            const data = SITE_DATA[category];
            const main = document.getElementById('site-main');
            main.innerHTML = '';

            // 栏目大标题
            const hero = document.createElement('div');
            hero.className = 'category-hero';
            hero.innerHTML = `<h1>${data.hero}</h1>`;
            main.appendChild(hero);

            // 子导航
            const subNav = document.createElement('nav');
            subNav.className = 'sub-nav';
            const ul = document.createElement('ul');
            data.subpages.forEach((sp, i) => {
                const li = document.createElement('li');
                li.textContent = sp.name;
                if (i === 0) li.classList.add('active');
                li.addEventListener('click', () => {
                    ul.querySelectorAll('li').forEach(x => x.classList.remove('active'));
                    li.classList.add('active');
                    renderCardGrid(category, sp);
                });
                ul.appendChild(li);
            });
            subNav.appendChild(ul);
            main.appendChild(subNav);

            // 精选卡片区（row3：一行3张）
            const gridSection = document.createElement('div');
            gridSection.className = 'card-section';
            const grid = document.createElement('div');
            grid.className = 'card-grid row5';
            grid.id = 'card-grid';
            gridSection.appendChild(grid);
            main.appendChild(gridSection);

            // 专栏名（原 LATEST IN 标题；艺术跟随子页命名，其余栏目用栏目级 column，缺省仍为 LATEST IN）
            const latestTitle = document.createElement('div');
            latestTitle.className = 'latest-title';
            latestTitle.textContent = category === 'art'
                ? `${data.subpages[0].name}薄册`
                : (data.column || `LATEST IN ${data.hero.split(' ')[0]}`);
            main.appendChild(latestTitle);

            // 收录区：位于"绘画薄册"专栏标题与素材库卡位之间（仅绘画子页显示）
            if (category === 'art') {
                const collectSec = document.createElement('div');
                collectSec.id = 'art-collect-sec';
                collectSec.className = 'card-section';
                collectSec.style.padding = '0 45px';
                const ct = document.createElement('div');
                ct.className = 'collect-title';
                ct.textContent = '收录 · COLLECTED';
                collectSec.appendChild(ct);
                const cwrap = document.createElement('div');
                cwrap.className = 'card-grid row5';
                cwrap.id = 'collect-grid';
                collectSec.appendChild(cwrap);
                main.appendChild(collectSec);
                renderCollectGrid();
            }

            // LATEST IN：左侧品牌名录 + 右侧5张/行卡片
            const latestFlex = document.createElement('div');
            latestFlex.className = 'latest-flex';

            const latestSection = document.createElement('div');
            latestSection.className = 'card-section';
            latestSection.style.padding = '0';
            const latestGrid = document.createElement('div');
            latestGrid.id = 'latest-grid';
            latestGrid.className = 'card-grid row5';
            if (category === 'city') {
                // 城史专栏目录：每个子页独立卡位，由 renderCardGrid 按当前子页填充
            } else {
                // 卡位排序：品牌 A-Z；绘画按薄册目录（artGroups）顺序，空卡位垫底
                let cards = [...data.latestCards, ...(data.guideCards || [])];
                if (category === 'brand') {
                    cards = [...new Set(cards)].sort((a, b) => a.localeCompare(b));
                }
                if (category === 'art' && data.artGroups) {
                    const oi = {};
                    let k = 0;
                    data.artGroups.forEach(g => g.members.forEach(n => { if (!(n in oi)) oi[n] = k++; }));
                    cards.sort((a, b) => (a in oi ? oi[a] : 9999) - (b in oi ? oi[b] : 9999));

                cards.forEach(cardName => {
                    latestGrid.appendChild(createCard(category, 'latest', cardName));

            latestSection.appendChild(latestGrid);
            latestFlex.appendChild(latestSection);
            main.appendChild(latestFlex);

            // 名录：艺术按流派分组；城史用右上角"当前城市"小组件；品牌按 A-Z

            if (category === 'brand') { renderBrandFab(main, data); }

            // 默认渲染第一个子页
            renderCardGrid(category, data.subpages[0]);

        // 渲染某子页的精选卡片（品牌、城史 = 我的名录；艺术 = 导入图片卡/定表；其他 = 占位卡）
        function renderCardGrid(category, subpage) {

            }
            if (category === 'brand') {

                const lt = document.querySelector('.latest-title');

                document.querySelectorAll('.eco-page').forEach(x => x.remove());

            }
            if (category === 'city') {

                const lt = document.querySelector('.latest-title');
                if (lt && subpage.column) lt.textContent = subpage.column;
                // 专栏目录卡位：本子页专属
                renderCityLatest(subpage);
                if (subpage.name === '我的城市神祇') { renderLightCards(grid); return; }
                // 各意象分类子页：按各自名称的卡位导入图片（山水一~十六、景点一~十六等）
                subpage.cards.forEach(n => grid.appendChild(createArtCard(n)));
                return;
            }
            if (category === 'city') {
                // 每个子页的专栏名用各自命名（近郊山水 / 城市公园等）
                const lt = document.querySelector('.latest-title');
                if (lt && subpage.column) lt.textContent = subpage.column;
                // 专栏目录卡位：本子页专属
                renderCityLatest(subpage);
                if (subpage.name === '我的城市神祇') { renderLightCards(grid); return; }
                // 各意象分类子页：按各自名称的卡位导入图片（山水一~十六、景点一~十六等）
                subpage.cards.forEach(n => grid.appendChild(createArtCard(n)));
                return;
            }
            if (category === 'art') {
                if (subpage.name === '定表') {
                    renderDingbiao(grid);
                    // 定表：只展示收录的图片，隐藏专栏名、卡片行与名录

                    grid.style.paddingBottom = '80px';
                } else {
                    subpage.cards.forEach((n, idx) => grid.appendChild(createArtCard(n, null, { firstBtn: { index: idx, cards: subpage.cards } })));
                    updateArtDirectory(subpage);
                    renderArtLatest(subpage);
                    grid.style.paddingBottom = '';
                    const lf = document.querySelector('.latest-flex');
                    if (lf) lf.style.display = '';
                    const lt = document.querySelector('.latest-title');
                    if (lt) { lt.style.display = ''; lt.textContent = `${subpage.name}薄册`; }
                }
                return;
            }
            // 家居"我的家"：通栏大图在最上 → 八个功能房导入卡 → 自定义卡 → 增加卡片
            if (category === 'home' && subpage.name === '我的家') {
                const functions = { '入户': '转换', '客厅': '信仰', '厨房': '大展身手', '餐厅': '用餐', '卫浴': '净化', '卧室': '安全', '会议室': '思考', '衣帽间': '整衣不烦躁' };
                grid.appendChild(createHomeBigImage());
                subpage.cards.forEach(n => grid.appendChild(createArtCard(n, functions[n] || '')));
                loadHomeCards().forEach(c => grid.appendChild(createArtCard(c.name, c.func || '', { custom: true })));

        // ===== 艺术栏目：卡牌导入图片（存浏览器本地，自动压缩） =====
        function artImgKey(name) { return 'ideology-art-img:' + name; }

        function loadArtImage(name) {
            try { return localStorage.getItem(artImgKey(name)); } catch (e) { return null; }
        }

        function saveArtImage(name, dataUrl) {
            try { localStorage.setItem(artImgKey(name), dataUrl); }
            catch (e) { alert('浏览器本地存储空间不足，图片未能保存（可换小一点的图）'); }
        }

        function removeArtImage(name) {
            try { localStorage.removeItem(artImgKey(name)); } catch (e) {}
        }

        // 图片在卡内的显示位置（双击拖拽调整，按卡名保存）
        function artPosKey(name) { return 'ideology-art-pos:' + name; }

        function loadArtPos(name) {
            try {
                const v = JSON.parse(localStorage.getItem(artPosKey(name)));
                if (v && typeof v.x === 'number') return v;
            } catch (e) {}
            return { x: 50, y: 50 };
        }

        function saveArtPos(name, pos) {
            try { localStorage.setItem(artPosKey(name), JSON.stringify(pos)); } catch (e) {}
        }

        function applyArtFrame(el, name, dataUrl) {
            // 完整显示：图片按 contain 适配，空余部分白色填充，卡框保持标准尺寸
            el.style.backgroundImage = `url("${dataUrl}")`;
            el.style.backgroundSize = 'contain';
            el.style.backgroundRepeat = 'no-repeat';
            el.style.backgroundPosition = 'center';
            el.style.backgroundColor = '#ffffff';
        }

        // 选择本机图片 → 压缩到最长边1200px → 回调返回 dataURL
        function importArtImage(cb, maxPx) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.addEventListener('change', () => {
                const file = input.files && input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const max = maxPx || 1200;
                        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
                        const c = document.createElement('canvas');
                        c.width = Math.round(img.naturalWidth * scale);
                        c.height = Math.round(img.naturalHeight * scale);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        cb(c.toDataURL('image/jpeg', 0.85));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
            input.click();
        }

        function refreshCardGrid() {
            renderCardGrid(currentCategory, currentSubpage || SITE_DATA[currentCategory].subpages[0]);
        }

        function createArtCard(cardName, subtitle, opts) {
            opts = opts || {};
            const card = document.createElement('div');
            card.className = 'brand-card my-card art-card';
            const dataUrl = loadArtImage(cardName);
            if (dataUrl) {
                const frame = document.createElement('div');
                frame.className = 'my-card-filled art-frame';
                applyArtFrame(frame, cardName, dataUrl);
                card.appendChild(frame);
                // 悬停工具
                const tools = document.createElement('div');
                tools.className = 'my-card-tools';
                if (opts.firstBtn) {
                    const first = document.createElement('button');
                    first.textContent = '置于首位';
                    first.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // 把当前卡轮换到首位：原首图依次后移一位
                        const seq = opts.firstBtn.cards.slice(0, opts.firstBtn.index + 1);
                        const imgs = seq.map(n => loadArtImage(n));
                        const last = imgs.pop();
                        imgs.unshift(last);
                        seq.forEach((n, i) => {
                            if (imgs[i]) saveArtImage(n, imgs[i]);
                            else removeArtImage(n);
                        });
                        refreshCardGrid();
                    });
                    tools.appendChild(first);
                }
                const del = document.createElement('button');
                del.textContent = '移除';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeArtImage(cardName);
                    if (opts.custom) {
                        // 自定义卡：连卡片本身一起删除
                        const list = loadHomeCards().filter(c => c.name !== cardName);
                        saveHomeCards(list);
                    }
                    refreshCardGrid();
                });
                tools.appendChild(del);
                card.appendChild(tools);
            } else {
                const empty = document.createElement('div');
                empty.className = 'my-card-empty';
                empty.innerHTML = '<div class="plus">＋</div><div class="hint">导入图片</div>';
                card.appendChild(empty);
            }
            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = cardName;
            card.appendChild(name);
            if (subtitle) {
                const sub = document.createElement('div');
                sub.className = 'card-sub';
                sub.textContent = subtitle;
                card.appendChild(sub);
            }
            // 点击触发导入 = 仅空卡；已导入的卡点击不触发任何功能
            if (!dataUrl) {
                card.addEventListener('click', () => {
                    importArtImage((d) => { saveArtImage(cardName, d); refreshCardGrid(); });
                });
            }
            return card;
        }

        // 家居自定义卡：名称 + 功能词（存浏览器本地）
        function loadHomeCards() {
            try {
                const v = JSON.parse(localStorage.getItem('ideology-home-cards'));
                if (Array.isArray(v)) return v;
            } catch (e) {}
            return [];
        }

        function saveHomeCards(list) {
            try { localStorage.setItem('ideology-home-cards', JSON.stringify(list)); } catch (e) {}
        }

        function createHomeAddCard() {
            const card = document.createElement('div');
            card.className = 'brand-card my-card';
            const empty = document.createElement('div');
            empty.className = 'my-card-empty';
            empty.style.cursor = 'pointer';
            empty.innerHTML = '<div class="plus">＋</div><div class="hint">增加卡片</div>';
            card.appendChild(empty);
            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = '增加卡片';
            card.appendChild(name);
            card.addEventListener('click', () => {
                const name2 = window.prompt('房间名称（例如：阳台）');
                if (!name2) return;
                const func = window.prompt('功能（一句话，例如：晒太阳放松）') || '';
                const list = loadHomeCards();
                list.push({ name: name2.trim(), func: func.trim() });
                saveHomeCards(list);
                refreshCardGrid();
            });
            return card;
        }

        // 家居"我的家"：通栏大图（宽度=整行卡片区，完整显示）
        function createHomeBigImage() {
            const wrap = document.createElement('div');
            wrap.style.width = '100%';
            wrap.style.marginBottom = '44px';
            const key = '我的家大图';
            const dataUrl = loadArtImage(key);
            if (dataUrl) {

                const tools = document.createElement('div');
                tools.className = 'my-card-tools';
                tools.style.display = 'flex';

                del.textContent = '移除';

                    e.stopPropagation();
                    removeArtImage(key);
                    refreshCardGrid();
                });
                tools.appendChild(del);
                wrap.appendChild(img);
                wrap.appendChild(tools);
            } else {
                const empty = document.createElement('div');
                empty.className = 'my-card-empty';
                empty.style.aspectRatio = 'auto';
                empty.style.height = '300px';
                empty.style.width = '100%';
                empty.style.cursor = 'pointer';
                empty.innerHTML = '<div class="plus">＋</div><div class="hint">导入全屋大图</div>';
                empty.addEventListener('click', () => {
                    importArtImage((d) => { saveArtImage(key, d); refreshCardGrid(); }, 2000);
                });
                wrap.appendChild(empty);
            }
            return wrap;
        }

        // 定表：汇聚绘画~游戏每个门类的第一张卡（绘画一、雕塑一……游戏一）
        function renderDingbiao(grid) {
            grid.innerHTML = '';

        // 渲染品牌名录：左侧滚动列表（按字母分组）+ 右侧A-Z索引栏
        // 艺术 LATEST IN：按当前子页过滤显示（绘画→画家卡，雕塑→雕塑家卡，定表→全部）
        function renderArtLatest(subpage) {
            const grid = document.getElementById('latest-grid');
            if (!grid) return;
            grid.innerHTML = '';
            // 卡位顺序 = 绘画薄册目录（artGroups）顺序
            const all = Object.keys(BRAND_ASSETS).filter(b => BRAND_ASSETS[b].type === 'art');
            let oi = null;
            try {
                const groups = SITE_DATA.art.artGroups;
                oi = {};
                let k = 0;
                groups.forEach(g => g.members.forEach(n => { if (!(n in oi)) oi[n] = k++; }));
            } catch (e) {}
            all.sort((a, b) => {
                const ia = oi && (a in oi) ? oi[a] : 9999;
                const ib = oi && (b in oi) ? oi[b] : 9999;
                return ia - ib;
            });
            all.forEach(b => {
                const a = BRAND_ASSETS[b];
                if (a.sub && subpage.name !== '定表' && a.sub !== subpage.name) return;
                grid.appendChild(createCard('art', subpage.name, b));
            });
        }

        // ===== 城史：右上角"当前城市"小组件（点开下滑/搜索选城市） =====
