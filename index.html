            label.innerHTML = '<span>视觉意识形态</span>';
            page.appendChild(label);

            // 获取指南（阶段一）：跳转网站已收进素材墙卡位，此处不再显示肖像卡与教程
            const hasCollected = !!(asset.folder && asset.images && asset.images.length);
            if (hasCollected) {
                const collected = document.createElement('div');
                collected.className = 'bp-collected';
                collected.textContent = '已收录素材 · COLLECTED';
                page.appendChild(collected);
                const grid = document.createElement('div');
                grid.className = 'assets-grid';
                const mkCard = (cls, kicker, title, enter, onClick, cap) => {
                    // 卡面只留居中的竖排标题，kicker/enter 参数保留仅为兼容旧调用
                    const item = document.createElement('figure');
                    item.className = 'asset-item ' + cls;
                    const cover = document.createElement('div');
                    cover.className = 'article-cover';
                    const t = document.createElement('div');
                    t.className = 'ac-title';
                    t.textContent = title;
                    cover.appendChild(t);
                    // 暗纹首字：取标题第一个字/字母
                    cover.dataset.wm = title.charAt(0);
                    cover.addEventListener('click', onClick);
                    const fc = document.createElement('figcaption');
                    fc.textContent = cap;
                    item.appendChild(cover);
                    item.appendChild(fc);
                    return item;
                };
                const mkImage = (file, cap) => {
                    const item = document.createElement('figure');
                    item.className = 'asset-item';
                    const img = document.createElement('img');
                    img.src = `${asset.folder}/${file}`;
                    img.alt = cap;
                    img.loading = 'lazy';
                    img.addEventListener('click', () => openLightbox(img.src));
                    const fc = document.createElement('figcaption');
                    fc.textContent = cap;
                    item.appendChild(img);
                    item.appendChild(fc);
                    return item;
                };
                // 设计师本人肖像（cardImage 才是肖像，cover 可能是制作卡牌）：与其他素材一样进瀑布流
                // images 里若配了同一张图（图注含设计师姓名介绍），沿用素材库的原文图注，不再另起"设计师肖像"
                const portrait = asset.cardImage || asset.cover;
                const dupPortrait = asset.images.find(([file]) => file === portrait);
                grid.appendChild(mkImage(portrait, dupPortrait ? dupPortrait[1] : (asset.coverLabel || '设计师肖像')));
                // 瀑布流顺序：设计师肖像 → 灵感缪斯 → 海报图(广告大片) → 建筑环境 → 秀场(按年份从低到高)
                const catOf = (f) => {
                    if (f.startsWith('portrait-founder')) return '1';
                    if (f.startsWith('portrait-muse')) return '2';
                    if (f.startsWith('campaign')) return '3';
                    if (f.startsWith('venue')) return '4';
                    if (f.startsWith('runway')) return '5-' + ((f.match(/(\d{4})/) || [0, '9999'])[1]) + '-' + f;
                    return '6-' + f;
                };
                asset.images.filter(([file]) => file !== portrait)
                    .sort((x, y) => catOf(x[0]).localeCompare(catOf(y[0])))
                    .forEach(([file, cap]) => grid.appendChild(mkImage(file, cap)));
                page.appendChild(grid);
                // 意识形态卡牌：通栏大图，单独压在素材墙最下方（cover 与肖像同图时没有独立卡牌，跳过）
                if (asset.cover && asset.cover !== portrait) {
                    const big = document.createElement('figure');
                    big.className = 'asset-item card-full';
                    const img = document.createElement('img');
                    img.src = `${asset.folder}/${asset.cover}`;
                    img.alt = '意识形态卡牌 · CARD';
                    img.loading = 'lazy';
                    img.addEventListener('click', () => openLightbox(img.src));
                    const fc = document.createElement('figcaption');
                    fc.textContent = '意识形态卡牌 · CARD';
                    big.appendChild(img);
                    big.appendChild(fc);
                    page.appendChild(big);
                }
                // 叙事文章全文：无滚动、完整展开，压在素材墙最下方
                if (asset.article && asset.article.html) {
                    const art = document.createElement('section');
                    art.className = 'bp-inline-art';
                    art.innerHTML = asset.article.html;
                    page.appendChild(art);
                }
            }

            // 跳转网站入口：收在页面最末（文章/素材墙之后）；艺术类画家旁加"收录"按钮
            if (asset.guide) {
                const tailRow = document.createElement('div');
                tailRow.className = 'bp-tailrow';
                const tailJump = document.createElement('div');
                const link = document.createElement('a');
                link.className = 'bp-title-jump';
                link.href = asset.guide.url;
                link.target = '_blank';
                link.rel = 'noopener';
                link.textContent = asset.guide.site + ' ↗';
                tailJump.appendChild(link);
                tailRow.appendChild(tailJump);
                // 艺术类画家：收录按钮（收录后出现在绘画薄册专栏的收录区）
                if (asset.type === 'art') {
                    let collected = [];
                    try { collected = JSON.parse(localStorage.getItem('artCollected') || '[]'); } catch (e) { collected = []; }
                    const isOn = collected.includes(name);
                    const btn = document.createElement('button');
                    btn.className = 'bp-collect-btn' + (isOn ? ' on' : '');
                    btn.textContent = isOn ? '✓ 已收录' : '☆ 收录';
                    btn.addEventListener('click', () => {
                        let c = [];
                        try { c = JSON.parse(localStorage.getItem('artCollected') || '[]'); } catch (e) { c = []; }
                        if (c.includes(name)) c = c.filter(x => x !== name);
                        else c.push(name);
                        localStorage.setItem('artCollected', JSON.stringify(c));
                        const st = main.scrollTop;
                        renderBrandPage(name);
                        main.scrollTop = st;
                    });
                    tailRow.appendChild(btn);
                }
                // 品牌：收录按钮（收录后进入品牌栏目的收录卡位）
                if ((asset.type || 'brand') === 'brand') {
                    const cards0 = loadMyCards('brand');
                    const already = cards0.some(c => c && c.brand === name);
                    const cbtn = document.createElement('button');
                    cbtn.className = 'bp-collect-btn' + (already ? ' on' : '');
                    cbtn.textContent = already ? '✓ 已收录' : '☆ 收录';
                    cbtn.addEventListener('click', () => {
                        const cards = loadMyCards('brand');
                        if (cards.some(c => c && c.brand === name)) {
                            // 已收录：再点一次 = 取消收录
                            const idx = cards.findIndex(c => c && c.brand === name);
                            cards[idx] = null;
                        } else {
                            const empty = cards.findIndex(c => !c);
                            cards[empty >= 0 ? empty : cards.length - 1] = { brand: name };
                        }
                        saveMyCards(cards, 'brand');
                        const st = main.scrollTop;
                        renderBrandPage(name);
                        main.scrollTop = st;
                    });
                    tailRow.appendChild(cbtn);
                }
                page.appendChild(tailRow);
            }

            main.appendChild(page);
            main.scrollTop = 0;
        }

        // hash 路由：#brand=<品牌名> ↔ 栏目页
        function routeFromHash() {
            const m = location.hash.match(/^#brand=(.+)$/);
            const name = m ? decodeURIComponent(m[1]) : null;
            if (name && BRAND_ASSETS[name]) {
                renderBrandPage(name);
            } else {
                renderCategory(currentCategory);
            }
        }
        window.addEventListener('hashchange', () => {
            if (suppressHashChange) { suppressHashChange = false; return; }
            routeFromHash();
        });

        // 灯箱：大图预览，点击任意处关闭
        function openLightbox(src) {
            let lb = document.getElementById('lightbox');
            if (!lb) {
                lb = document.createElement('div');
                lb.id = 'lightbox';
                lb.addEventListener('click', () => lb.classList.remove('open'));
                const big = document.createElement('img');
                lb.appendChild(big);
                document.body.appendChild(lb);
            }
            lb.querySelector('img').src = src;
            lb.classList.add('open');
        }

        // ===== 叙事文章全屏阅读层：进入/退出（Esc 或点"退出全屏"） =====
        function openArticleOverlay(asset) {
            let ov = document.getElementById('article-overlay');
            if (!ov) {
                ov = document.createElement('div');
                ov.id = 'article-overlay';
                const close = document.createElement('button');
                close.className = 'article-overlay-close';
                close.textContent = '退出全屏 ✕';
                close.addEventListener('click', () => ov.classList.remove('open'));
                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape') ov.classList.remove('open');
                });
                const frame = document.createElement('iframe');
                frame.title = 'article';
                ov.appendChild(close);
                ov.appendChild(frame);
                document.body.appendChild(ov);
            }
            ov.querySelector('iframe').src = `${asset.folder}/${asset.article.file}`;
            ov.classList.add('open');
        }

        // 正文滚动区高度 = 窗口高度 - 顶栏实际高度（顶栏固定不参与滚动）
        function layoutMainScrollArea() {
            const header = document.querySelector('.site-header');
            const main = document.getElementById('site-main');
            if (!header || !main) return;
            const h = header.offsetHeight;
            main.style.top = h + 'px';
            main.style.height = (window.innerHeight - h) + 'px';
        }
        window.addEventListener('resize', layoutMainScrollArea);

        // 旧卡位名迁移：天色→山水、鸟兽→景点（把已导入的图片和位置数据搬到新名字下）
        (function migrateCardNames() {
            const nums = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五', '十六'];
            [['天色', '山水'], ['鸟兽', '景点']].forEach(pair => {
                nums.forEach(n => {
                    try {
                        const img = localStorage.getItem('ideology-art-img:' + pair[0] + n);
                        if (img && !localStorage.getItem('ideology-art-img:' + pair[1] + n)) {
                            localStorage.setItem('ideology-art-img:' + pair[1] + n, img);
                            localStorage.removeItem('ideology-art-img:' + pair[0] + n);
                        }
                        const pos = localStorage.getItem('ideology-art-pos:' + pair[0] + n);
                        if (pos && !localStorage.getItem('ideology-art-pos:' + pair[1] + n)) {
                            localStorage.setItem('ideology-art-pos:' + pair[1] + n, pos);
                            localStorage.removeItem('ideology-art-pos:' + pair[0] + n);
                        }
                    } catch (e) {}
                });
            });
            // PLAY一~十六 → GAME1~16（阿拉伯数字新格式）
            for (let i = 1; i <= 16; i++) {
                try {
                    const img = localStorage.getItem('ideology-art-img:PLAY' + nums[i - 1]);
                    if (img && !localStorage.getItem('ideology-art-img:GAME' + i)) {
                        localStorage.setItem('ideology-art-img:GAME' + i, img);
                        localStorage.removeItem('ideology-art-img:PLAY' + nums[i - 1]);
                    }
                    const pos = localStorage.getItem('ideology-art-pos:PLAY' + nums[i - 1]);
                    if (pos && !localStorage.getItem('ideology-art-pos:GAME' + i)) {
                        localStorage.setItem('ideology-art-pos:GAME' + i, pos);
                        localStorage.removeItem('ideology-art-pos:PLAY' + nums[i - 1]);
                    }
                } catch (e) {}
            }
        })();

        // 旧共享专栏卡位迁移：原来五个子页共用的卡位列表整体划归"我的城市神祇"名下
        (function migrateCityLatestSlots() {
            try {
                const old = localStorage.getItem('ideology-slots-latest');
                if (!old) return;
                if (!localStorage.getItem('ideology-slots-citylatest:我的城市神祇')) {
                    const list = JSON.parse(old);
                    if (Array.isArray(list)) {
                        localStorage.setItem('ideology-slots-citylatest:我的城市神祇', JSON.stringify(list.map(n => '我的城市神祇·' + n)));
                    }
                }
                localStorage.removeItem('ideology-slots-latest');
            } catch (e) {}
        })();

        // 初始化：主导航切换 + 默认渲染（带 hash 时直接进入品牌内页）
        document.addEventListener('DOMContentLoaded', function() {
            layoutMainScrollArea();
            document.querySelector('.main-nav ul').addEventListener('click', function(e) {
                const clickedItem = e.target.closest('li');
                if (!clickedItem) return;

                document.querySelectorAll('.main-nav li').forEach(item => {
                    item.classList.remove('active');
                });
                clickedItem.classList.add('active');

                currentCategory = clickedItem.getAttribute('data-category');
                if (location.hash) {
                    suppressHashChange = true;
                    location.hash = '';
                }
                renderCategory(currentCategory);
            });

            currentCategory = 'brand';
            if (location.hash) {
                routeFromHash();
            } else {
                renderCategory('brand');
            }
        });
    </script>
</body>
